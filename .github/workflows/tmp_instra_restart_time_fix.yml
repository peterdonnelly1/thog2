name: Temporary Instra restart-time fix

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/tmp_instra_restart_time_fix.yml
      - tmp_fix_instra_live_time_restart.py

permissions:
  contents: write

jobs:
  apply_and_verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Apply restart-time fix
        run: python tmp_fix_instra_live_time_restart.py
      - name: Verify
        run: |
          python -m compileall -q sheet/local_dashboard_live_loss.py
          git diff --check
          python -m pytest -q tests/test_instra_live_loss.py tests/test_local_dashboard_wandb_time_axes.py tests/test_local_chart_dashboard.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sheet/local_dashboard_live_loss.py tests/test_instra_live_loss.py
          git commit -m 'Fix Instra live-time restart anchoring'
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
