name: Temporary PREMAT target10 and Instra changes

# retry with the dashboard test dependency present
on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/premat_target10_instra_patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tmp_premat_target10_instra_patch.py')
          lines = path.read_text().splitlines()
          replaced = 0
          for index, line in enumerate(lines):
              if 'assert "NOT YET REACHED</span><span class=' in line:
                  lines[index] = '    assert "NOT YET REACHED</span><span" not in html'
                  replaced += 1
          if replaced != 1:
              raise RuntimeError(f'expected one generated assertion to repair, got {replaced}')
          path.write_text('\n'.join(lines) + '\n')
          PY
          python tmp_premat_target10_instra_patch.py
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Run focused checks
        run: |
          python -m compileall -q sheet run_thog2_owt_core.py tests/test_premat.py
          git diff --check
          python -m pytest -q tests/test_premat.py tests/test_premat_allocator_aware_admission.py tests/test_premat_history_immutability.py tests/test_premat_instra.py
          node --check sheet/local_dashboard_assets/dashboard_premat.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet/premat.py sheet/run_config.py sheet/training_config.py sheet/model.py run_thog2_owt_core.py sheet/wandb_telemetry.py sheet/local_dashboard_assets/index.html sheet/local_dashboard_assets/dashboard_premat.css sheet/local_dashboard_assets/dashboard_premat.js tests/test_premat.py
          git commit -m "Add PREMAT 1-then-0 targeting and refine Instra"
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
