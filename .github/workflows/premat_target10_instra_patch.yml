name: Temporary PREMAT target10 and Instra changes

# retry with regression expectations aligned to the intended behaviour
on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/premat_target10_instra_patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tmp_premat_target10_instra_patch.py')
          lines = path.read_text().splitlines()
          replaced = 0
          for index, line in enumerate(lines):
              if 'assert "NOT YET REACHED</span><span class=' in line:
                  lines[index] = '    assert "NOT YET REACHED</span><span" not in html'
                  replaced += 1
          if replaced != 1:
              raise RuntimeError(f'expected one generated assertion to repair, got {replaced}')
          path.write_text('\n'.join(lines) + '\n')
          PY
          python tmp_premat_target10_instra_patch.py
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/test_premat.py')
          text = path.read_text()
          text = text.replace(
              'def test_public_cli_exposes_exactly_the_twelve_premat_options() -> None:',
              'def test_public_cli_exposes_exactly_the_thirteen_premat_options() -> None:',
              1,
          )
          text = text.replace(
              '        "--premat",\n        "--premat_attention_mode",',
              '        "--premat",\n        "--premat_allocator_aware_admission",\n        "--premat_attention_mode",',
              1,
          )
          text = text.replace(
              '    assert weight.recorded_streams[-1] is fake_cuda.main_stream\n',
              '    assert weight.recorded_streams[-1] is runtime._stream\n',
              1,
          )
          pattern = r'''def test_cumulative_charge_blocks_second_candidate_without_bypass\(monkeypatch\) -> None:\n.*?\n\ndef test_lifecycle_rejects_illegal_transition'''
          replacement = '''def test_cumulative_charge_blocks_unaffordable_candidates_without_head_of_line_blocking(monkeypatch) -> None:
    runtime, fake_cuda, calls = _runtime(
        monkeypatch,
        stay_below_current_peak=False,
    )
    fake_cuda.free = 1_300
    fake_cuda.total = 1_400
    runtime.layer_start(3)

    # DOWN fits, UP is blocked, O still gets its own admission test and fits,
    # while QKV remains blocked.  A blocked matrix must not head-of-line block
    # a later independently affordable candidate.
    assert calls == [("DOWN", 5), ("O", 5)]
    report = runtime.report()
    deferred_families = {
        event.get("family")
        for event in report["events"]
        if event.get("event") == "admission_deferred"
    }
    assert {"UP", "QKV"} <= deferred_families
    assert report["memory"]["premat_cumulative_charged_bytes"] > 512


def test_lifecycle_rejects_illegal_transition'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError(f'failed to update cumulative-charge regression: {count}')
          path.write_text(text)

          path = Path('tests/test_premat_instra.py')
          text = path.read_text()
          text = text.replace(
              'def test_live_writer_replaces_the_active_update_without_growing_history(tmp_path: Path) -> None:',
              'def test_live_writer_freezes_first_completed_update_without_growing_history(tmp_path: Path) -> None:',
              1,
          )
          text = text.replace('        assert snapshots[0]["pass_sequence"] == 2\n', '        assert snapshots[0]["pass_sequence"] == 1\n', 1)
          text = text.replace('CONSUMING - NO WAITING', 'CONSUMING - NO WAIT')
          text = text.replace('PREMAT NOT STARTED - MAIN CODE MATERIALISING', 'PREMAT NOT STARTED - MAIN STREAM MATERIALISING')
          text = text.replace('MAIN CODE CONSUMING', 'MAIN STREAM CONSUMING')
          old = '''    for state_class in (
        "premat-neutral", "premat-pending", "premat-state-materialising", "premat-state-available",
        "premat-state-consuming-full", "premat-state-consumed-full",
        "premat-state-waiting", "premat-state-consuming-waited",
        "premat-state-consumed-waited", "premat-state-main-materialising",
        "premat-state-main-consuming", "premat-state-consumed-main",
    ):
        assert f".{state_class}" in css
        assert state_class in index
    for label in (
        "PROCESSING", "OUTCOMES", "OUT OF SCOPE", "NOT YET REACHED",
        "PRE-MATERIALISING", "CONSUMING - NO WAIT",
        "WAITING FOR PRE-MATERIALISATION", "CONSUMING AFTER WAIT",
        "PREMAT NOT STARTED - MAIN STREAM MATERIALISING", "MAIN STREAM CONSUMING",
        "FULL HIT", "PARTIAL HIT", "COMPLETE MISS",
    ):
        assert label in normalized_index
'''
          new = '''    for state_class in (
        "premat-neutral", "premat-pending", "premat-state-materialising", "premat-state-available",
        "premat-state-consuming-full", "premat-state-consumed-full",
        "premat-state-waiting", "premat-state-consuming-waited",
        "premat-state-consumed-waited", "premat-state-main-materialising",
        "premat-state-main-consuming", "premat-state-consumed-main",
    ):
        assert f".{state_class}" in css
        if state_class not in {"premat-neutral", "premat-pending"}:
            assert state_class in index
    for label in (
        "FULL SUCCESS", "PART SUCCESS", "MISS",
        "PRE-MATERIALISING", "AVAILABLE", "CONSUMING - NO WAIT",
        "WAITING FOR PRE-MATERIALISATION", "CONSUMING AFTER WAIT",
        "PREMAT NOT STARTED - MAIN STREAM MATERIALISING", "MAIN STREAM CONSUMING",
        "FULL HIT", "PARTIAL HIT", "COMPLETE MISS",
    ):
        assert label in normalized_index
    assert "OUT OF SCOPE" not in normalized_index
    assert "NOT YET REACHED" not in normalized_index
'''
          if old not in text:
              raise RuntimeError('failed to locate old Instra key regression block')
          text = text.replace(old, new, 1)
          text = text.replace(
              '    assert \'min="10" max="2000" step="10" value="250"\' in index\n',
              '    assert \'min="1" max="1000" step="1" value="100"\' in index\n',
              1,
          )
          text = text.replace(
              '    assert "PREMAT_FINAL_HOLD_MS = 1000" in javascript\n',
              '    assert "PREMAT_FINAL_HOLD_MS = 250" in javascript\n',
              1,
          )
          text = text.replace(
              '    assert "grid-template-columns: repeat(9, minmax(100px, 1fr))" in css\n',
              '    assert ".premat-key-flow" in css\n    assert ".premat-key-arrow" in css\n',
              1,
          )
          path.write_text(text)
          PY
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Run focused checks
        run: |
          python -m compileall -q sheet run_thog2_owt_core.py tests/test_premat.py tests/test_premat_instra.py
          git diff --check
          python -m pytest -q tests/test_premat.py tests/test_premat_allocator_aware_admission.py tests/test_premat_history_immutability.py tests/test_premat_instra.py
          node --check sheet/local_dashboard_assets/dashboard_premat.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet/premat.py sheet/run_config.py sheet/training_config.py sheet/model.py run_thog2_owt_core.py sheet/wandb_telemetry.py sheet/local_dashboard_assets/index.html sheet/local_dashboard_assets/dashboard_premat.css sheet/local_dashboard_assets/dashboard_premat.js tests/test_premat.py tests/test_premat_instra.py
          git commit -m "Add PREMAT 1-then-0 targeting and refine Instra"
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
