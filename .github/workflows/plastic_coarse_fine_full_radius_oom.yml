name: Apply PLASTIC full-radius OOM recovery

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_full_radius_oom.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: write

jobs:
  apply_candidate_recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply full-radius candidate recovery
        run: |
          python tools/repair_plastic_full_radius_oom_tool.py
          if ! grep -q '_plastic_depth_recoverable_probe_candidate_suffix' sheet/training_model.py; then
            python tools/apply_plastic_full_radius_oom.py
          fi
          python tools/apply_plastic_full_radius_oom_overlay.py

      - name: Verify overlay ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("sheet/__init__.py").read_text()
          coarse = text.index("plastic_depth_coarse_fine_patch")
          recovery = text.index("plastic_depth_full_radius_oom_patch")
          audit = text.index("plastic_depth_audit_patch")
          assert coarse < recovery < audit
          PY

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Compile recovery path
        run: |
          python -m py_compile \
            sheet/plastic_depth_inline.py \
            sheet/plastic_depth_full_radius_oom_patch.py \
            sheet/training_model.py \
            sheet/__init__.py

      - name: Run candidate recovery and affected FINE tests
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_full_radius_oom.py \
            tests/test_plastic_depth_full_radius.py \
            tests/test_plastic_depth_audit.py \
            tests/test_plastic_depth_transition_control_plane.py \
            tests/test_plastic_depth_controller_stability.py

      - name: Commit full-radius candidate recovery
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/apply_plastic_full_radius_oom.py \
            sheet/training_model.py \
            sheet/__init__.py
          git commit -m 'Integrate candidate-local PLASTIC upward OOM recovery'
          git fetch origin PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git rebase origin/PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
