name: Temporary PREMAT GPU wait classification patch

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/premat_gpu_wait_classification_patch.yml
      - tmp_premat_gpu_wait_classification_patch.py
      - tmp_premat_gpu_wait_regression_fix.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: |
          python tmp_premat_gpu_wait_classification_patch.py
          python tmp_premat_gpu_wait_regression_fix.py
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Run focused verification
        run: |
          python -m compileall -q sheet run_thog2_owt_core.py tests/test_premat.py tests/test_premat_instra.py
          git diff --check
          python -m pytest -q tests/test_premat.py tests/test_premat_allocator_aware_admission.py tests/test_premat_history_immutability.py tests/test_premat_instra.py
          node --check sheet/local_dashboard_assets/dashboard_premat.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet/premat.py sheet/wandb_telemetry.py sheet/local_dashboard_assets/dashboard_premat.js tests/test_premat.py tests/test_premat_instra.py
          git commit -m "Classify PREMAT hits on GPU dependency timing"
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
