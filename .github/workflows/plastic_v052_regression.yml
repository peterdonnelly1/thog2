name: Validate PLASTIC v0.52 directional coherence

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
  pull_request:
    branches:
      - PLASTIC_DEPTH
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Audit retired min-probes references in active tests
        run: |
          git grep -n 'plastic__layer_count_min_probes' -- tests || true

      - name: Syntax
        run: |
          bash -n train_OWT.sh
          bash -n train_OWT_core.sh
          python -m py_compile constants.py sheet/plastic_depth_directional_coherence_patch.py tests/test_plastic_depth_directional_coherence_v052.py

      - name: V0.52 focused tests
        run: python -m pytest -q tests/test_plastic_depth_directional_coherence_v052.py

      - name: Existing controller and console regression
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_full_radius.py \
            tests/test_plastic_depth_warmup_guard.py \
            tests/test_plastic_depth_console_minor_patch.py \
            tests/test_plastic_cli_console_refinements.py \
            tests/test_plastic_cli_cost_and_label_patch.py \
            tests/test_plastic_depth_startup_lookahead_ui.py \
            tests/test_plastic_depth_audit.py

      - name: Config checkpoint and lifecycle regression
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_config.py \
            tests/test_plastic_depth_checkpoint_equivalence.py \
            tests/test_plastic_depth_lifecycle.py \
            tests/test_plastic_depth_coarse_real_lifecycle.py

# vvv THOG CPU regression gate for the v0.52 directional-controller and console revision; use the real audit regression module
# ^^^ THOG
