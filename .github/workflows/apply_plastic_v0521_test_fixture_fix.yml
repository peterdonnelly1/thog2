name: Apply PLASTIC v0.521 fixture fix and implementation

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - tools/apply_plastic_v0521_test_fixture_fix.py
      - .github/workflows/apply_plastic_v0521_test_fixture_fix.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply_and_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply v0.521 and fixture correction
        run: python tools/apply_plastic_v0521_test_fixture_fix.py

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Syntax and source-history audit
        run: |
          bash -n train_OWT.sh
          bash -n train_OWT_core.sh
          python -m py_compile \
            run_thog2_owt_core.py \
            sheet/training_config.py \
            sheet/run_config.py \
            sheet/trainer_checkpoint_resume.py \
            sheet/plastic_depth_probe_sampling_v0521_patch.py \
            sheet/plastic_depth_probe_se_v0521_patch.py \
            tests/stage3_test_support.py \
            tests/test_plastic_depth_probe_sampling_v0521.py \
            tests/test_plastic_depth_audit.py \
            tests/test_plastic_cli_console_refinements.py
          git diff --check

      - name: Focused v0.521 tests
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_probe_sampling_v0521.py \
            tests/test_plastic_depth_directional_coherence_v052.py \
            tests/test_plastic_cli_console_refinements.py \
            tests/test_console_and_descriptor_help.py

      - name: Affected PLASTIC regression
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_inline_probe.py \
            tests/test_plastic_depth_full_radius.py \
            tests/test_plastic_depth_full_radius_oom.py \
            tests/test_plastic_depth_audit.py \
            tests/test_plastic_depth_warmup_guard.py \
            tests/test_plastic_depth_checkpoint_format.py \
            tests/test_plastic_depth_resume.py \
            tests/test_plastic_depth_lifecycle.py \
            tests/test_plastic_depth_lifecycle_checkpoint.py \
            tests/test_plastic_depth_coarse_real_lifecycle.py \
            tests/test_run_thog2_owt_startup_report.py

      - name: Commit validated v0.521 implementation
        run: |
          git restore -- .github/workflows
          if git diff --quiet && [[ -z "$(git status --porcelain --untracked-files=normal)" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete PLASTIC v0.521 regression and spec cleanup'
          for attempt in 1 2 3; do
            git fetch origin PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
            if git rebase origin/PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION && git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1

# vvv THOG same-repository PR validation has contents:write, so the green gate itself writes back its generated source/spec cleanup instead of relying on an opaque push-only twin
# ^^^ THOG
