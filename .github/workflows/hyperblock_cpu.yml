name: HYPERBLOCK CPU

on:
  pull_request:
    branches:
      - MODIFIED_FAST_DISCARD_FALSE_CASE
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch pytest

      - name: Compile Python sources
        run: |
          python -m compileall -q sheet tests

      - name: Validate wrapper syntax
        run: |
          bash -n train_OWT.sh train_OWT_core.sh

      - name: Run HYPERBLOCK tests
        run: |
          PYTHONPATH=. pytest -q tests/test_hyperblock*.py
