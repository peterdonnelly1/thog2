name: HYPERBLOCK Final Fix

on:
  pull_request:
    branches:
      - MODIFIED_FAST_DISCARD_FALSE_CASE
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-final-fix-once:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable HYPERBLOCK branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fix here-document history placement and exact test counts
        run: |
          python - <<'PY'
          from pathlib import Path

          wrapper = Path("train_OWT_core.sh")
          text = wrapper.read_text()
          emitted_history = (
              '  # vvv THOG preserve the exact pre-HYPERBLOCK console line for source history\n'
              '  # model/preset/basis: $display_model_type / $geometry_preset_value / $basis_family_value\n'
              '  # ^^^ THOG\n'
          )
          text = text.replace(emitted_history, "")
          anchor = '  cat <<EOF_RUN\nscruffy OWT train\n'
          preserved_history = (
              '  # vvv THOG preserve the exact pre-HYPERBLOCK console line outside the emitted here-document\n'
              '  # model/preset/basis: $display_model_type / $geometry_preset_value / $basis_family_value\n'
              '  # ^^^ THOG\n'
          )
          if preserved_history not in text:
              if anchor not in text:
                  raise RuntimeError("missing run-summary here-document anchor")
              text = text.replace(anchor, preserved_history + anchor, 1)
          wrapper.write_text(text)

          for path in (
              Path("docs/THOG2_Coupled_Field_Machine_Hyperblock_Requirements_Specification_v0.3.md"),
              Path("docs/THOG2_Coupled_Field_Machine_Hyperblock_Implementation_Status_v0.2.md"),
          ):
              content = path.read_text()
              content = content.replace("54 passing CPU tests", "49 passing CPU tests")
              content = content.replace("54 passed", "49 passed")
              path.write_text(content)
          PY
          bash -n train_OWT_core.sh
          grep -n "49 pass" docs/THOG2_Coupled_Field_Machine_Hyperblock_Requirements_Specification_v0.3.md docs/THOG2_Coupled_Field_Machine_Hyperblock_Implementation_Status_v0.2.md

      - name: Commit final fix
        run: |
          if git diff --quiet; then
            echo "Final fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add train_OWT_core.sh docs/THOG2_Coupled_Field_Machine_Hyperblock_Requirements_Specification_v0.3.md docs/THOG2_Coupled_Field_Machine_Hyperblock_Implementation_Status_v0.2.md
          git commit -m "Fix HYPERBLOCK wrapper regression and validation counts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
