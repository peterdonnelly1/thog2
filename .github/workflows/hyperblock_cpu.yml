name: HYPERBLOCK Validation

on:
  pull_request:
    branches:
      - MODIFIED_FAST_DISCARD_FALSE_CASE
      - COUPLED_FIELD_MACHINE_HYPERBLOCk
  workflow_dispatch:

jobs:
  dedicated-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out HYPERBLOCK branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch pytest

      - name: Compile Python sources
        run: |
          python -m compileall -q sheet tests run_thog2_owt_core.py

      - name: Validate wrapper syntax
        run: |
          bash -n train_OWT.sh train_OWT_core.sh

      - name: Run dedicated HYPERBLOCK tests
        run: |
          PYTHONPATH=. pytest -q tests/test_hyperblock*.py

  head-versus-base-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out HYPERBLOCK head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0

      - name: Check out exact base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch pytest psutil tensorboard

      - name: Audit preservation of replaced source lines
        run: |
          python head/tests/hyperblock_source_history_check.py \
            --repository head \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --output hyperblock-source-history.json

      - name: Compare every legacy test file with the base
        run: |
          python head/tests/hyperblock_regression_compare.py \
            --head head \
            --base base \
            --output hyperblock-regression-comparison.json \
            --timeout-seconds 240

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperblock-validation-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            hyperblock-source-history.json
            hyperblock-regression-comparison.json
          retention-days: 14
