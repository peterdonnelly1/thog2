name: HYPERBLOCK CPU

on:
  pull_request:
    branches:
      - MODIFIED_FAST_DISCARD_FALSE_CASE
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch pytest

      - name: Compile Python sources
        run: |
          python -m compileall -q sheet tests

      - name: Run HYPERBLOCK tests
        run: |
          if compgen -G 'tests/test_hyperblock*.py' > /dev/null; then
            PYTHONPATH=. pytest -q tests/test_hyperblock*.py
          else
            echo 'No HYPERBLOCK tests exist yet.'
          fi

      - name: Upload checked-out source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hyperblock-source-snapshot
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 2
