name: Apply PLASTIC warmup console header follow-up

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/apply_plastic_warmup_console_header_followup.yml
      - tools/apply_plastic_warmup_console_header_followup.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply follow-up
        run: python tools/apply_plastic_warmup_console_header_followup.py

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Compile touched modules
        run: |
          python -m py_compile \
            run_thog2_owt.py \
            sheet/plastic_depth_probe_interval_patch.py \
            sheet/plastic_depth_warmup_guard_patch.py \
            sheet/plastic_depth_probe_sampling_v0521_patch.py

      - name: Run focused PLASTIC tests
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_warmup_guard.py \
            tests/test_plastic_depth_probe_sampling_v0521.py \
            tests/test_run_thog2_owt_startup_report.py \
            tests/test_plastic_depth_audit.py \
            tests/test_plastic_depth_directional_coherence_v052.py

      - name: Commit generated source and test updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            run_thog2_owt.py \
            tests/test_plastic_depth_probe_sampling_v0521.py \
            tests/test_run_thog2_owt_startup_report.py
          git commit -m 'Complete PLASTIC warmup and probe console refinements'
          git fetch origin PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git rebase origin/PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
