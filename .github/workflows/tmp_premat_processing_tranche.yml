# vvv THOG
name: temporary PREMAT processing tranche

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - tmp_premat_processing_tranche.py
      - tmp_premat_processing_helper_repair.py
      - .github/workflows/tmp_premat_processing_tranche.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest torch matplotlib plotly
      - name: Repair processing helper anchor
        run: python tmp_premat_processing_helper_repair.py
      - name: Apply processing tranche
        run: python tmp_premat_processing_tranche.py
      - name: Syntax checks
        run: |
          python -m compileall -q sheet run_thog2_owt.py run_thog2_owt_core.py run_thog2_local_dashboard.py tests/test_premat_processing.py
          node --check sheet/local_dashboard_assets/dashboard_processing.js
          git diff --check
      - name: Targeted tests
        run: |
          pytest -q tests/test_premat_processing.py tests/test_premat.py
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sheet run_thog2_owt.py run_thog2_owt_core.py run_thog2_local_dashboard.py tests/test_premat_processing.py
          git commit -m "Add INSTRA PREMAT processing diagnostics"
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
# ^^^ THOG
