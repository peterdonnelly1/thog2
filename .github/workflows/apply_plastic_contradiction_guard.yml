# vvv THOG temporary PR-triggered gate for contradictory PLASTIC checkpoint metadata
name: Apply PLASTIC contradiction guard

on:
  pull_request:
    branches:
      - PLASTIC_DEPTH
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: plastic-contradiction-guard
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.head_ref == 'PLASTIC_DEPTH_CONTRADICTION_GUARD'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact contradiction-guard branch
        uses: actions/checkout@v4
        with:
          ref: PLASTIC_DEPTH_CONTRADICTION_GUARD
          fetch-depth: 0
          clean: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU test dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pytest psutil tensorboard tiktoken wandb matplotlib plotly
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify and apply contradiction patch
        run: |
          set -euo pipefail
          base64 --decode docs/plastic_contradiction_guard.patch.gz.b64 | gzip --decompress > /tmp/plastic_contradiction_guard.patch
          echo '621c64b26cb0069e84d2f23bac3609a964a75a27e8ac0bf5f6d442b44690d2d6  /tmp/plastic_contradiction_guard.patch' | sha256sum --check --strict
          git apply --check /tmp/plastic_contradiction_guard.patch
          git apply /tmp/plastic_contradiction_guard.patch
          git diff --check

      - name: Compile and validate shell syntax
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python -m compileall -q run_thog2_owt.py run_thog2_owt_core.py sheet tests
          bash -n train_OWT.sh train_OWT_core.sh resume_and_fork_OWT.sh plastic_depth_gpu_smokes.sh

      - name: Run focused PLASTIC tests
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_plastic_depth.py \
            tests/test_plastic_depth_gauge.py \
            tests/test_plastic_depth_optimizer.py \
            tests/test_plastic_depth_inline_probe.py \
            tests/test_plastic_depth_controller.py \
            tests/test_plastic_depth_cuda.py \
            tests/test_plastic_depth_basis_cache.py \
            tests/test_plastic_depth_interfaces.py \
            tests/test_plastic_depth_checkpoint_format.py

      - name: Run affected checkpoint/resume regressions
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_sheet_stage6_trainer.py \
            tests/test_sheet_stage6_run_config.py \
            tests/test_sheet_stage6_restart.py \
            tests/test_sheet_stage4_checkpointing.py \
            tests/test_sheet_stage4_restore.py \
            tests/test_sheet_stage4_state.py \
            tests/test_resume_identity_and_throughput.py \
            tests/test_resume_and_diagnostics_regressions.py \
            tests/test_resume_and_fork_cpu_integration.py

      - name: Run two-rank CPU DDP check
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python tests/plastic_depth_ddp_check.py

      - name: Commit tested contradiction guard without workflow mutation
        run: |
          set -euo pipefail
          git rm docs/plastic_contradiction_guard.patch.gz.b64
          git add sheet/checkpoints.py tests/test_plastic_depth_checkpoint_format.py
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Reject contradictory PLASTIC checkpoint metadata'
          git push origin HEAD:PLASTIC_DEPTH_CONTRADICTION_GUARD
# ^^^ THOG
