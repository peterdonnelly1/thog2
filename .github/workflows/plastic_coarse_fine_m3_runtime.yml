name: Apply PLASTIC COARSE FINE M3 runtime

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_m3_runtime.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: write

jobs:
  apply_coarse_runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply COARSE runtime policy when absent
        run: |
          if ! grep -q 'PLASTIC COARSE trainer has no sampling lattice' sheet/plastic_depth_fresh_state.py; then
            python tools/apply_plastic_coarse_fine_m3_runtime.py
          fi

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Compile changed runtime modules
        run: |
          python -m py_compile \
            sheet/plastic_depth_fresh_state.py \
            sheet/trainer_step.py \
            sheet/plastic_depth_lookahead_patch.py

      - name: Run COARSE runtime and lifecycle tests
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_fresh_state.py \
            tests/test_plastic_depth_coarse_trials.py \
            tests/test_plastic_depth_coarse_runtime.py \
            tests/test_plastic_depth_lifecycle.py

      - name: Commit fixed COARSE runtime policy
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sheet/plastic_depth_fresh_state.py \
            sheet/trainer_step.py \
            sheet/plastic_depth_lookahead_patch.py
          git commit -m 'Enforce fixed PLASTIC COARSE runtime semantics'
          git fetch origin PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git rebase origin/PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
