name: Validate PLASTIC COARSE FINE regression

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_regression.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: read

jobs:
  cpu_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy tiktoken tensorboard wandb psutil

      - name: Compile changed production modules
        run: |
          python -m py_compile \
            run_thog2_lifecycle.py \
            run_thog2_owt.py \
            run_thog2_owt_core.py \
            sheet/plastic_depth_coarse.py \
            sheet/plastic_depth_coarse_checkpoint.py \
            sheet/plastic_depth_coarse_runner.py \
            sheet/plastic_depth_fresh_state.py \
            sheet/plastic_depth_lifecycle.py \
            sheet/plastic_depth_pause.py \
            sheet/plastic_depth_resume.py \
            sheet/plastic_depth_coarse_fine_patch.py \
            sheet/plastic_depth_full_radius_oom_patch.py \
            sheet/plastic_depth_audit_patch.py \
            sheet/training_model.py \
            sheet/trainer_step.py \
            sheet/trainer_checkpoint_save.py \
            sheet/trainer_checkpoint_resume.py \
            sheet/wandb_telemetry.py

      - name: Validate public shell syntax
        run: |
          bash -n train_OWT.sh
          bash -n plastic_depth_lookahead_wrapper_options.sh

      - name: Run full CPU test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests \
            --deselect=tests/test_plastic_depth_console_minor_patch.py::PlasticDepthConsoleMinorPatchTests::test_final_alignment_runs_after_late_formatter_tabs \
            2>&1 | tee broad_regression.log

      - name: Print compact regression failure summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cache_path = Path('.pytest_cache/v/cache/lastfailed')
          if cache_path.exists():
              failed = json.loads(cache_path.read_text(encoding='utf-8'))
              print('PYTEST_LASTFAILED_BEGIN')
              for node_id in sorted(failed):
                  print(node_id)
              print('PYTEST_LASTFAILED_END')
          else:
              print('PYTEST_LASTFAILED_UNAVAILABLE')
          PY
          echo 'PYTEST_LOG_TAIL_BEGIN'
          tail -n 250 broad_regression.log || true
          echo 'PYTEST_LOG_TAIL_END'

      - name: Retain complete regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plastic-coarse-fine-broad-regression-log
          path: broad_regression.log
          if-no-files-found: error
