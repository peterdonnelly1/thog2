name: Validate PLASTIC COARSE FINE regression

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_regression.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: read

jobs:
  cpu_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy tiktoken tensorboard wandb psutil

      # vvv THOG compile the complete v0.56 objective-neutral decision stack before focused and broad regression
      - name: Compile changed production modules
        run: |
          python -m py_compile \
            constants.py \
            run_thog2_lifecycle.py \
            run_thog2_owt.py \
            run_thog2_owt_core.py \
            sheet/plastic_depth_coarse.py \
            sheet/plastic_depth_coarse_checkpoint.py \
            sheet/plastic_depth_coarse_runner.py \
            sheet/plastic_depth_directional_coherence_patch.py \
            sheet/plastic_depth_fresh_state.py \
            sheet/plastic_depth_lifecycle.py \
            sheet/plastic_depth_pause.py \
            sheet/plastic_depth_resume.py \
            sheet/plastic_depth_coarse_fine_patch.py \
            sheet/plastic_depth_full_radius_oom_patch.py \
            sheet/plastic_depth_cuda_headroom_guard_patch.py \
            sheet/plastic_depth_audit_patch.py \
            sheet/plastic_depth_console_postfix_patch.py \
            sheet/plastic_depth_console_compact_layout_patch.py \
            sheet/plastic_depth_wall_time_equivalent_time_gain_patch.py \
            sheet/plastic_depth_wall_time_v0531_integration_patch.py \
            sheet/plastic_depth_same_batch_all_probes_patch.py \
            sheet/plastic_depth_same_batch_resume_config_patch.py \
            sheet/plastic_depth_same_batch_visibility_patch.py \
            sheet/plastic_depth_theil_sen_kendall_patch.py \
            sheet/plastic_depth_theil_sen_kendall_bootstrap_fix_patch.py \
            sheet/plastic_depth_theil_sen_kendall_resume_config_patch.py \
            sheet/plastic_depth_theil_sen_kendall_console_fix_patch.py \
            sheet/plastic_depth_sen_kendall_v055_patch.py \
            sheet/plastic_depth_sen_kendall_v055_boundary_fix_patch.py \
            sheet/plastic_depth_console_alignment_v055_patch.py \
            sheet/plastic_depth_sen_kendall_v055_runtime_fix_patch.py \
            sheet/plastic_depth_sen_kendall_v055_audit_fix_patch.py \
            sheet/plastic_depth_v055_same_batch_audit_bridge_patch.py \
            sheet/plastic_depth_v055_growth_side_discount_patch.py \
            sheet/plastic_depth_v055_growth_side_help_patch.py \
            sheet/plastic_depth_v055_growth_side_startup_patch.py \
            sheet/plastic_depth_wandb_probe_curves_patch.py \
            sheet/plastic_depth_v056_objective_decision_patch.py \
            sheet/plastic_depth_v056_transition_highlight_patch.py \
            sheet/plastic_depth_v056_help_patch.py \
            sheet/training_model.py \
            sheet/trainer_step.py \
            sheet/trainer_checkpoint_save.py \
            sheet/trainer_checkpoint_resume.py \
            sheet/wandb_telemetry.py \
            .github/scripts/classify_plastic_coarse_fine_failures.py
      # ^^^ THOG

      - name: Validate public shell syntax
        run: |
          bash -n train_OWT.sh
          bash -n plastic_depth_lookahead_wrapper_options.sh

      # vvv THOG fail fast on the new v0.56 objective/decision matrix, exclusivity, help and transition-display contracts before paying for the complete suite
      - name: Run focused PLASTIC v0.56 tests
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_v056_objective_decision.py \
            tests/test_plastic_depth_v056_transition_highlight.py \
            tests/test_plastic_depth_v056_help.py \
            tests/test_plastic_depth_sen_kendall_v055.py \
            tests/test_plastic_depth_v055_growth_side_discount.py \
            tests/test_plastic_depth_v055_growth_side_persistence.py \
            tests/test_plastic_depth_v055_growth_side_startup.py \
            tests/test_plastic_depth_v055_same_batch_audit_bridge.py \
            tests/test_plastic_depth_cuda_headroom_guard.py
      # ^^^ THOG

      - name: Run full CPU test suite
        id: branch_suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests 2>&1 | tee broad_regression.log

      # vvv THOG make successful pytest classification an explicit success path and reserve baseline classification only for a genuinely failed suite
      - name: Record successful complete CPU suite
        if: always() && steps.branch_suite.outcome == 'success'
        run: |
          : > branch_only_failures.txt
          echo 'Regression classification: complete CPU suite passed; 0 branch-only failures.'

      - name: Classify failed suite against untouched PLASTIC_DEPTH
        if: always() && steps.branch_suite.outcome != 'success'
        run: |
          : > branch_only_failures.txt
          python .github/scripts/classify_plastic_coarse_fine_failures.py

      - name: Show retained pytest tail
        if: always()
        run: |
          echo 'PYTEST_LOG_TAIL_BEGIN'
          tail -n 250 broad_regression.log || true
          echo 'PYTEST_LOG_TAIL_END'
      # ^^^ THOG

      - name: Retain complete regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plastic-coarse-fine-broad-regression-log
          path: |
            broad_regression.log
            branch_only_failures.txt
            docs/THOG2_COARSE_FINE_INHERITED_FAILURES.txt
          if-no-files-found: error

# vvv THOG complete-suite no-new-failures gate against the recorded untouched-PLASTIC_DEPTH baseline; no test deselection
# ^^^ THOG
