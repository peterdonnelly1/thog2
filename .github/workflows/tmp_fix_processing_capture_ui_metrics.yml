# vvv THOG temporary application/verification workflow for Processing diagnostic repairs
name: Temporary Processing diagnostic repairs
on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - tmp_fix_processing_capture_ui_metrics.py
      - .github/workflows/tmp_fix_processing_capture_ui_metrics.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply_and_verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Repair temporary transformer append helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tmp_fix_processing_capture_ui_metrics.py')
          text = path.read_text()
          insertion = '''\n\ndef append_end(path: str, addition: str) -> None:\n    target = ROOT / path\n    text = target.read_text(encoding="utf-8")\n    if addition in text:\n        raise RuntimeError(f"{path}: addition already present")\n    target.write_text(text.rstrip() + "\\n" + addition, encoding="utf-8")\n'''
          needle = '''def append_once(path: str, marker: str, addition: str) -> None:\n    target = ROOT / path\n    text = target.read_text(encoding="utf-8")\n    if addition in text:\n        raise RuntimeError(f"{path}: addition already present")\n    count = text.count(marker)\n    if count != 1:\n        raise RuntimeError(f"{path}: expected one append marker, found {count}")\n    target.write_text(text.replace(marker, marker + addition, 1), encoding="utf-8")\n'''
          if needle not in text:
              raise SystemExit('append_once helper not found')
          text = text.replace(needle, needle + insertion, 1)
          start = text.index('# Add a focused gap-overlap regression')
          end = text.index('# Implementation log entry.', start)
          block = text[start:end]
          block = block.replace('append_once(\n    "tests/test_premat_processing.py",\n    \'# ^^^ THOG\\n\',\n', 'append_end(\n    "tests/test_premat_processing.py",\n')
          text = text[:start] + block + text[end:]
          old_log = '''append_once(\n    "THOG2_DYNAMIC_PREMATERIALISATION_LOG.md",\n    '\\n',\n    '- Processing diagnostics now have an explicit wrapper-only `--premat_processing_logging_capture_update` (default 1), decoupling the one bounded Nsight forward capture from ordinary logging cadence. INSTRA shows live tok/s while a run is active and defers the two Nsight-dependent cards until normalized trace data exists; Processing cards now use standard plot mounts/first-render lifecycle. The normalizer recognizes the AD10x `Unallocated Warps in Active SMs` metric alias, records available metric names, and computes Main/PREMAT overlap only across actual Main CUDA-kernel unions rather than semantic-span gaps.\\n',\n)'''
          new_log = '''append_end(\n    "THOG2_DYNAMIC_PREMATERIALISATION_LOG.md",\n    '- Processing diagnostics now have an explicit wrapper-only `--premat_processing_logging_capture_update` (default 1), decoupling the one bounded Nsight forward capture from ordinary logging cadence. INSTRA shows live tok/s while a run is active and defers the two Nsight-dependent cards until normalized trace data exists; Processing cards now use standard plot mounts/first-render lifecycle. The normalizer recognizes the AD10x `Unallocated Warps in Active SMs` metric alias, records available metric names, and computes Main/PREMAT overlap only across actual Main CUDA-kernel unions rather than semantic-span gaps.\\n',\n)'''
          if old_log not in text:
              raise SystemExit('log append block not found')
          path.write_text(text.replace(old_log, new_log, 1))
          PY
      - name: Apply update
        run: python tmp_fix_processing_capture_ui_metrics.py
      - name: Verify
        run: |
          python -m compileall -q sheet/premat_processing.py sheet/training_config.py sheet/run_config.py sheet/trainer_step.py run_thog2_owt_core.py run_thog2_local_dashboard.py tests/test_premat_processing.py
          node --check sheet/local_dashboard_assets/dashboard_processing.js
          node --check sheet/local_dashboard_assets/dashboard_premat.js
          git diff --check
          python -m pytest -q tests/test_premat_processing.py tests/test_premat.py tests/test_resume_identity_and_throughput.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sheet/premat_processing.py sheet/training_config.py sheet/run_config.py sheet/trainer_step.py run_thog2_owt_core.py run_thog2_local_dashboard.py sheet/local_dashboard_assets/index.html sheet/local_dashboard_assets/dashboard_processing.css sheet/local_dashboard_assets/dashboard_processing.js sheet/local_dashboard_assets/dashboard_premat.js tests/test_premat_processing.py THOG2_DYNAMIC_PREMATERIALISATION_LOG.md
          git commit -m 'Repair Processing capture and INSTRA diagnostics'
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
# ^^^ THOG
