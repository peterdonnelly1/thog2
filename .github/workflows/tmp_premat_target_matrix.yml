# vvv THOG
name: Temporary PREMAT target matrix implementation

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - tmp_add_premat_target_matrix.py
      - .github/workflows/tmp_premat_target_matrix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply_and_verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Normalize helper parser block
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tmp_add_premat_target_matrix.py")
          text = path.read_text(encoding="utf-8")
          old = '''    + thog_line('    parser.add_argument("--premat_target_matrix", type=int, choices=(1, 2, 3, 4), default=None, help="Optional fused-family PREMAT selector: 1=QKV, 2=O, 3=UP, 4=DOWN")', "add fixed fused-family PREMAT diagnostic selector")
          '''
          new = '''    + '# vvv THOG fixed fused-family PREMAT diagnostic selector\\n'
              + '    parser.add_argument(\\n'
              + '        "--premat_target_matrix",\\n'
              + '        type=int,\\n'
              + '        choices=(1, 2, 3, 4),\\n'
              + '        default=None,\\n'
              + '        help="Optional fused-family PREMAT selector: 1=QKV, 2=O, 3=UP, 4=DOWN",\\n'
              + '    )\\n'
              + '# ^^^ THOG\\n'
          '''
          if text.count(old) != 1:
              raise RuntimeError(f"expected one long parser helper line, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply target-matrix implementation
        run: python tmp_add_premat_target_matrix.py
      - name: Verify
        run: |
          python -m compileall -q run_thog2_owt_core.py sheet tests/test_premat.py
          git diff --check
          python -m pytest -q tests/test_premat.py tests/test_premat_processing.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add run_thog2_owt_core.py sheet/run_config.py sheet/training_config.py sheet/model.py sheet/premat.py tests/test_premat.py THOG2_DYNAMIC_PREMATERIALISATION_LOG.md
          git commit -m 'Add fused PREMAT target-matrix selector'
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
# ^^^ THOG
