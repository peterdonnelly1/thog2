name: Temporary Premat snapshot throttle

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/premat_snapshot_throttle.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply snapshot-throttle update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sheet/premat.py')
          text = path.read_text()

          start = text.index('def _total_inactive_allocator_bytes(\n')
          end = text.index('\n\n@dataclass\nclass _Candidate:', start)
          helpers = '''def _memory_stat_nonnegative_int(\n    stats: Mapping[str, object],\n    key: str,\n) -> int:\n    value = stats.get(key)\n    if isinstance(value, bool) or not isinstance(value, int) or value < 0:\n        raise ValueError(f"CUDA allocator memory_stats has invalid {key!r}: {value!r}")\n    return int(value)\n\n\ndef _inactive_allocator_bytes_from_stats(stats: Mapping[str, object]) -> int:\n    """Return currently cached bytes that are no longer allocator-active.\n\n    ``active_bytes`` includes allocations awaiting completion on another stream,\n    so ``reserved - active`` deliberately gives those blocks no cautious credit.\n    """\n    reserved = _memory_stat_nonnegative_int(stats, "reserved_bytes.all.current")\n    active = _memory_stat_nonnegative_int(stats, "active_bytes.all.current")\n    if active > reserved:\n        raise ValueError(\n            "CUDA allocator memory_stats reports active bytes above reserved bytes"\n        )\n    return reserved - active\n\n\ndef _conservative_certificate_charge_bytes(request_bytes: int) -> int:\n    """Upper-bound native allocator rounding for one cached-block request.\n\n    PyTorch's configurable native rounding cannot round a request beyond the\n    next power of two.  Using that bound intentionally depletes a cached\n    contiguous-space certificate faster than the normal allocator would.\n    """\n    size = max(0, int(request_bytes))\n    if size == 0:\n        return 0\n    rounded = 1 << (size - 1).bit_length()\n    return max(512, rounded)\n'''
          text = text[:start] + helpers + text[end:]

          old_init = '''        self._pass_start_ns: Optional[int] = None\n        self._active = False\n        self._aggregate = {\n'''
          new_init = '''        self._pass_start_ns: Optional[int] = None\n        self._active = False\n        # Cautious allocator admission snapshots only to certify contiguous\n        # Premat-stream cache.  The certificate is conservatively consumed by\n        # every Premat launch and invalidated whenever CUDA backing is freed.\n        self._allocator_certificate_bytes = {"small": 0, "large": 0}\n        self._allocator_certificate_num_device_free: Optional[int] = None\n        self._allocator_snapshot_count = 0\n        self._aggregate = {\n'''
          if text.count(old_init) != 1:
              raise RuntimeError('unexpected PrematRuntime init marker')
          text = text.replace(old_init, new_init, 1)

          old_agg = '''            "observed_peak_reserved_bytes": 0,\n            "minimum_headroom_bytes": None,\n'''
          new_agg = '''            "observed_peak_reserved_bytes": 0,\n            "minimum_headroom_bytes": None,\n            "allocator_snapshot_count": 0,\n'''
          if text.count(old_agg) != 1:
              raise RuntimeError('unexpected aggregate marker')
          text = text.replace(old_agg, new_agg, 1)

          method_start = text.index('    def _cautious_allocator_aware_rescue(\n')
          method_end = text.index('\n    def _advance(self, *, trigger: str) -> None:\n', method_start)
          new_methods = '''    def _invalidate_allocator_certificate_if_device_freed(\n        self,\n        *,\n        num_device_free: int,\n    ) -> bool:\n        baseline = self._allocator_certificate_num_device_free\n        if baseline is None or int(num_device_free) == int(baseline):\n            return False\n        self._allocator_certificate_bytes["small"] = 0\n        self._allocator_certificate_bytes["large"] = 0\n        self._allocator_certificate_num_device_free = None\n        return True\n\n    def _consume_allocator_certificate(self, request_bytes: int) -> Dict[str, object]:\n        pool = _allocator_pool_for_request(request_bytes)\n        before = int(self._allocator_certificate_bytes.get(pool, 0))\n        charge = _conservative_certificate_charge_bytes(request_bytes)\n        after = max(0, before - charge)\n        self._allocator_certificate_bytes[pool] = after\n        return {\n            "pool": pool,\n            "before_bytes": before,\n            "charge_bytes": charge,\n            "after_bytes": after,\n        }\n\n    def _cautious_allocator_aware_rescue(\n        self,\n        *,\n        observation: PrematMemoryObservation,\n        envelope: CandidateEnvelope,\n        original_decision: AdmissionDecision,\n    ) -> Tuple[AdmissionDecision, Dict[str, object]]:\n        detail: Dict[str, object] = {\n            "mode": "cautious",\n            "attempted": True,\n            "original_admitted": original_decision.admitted,\n            "original_reason": original_decision.reason,\n            "original_predicted_physical_growth_bytes": (\n                original_decision.predicted_physical_growth_bytes\n            ),\n            "predicted_envelope_bytes": envelope.process_envelope_bytes,\n            "premat_materialisation_peak_bytes": envelope.materialisation_peak_bytes,\n            "foreground_overlap_bytes": envelope.foreground_overlap_bytes,\n            "device_index": None,\n            "premat_stream_id": None,\n            "allocator_pool": _allocator_pool_for_request(\n                envelope.materialisation_peak_bytes\n            ),\n            "largest_eligible_inactive_block_bytes": 0,\n            "certified_premat_stream_cache_bytes": 0,\n            "certificate_invalidated_by_device_free": False,\n            "reuse_qualified": False,\n            "inactive_allocator_bytes": 0,\n            "inactive_allocator_bytes_source": "memory_stats_reserved_minus_active",\n            "memory_stats_reserved_bytes": 0,\n            "memory_stats_active_bytes": 0,\n            "memory_stats_num_device_free": 0,\n            "required_allocator_headroom_credit_bytes": 0,\n            "allocator_headroom_credit_bytes": 0,\n            "allocator_credit_bytes": 0,\n            "effective_device_free_bytes": observation.device_free_bytes,\n            "snapshot_performed": False,\n            "allocator_snapshot_count": self._allocator_snapshot_count,\n            "revised_predicted_physical_growth_bytes": (\n                original_decision.predicted_physical_growth_bytes\n            ),\n            "final_admitted": original_decision.admitted,\n            "final_reason": original_decision.reason,\n            "snapshot_error": None,\n        }\n        if self._stream is None or self._device is None:\n            detail["snapshot_error"] = "Premat Stream or CUDA device is not initialized"\n            return original_decision, detail\n\n        device_index = self._device.index\n        if device_index is None:\n            device_index = int(torch.cuda.current_device())\n        stream_id = int(self._stream.cuda_stream)\n        pool = str(detail["allocator_pool"])\n        detail["device_index"] = int(device_index)\n        detail["premat_stream_id"] = stream_id\n\n        try:\n            allocator_backend = torch.cuda.memory.get_allocator_backend()\n            detail["allocator_backend"] = allocator_backend\n            if allocator_backend != "native":\n                detail["snapshot_error"] = (\n                    "cautious allocator-aware admission requires the native CUDA allocator"\n                )\n                return original_decision, detail\n\n            stats = torch.cuda.memory_stats(self._device)\n            reserved_bytes = _memory_stat_nonnegative_int(\n                stats, "reserved_bytes.all.current"\n            )\n            active_bytes = _memory_stat_nonnegative_int(\n                stats, "active_bytes.all.current"\n            )\n            inactive_allocator_bytes = _inactive_allocator_bytes_from_stats(stats)\n            num_device_free = _memory_stat_nonnegative_int(stats, "num_device_free")\n            invalidated = self._invalidate_allocator_certificate_if_device_freed(\n                num_device_free=num_device_free\n            )\n            detail["certificate_invalidated_by_device_free"] = invalidated\n            detail["memory_stats_reserved_bytes"] = reserved_bytes\n            detail["memory_stats_active_bytes"] = active_bytes\n            detail["memory_stats_num_device_free"] = num_device_free\n            detail["inactive_allocator_bytes"] = inactive_allocator_bytes\n\n            certificate = int(self._allocator_certificate_bytes.get(pool, 0))\n            if certificate < envelope.materialisation_peak_bytes:\n                snapshot = torch.cuda.memory_snapshot()\n                detail["snapshot_performed"] = True\n                self._allocator_snapshot_count += 1\n                self._aggregate["allocator_snapshot_count"] = self._allocator_snapshot_count\n                certificate = _largest_same_stream_inactive_block_bytes(\n                    snapshot,\n                    device_index=int(device_index),\n                    stream_id=stream_id,\n                    request_bytes=envelope.materialisation_peak_bytes,\n                )\n                self._allocator_certificate_bytes[pool] = certificate\n                self._allocator_certificate_num_device_free = num_device_free\n            detail["allocator_snapshot_count"] = self._allocator_snapshot_count\n            detail["largest_eligible_inactive_block_bytes"] = certificate\n            detail["certified_premat_stream_cache_bytes"] = certificate\n        except Exception as error:\n            detail["snapshot_error"] = f"{type(error).__name__}: {error}"\n            return original_decision, detail\n\n        reuse_qualified = certificate >= envelope.materialisation_peak_bytes\n        detail["reuse_qualified"] = reuse_qualified\n        if not reuse_qualified:\n            return original_decision, detail\n\n        # Current global headroom comes from cheap allocator counters.  Only\n        # reserved bytes no longer classed active are credited, which excludes\n        # active-awaiting-free blocks.  The complete existing candidate envelope\n        # remains charged, so allocator cache is not double-counted.\n        required_credit = max(\n            0,\n            self._buffer_bytes\n            + envelope.process_envelope_bytes\n            - observation.device_free_bytes,\n        )\n        headroom_credit = min(inactive_allocator_bytes, required_credit)\n        effective_device_free = min(\n            observation.device_total_bytes,\n            observation.device_free_bytes + headroom_credit,\n        )\n        detail["required_allocator_headroom_credit_bytes"] = required_credit\n        detail["allocator_headroom_credit_bytes"] = headroom_credit\n        detail["allocator_credit_bytes"] = headroom_credit\n        detail["effective_device_free_bytes"] = effective_device_free\n\n        adjusted_observation = PrematMemoryObservation(\n            process_allocated_bytes=observation.process_allocated_bytes,\n            process_reserved_bytes=observation.process_reserved_bytes,\n            process_ordinary_peak_bytes=observation.process_ordinary_peak_bytes,\n            device_free_bytes=effective_device_free,\n            device_total_bytes=observation.device_total_bytes,\n        )\n        revised_decision = decide_candidate_admission(\n            observation=adjusted_observation,\n            envelope=envelope,\n            stay_below_current_peak=self._stay_below_current_peak,\n            gpu_memory_buffer_bytes=self._buffer_bytes,\n        )\n        detail["revised_predicted_physical_growth_bytes"] = (\n            revised_decision.predicted_physical_growth_bytes\n        )\n        detail["final_admitted"] = revised_decision.admitted\n        detail["final_reason"] = revised_decision.reason\n        return revised_decision, detail\n'''
          text = text[:method_start] + new_methods + text[method_end:]

          old_decision_detail = '''            if allocator_aware_detail is not None:\n                decision_detail["allocator_aware_admission"] = allocator_aware_detail\n            if decision.admitted:\n                candidate.first_observed_admissible_ns = considered_ns\n'''
          new_decision_detail = '''            if decision.admitted and self._allocator_aware_admission == "cautious":\n                certificate_consumption = self._consume_allocator_certificate(\n                    candidate.envelope.materialisation_peak_bytes\n                )\n                if allocator_aware_detail is not None:\n                    allocator_aware_detail["certificate_consumption"] = certificate_consumption\n                    allocator_aware_detail["certified_premat_stream_cache_bytes_after_admission"] = (\n                        certificate_consumption["after_bytes"]\n                    )\n            if allocator_aware_detail is not None:\n                decision_detail["allocator_aware_admission"] = allocator_aware_detail\n            if decision.admitted:\n                candidate.first_observed_admissible_ns = considered_ns\n'''
          if text.count(old_decision_detail) != 1:
              raise RuntimeError('unexpected decision detail marker')
          text = text.replace(old_decision_detail, new_decision_detail, 1)

          path.write_text(text)

          test_path = Path('tests/test_premat_allocator_aware_admission.py')
          test_path.write_text('''from __future__ import annotations\n\nimport pytest\nimport torch\n\nfrom sheet.premat import (\n    CandidateEnvelope,\n    PrematMemoryObservation,\n    PrematRuntime,\n    _conservative_certificate_charge_bytes,\n    _inactive_allocator_bytes_from_stats,\n    _largest_same_stream_inactive_block_bytes,\n    decide_candidate_admission,\n    validate_premat_configuration,\n)\n\nMIB = 1024 ** 2\n\n\ndef _validation_kwargs(mode: str) -> dict[str, object]:\n    return {\n        "premat": "enabled",\n        "attention_mode": "fused",\n        "stay_below_current_peak": False,\n        "stay_within_global_buffer": True,\n        "gpu_memory_buffer_gb": 0.25,\n        "allocator_aware_admission": mode,\n        "target_layer": 1,\n        "weight_matrix_target_order": "r_to_l",\n        "cuda_stream_priority": "normal",\n        "diagnostic_layer_delay_ms": 0.0,\n        "logging": "disabled",\n        "instra": "disabled",\n    }\n\n\ndef _blocked_case() -> tuple[PrematMemoryObservation, CandidateEnvelope]:\n    return (\n        PrematMemoryObservation(\n            process_allocated_bytes=500 * MIB,\n            process_reserved_bytes=800 * MIB,\n            process_ordinary_peak_bytes=1000 * MIB,\n            device_free_bytes=100 * MIB,\n            device_total_bytes=1000 * MIB,\n        ),\n        CandidateEnvelope(\n            retained_bytes=8 * MIB,\n            materialisation_peak_bytes=8 * MIB,\n            foreground_overlap_bytes=128 * MIB,\n        ),\n    )\n\n\ndef _runtime() -> PrematRuntime:\n    runtime = PrematRuntime(\n        materialize=lambda _family, _layer: torch.empty(1),\n        n_embd=8,\n        n_head=1,\n        attention_mode="fused",\n        stay_below_current_peak=False,\n        gpu_memory_buffer_gb=200 * MIB / (1024 ** 3),\n        allocator_aware_admission="cautious",\n        target_layer=1,\n        weight_matrix_target_order="r_to_l",\n        cuda_stream_priority="normal",\n        diagnostic_layer_delay_ms=0.0,\n        logging_enabled=False,\n    )\n    class FakeStream:\n        cuda_stream = 11\n    runtime._stream = FakeStream()\n    runtime._device = torch.device("cuda:0")\n    return runtime\n\n\ndef _stats(*, reserved=500, active=100, num_device_free=7):\n    return {\n        "reserved_bytes.all.current": reserved * MIB,\n        "active_bytes.all.current": active * MIB,\n        "num_device_free": num_device_free,\n    }\n\n\ndef _snapshot(block_mib=368):\n    return [\n        {\n            "device": 0,\n            "stream": 11,\n            "segment_type": "large",\n            "blocks": [{"state": "inactive", "size": block_mib * MIB}],\n        }\n    ]\n\n\ndef test_inactive_allocator_bytes_uses_reserved_minus_active() -> None:\n    assert _inactive_allocator_bytes_from_stats(_stats(reserved=500, active=180)) == 320 * MIB\n    with pytest.raises(ValueError):\n        _inactive_allocator_bytes_from_stats(_stats(reserved=100, active=101))\n\n\ndef test_largest_block_filters_device_pool_stream_and_state() -> None:\n    snapshot = [\n        {"device": 0, "stream": 11, "segment_type": "large", "blocks": [\n            {"state": "inactive", "size": 64 * MIB},\n            {"state": "active_awaiting_free", "size": 700 * MIB},\n        ]},\n        {"device": 0, "stream": 12, "segment_type": "large", "blocks": [{"state": "inactive", "size": 800 * MIB}]},\n        {"device": 1, "stream": 11, "segment_type": "large", "blocks": [{"state": "inactive", "size": 900 * MIB}]},\n    ]\n    assert _largest_same_stream_inactive_block_bytes(\n        snapshot, device_index=0, stream_id=11, request_bytes=8 * MIB\n    ) == 64 * MIB\n\n\ndef test_certificate_charge_is_conservative_power_of_two_bound() -> None:\n    assert _conservative_certificate_charge_bytes(0) == 0\n    assert _conservative_certificate_charge_bytes(8 * MIB) == 8 * MIB\n    assert _conservative_certificate_charge_bytes(12 * MIB) == 16 * MIB\n    assert _conservative_certificate_charge_bytes(513) == 1024\n\n\ndef test_cautious_uses_stats_headroom_and_reuses_snapshot_certificate(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = decide_candidate_admission(\n        observation=observation, envelope=envelope,\n        stay_below_current_peak=False, gpu_memory_buffer_bytes=200 * MIB,\n    )\n    assert not original.admitted\n    runtime = _runtime()\n    calls = {"snapshot": 0}\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n    monkeypatch.setattr(torch.cuda, "memory_stats", lambda _device=None: _stats())\n    def snapshot():\n        calls["snapshot"] += 1\n        return _snapshot()\n    monkeypatch.setattr(torch.cuda, "memory_snapshot", snapshot)\n\n    revised1, detail1 = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert revised1.admitted\n    assert detail1["snapshot_performed"] is True\n    assert detail1["inactive_allocator_bytes"] == 400 * MIB\n    runtime._consume_allocator_certificate(envelope.materialisation_peak_bytes)\n\n    revised2, detail2 = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert revised2.admitted\n    assert detail2["snapshot_performed"] is False\n    assert calls["snapshot"] == 1\n\n\ndef test_device_free_event_invalidates_certificate_and_forces_refresh(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = decide_candidate_admission(\n        observation=observation, envelope=envelope,\n        stay_below_current_peak=False, gpu_memory_buffer_bytes=200 * MIB,\n    )\n    runtime = _runtime()\n    state = {"free": 7, "snapshot": 0}\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n    monkeypatch.setattr(torch.cuda, "memory_stats", lambda _device=None: _stats(num_device_free=state["free"]))\n    def snapshot():\n        state["snapshot"] += 1\n        return _snapshot()\n    monkeypatch.setattr(torch.cuda, "memory_snapshot", snapshot)\n    runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert state["snapshot"] == 1\n    state["free"] = 8\n    _, detail = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert detail["certificate_invalidated_by_device_free"] is True\n    assert detail["snapshot_performed"] is True\n    assert state["snapshot"] == 2\n\n\ndef test_insufficient_current_inactive_headroom_still_rejects(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = decide_candidate_admission(\n        observation=observation, envelope=envelope,\n        stay_below_current_peak=False, gpu_memory_buffer_bytes=200 * MIB,\n    )\n    runtime = _runtime()\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n    monkeypatch.setattr(torch.cuda, "memory_stats", lambda _device=None: _stats(reserved=180, active=100))\n    monkeypatch.setattr(torch.cuda, "memory_snapshot", lambda: _snapshot())\n    revised, detail = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert detail["reuse_qualified"] is True\n    assert detail["inactive_allocator_bytes"] == 80 * MIB\n    assert revised.admitted is False\n    assert revised.reason == "global_device_buffer"\n\n\ndef test_snapshot_failure_fails_closed_when_certificate_missing(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = decide_candidate_admission(\n        observation=observation, envelope=envelope,\n        stay_below_current_peak=False, gpu_memory_buffer_bytes=200 * MIB,\n    )\n    runtime = _runtime()\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n    monkeypatch.setattr(torch.cuda, "memory_stats", lambda _device=None: _stats())\n    monkeypatch.setattr(torch.cuda, "memory_snapshot", lambda: (_ for _ in ()).throw(RuntimeError("snapshot failed")))\n    revised, detail = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert revised == original\n    assert "snapshot failed" in str(detail["snapshot_error"])\n\n\ndef test_allocator_aware_mode_validation() -> None:\n    validate_premat_configuration(**_validation_kwargs("disabled"))\n    validate_premat_configuration(**_validation_kwargs("cautious"))\n    for mode in ("normal", "aggressive"):\n        with pytest.raises(ValueError, match="not implemented yet"):\n            validate_premat_configuration(**_validation_kwargs(mode))\n''')
          PY
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib
      - name: Run checks
        shell: bash
        run: |
          python -m compileall -q sheet run_thog2_owt_core.py tests/test_premat_allocator_aware_admission.py
          git diff --check
          python -m pytest -q tests/test_premat_allocator_aware_admission.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet/premat.py tests/test_premat_allocator_aware_admission.py
          git commit -m "Throttle Premat allocator snapshots"
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
