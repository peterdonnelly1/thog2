name: Temporary PREMAT skip blocked and diagnostics

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/premat_skip_blocked_and_diag.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python tmp_premat_skip_blocked_patch.py
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib
      - name: Run checks
        run: |
          python -m compileall -q sheet run_thog2_owt_core.py tests/test_premat_allocator_aware_admission.py
          git diff --check
          python -m pytest -q tests/test_premat_allocator_aware_admission.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet/premat.py tests/test_premat_allocator_aware_admission.py
          git commit -m "Skip blocked Premat matrices and extend allocator diagnostics"
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
