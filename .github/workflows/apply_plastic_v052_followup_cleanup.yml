name: Apply PLASTIC v0.52 follow-up cleanup

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - tools/apply_plastic_v052_followup_cleanup.py
      - .github/workflows/apply_plastic_v052_followup_cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply_test_writeback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply follow-up cleanup
        run: python tools/apply_plastic_v052_followup_cleanup.py

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Validate syntax and retired public knob
        run: |
          bash -n train_OWT.sh
          bash -n train_OWT_core.sh
          python -m py_compile sheet/plastic_depth_directional_coherence_patch.py tools/apply_plastic_v052_followup_cleanup.py tests/test_plastic_depth_directional_coherence_v052.py
          if git grep -n 'plastic__layer_count_min_probes[=:]' -- tests ':!tests/test_plastic_depth_directional_coherence_v052.py'; then
            echo 'active test still constructs or expects retired min-probes control' >&2
            exit 1
          fi

      - name: Run focused v0.52 tests
        run: python -m pytest -q tests/test_plastic_depth_directional_coherence_v052.py

      - name: Run migrated min-probes consumers
        run: |
          python -m pytest -q \
            tests/test_plastic_depth.py \
            tests/test_plastic_depth_audit.py \
            tests/test_plastic_depth_checkpoint_format.py \
            tests/test_plastic_depth_inline_probe.py \
            tests/test_plastic_depth_startup_lookahead_ui.py \
            tests/test_run_thog2_owt_startup_report.py

      - name: Commit validated cleanup
        run: |
          git restore -- .github/workflows
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete PLASTIC v0.52 follow-up cleanup'
          for attempt in 1 2 3; do
            git fetch origin PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
            if git rebase origin/PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION && git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1

# vvv THOG validated test/spec-history cleanup for PLASTIC v0.52
# ^^^ THOG
# vvv THOG trigger the post-migration cleanup after the workflow itself exists on the branch
# ^^^ THOG
