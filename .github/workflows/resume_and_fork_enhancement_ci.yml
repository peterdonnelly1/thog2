# vvv THOG
name: Resume and fork enhancement CI

on:
  push:
    branches:
      - RESUME_AND_FORK_ENHANCEMENT
  pull_request:
    branches:
      - master
      - RESUME_AND_FORK_ENHANCEMENT
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pytest tiktoken tensorboard wandb matplotlib plotly
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile every lifecycle source and test
        run: |
          set -euo pipefail
          python -m compileall -q sheet run_thog2_owt.py run_thog2_owt_core.py run_thog2_lifecycle.py tests

      - name: Check shell syntax
        run: |
          set -euo pipefail
          bash -n train_OWT.sh train_OWT_core.sh resume_and_fork_OWT.sh
          bash -n scruffy_simple_runstring.sh dreedle_simple_runstring.sh scruffy_general_runstring.sh

      - name: Run focused lifecycle and retained resume regressions
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_resume_and_fork_enhancement.py \
            tests/test_resume_and_fork_wandb.py \
            tests/test_resume_and_fork_wandb_lineage.py \
            tests/test_resume_identity_and_throughput.py \
            tests/test_sheet_stage6_runner_scripts.py

  real-cpu-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pytest tiktoken tensorboard wandb matplotlib plotly
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run real fresh resume no-brainer resume fork chain and public shell shortcut
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_resume_and_fork_cpu_integration.py \
            tests/test_resume_and_fork_shell_integration.py -vv

  cpu-ddp-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy tiktoken tensorboard wandb matplotlib plotly
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run two-rank CPU fresh and resume smoke
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          export ROOT="$root"
          python - <<'PY'
          import os, pickle
          from pathlib import Path
          import numpy as np
          root = Path(os.environ["ROOT"])
          data = root / "data"
          data.mkdir(parents=True)
          (np.arange(512, dtype=np.uint16) % 32).tofile(data / "train.bin")
          (np.arange(256, dtype=np.uint16) % 32).tofile(data / "val.bin")
          with (data / "meta.pkl").open("wb") as handle:
              pickle.dump({"vocab_size": 32}, handle)
          PY
          python -m torch.distributed.run --standalone --nproc-per-node=2 -m run_thog2_owt \
            --model-type dense --run-mode fresh --run-start-label 260729-0300 \
            --run-name DDPTEST --experiment-prefix DDPTEST --max-iters 2 \
            --data-dir "$root/data" --checkpoint-root "$root/checkpoints" \
            --log-root "$root/logs" --result-root "$root/results" --wandb-root "$root/wandb" \
            --instrumentation none --no-wandb --device cpu --dtype float32 \
            --batch-size 2 --gradient-accumulation-steps 2 --block-size 8 \
            --n-layer 1 --n-head 1 --n-embd 8 --warmup-iters 0 \
            --learning-rate 0.001 --min-lr 0.0001 --eval-interval 1 --eval-iters 1 \
            --log-interval 1 --checkpoint-interval 1 --residual-init-depth-source true_layer_depth \
            --no-activation-checkpointing
          python -m torch.distributed.run --standalone --nproc-per-node=2 -m run_thog2_owt \
            --resume 260729-0300 -n 3 --checkpoint-root "$root/checkpoints" --instrumentation none
          python - <<'PY'
          import os
          from pathlib import Path
          from sheet.checkpoints import load_payload
          root = Path(os.environ["ROOT"])
          dirs = [p for p in (root / "checkpoints").iterdir() if p.is_dir()]
          assert len(dirs) == 1, dirs
          payload = load_payload(dirs[0] / "ckpt.pt")
          assert payload["completed_updates"] == 3
          assert payload["lifecycle"]["world_size"] == 2
          assert len(payload["lifecycle"]["sessions"]) == 2
          PY

  full-cpu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pytest tiktoken tensorboard wandb matplotlib plotly
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run repository-wide CPU regression
        env:
          PYTHONPATH: .
        run: pytest -q --ignore=tests/test_resume_and_fork_cpu_integration.py

      - name: Record GPU availability honestly
        if: always()
        run: python -c "import torch; print({'cuda_available': torch.cuda.is_available(), 'cuda_device_count': torch.cuda.device_count()})"
