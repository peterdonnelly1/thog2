name: Temporary PREMAT shadow-mode patch

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/premat_shadow_mode_patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wire shadow mode through public run validation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("sheet/run_config.py")
          text = p.read_text(encoding="utf-8")
          old = '''            enable_gpu_timing_diagnostic=self.premat_enable_gpu_timing_diagnostic,
            logging=self.premat_logging,
            instra=self.premat_instra,
'''
          new = '''            enable_gpu_timing_diagnostic=self.premat_enable_gpu_timing_diagnostic,
            shadow_mode=self.premat_enable_shadow_mode,
            logging=self.premat_logging,
            instra=self.premat_instra,
'''
          if text.count(old) != 1:
              raise RuntimeError(f"run-config shadow validation insertion expected once, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

          p = Path("tests/test_premat.py")
          text = p.read_text(encoding="utf-8")
          marker = "\ndef test_premat_cuda_stream_priority_is_opt_in(monkeypatch) -> None:\n"
          test = '''\n\ndef test_run_config_rejects_shadow_mode_without_premat() -> None:\n    with pytest.raises(ValueError, match="premat_enable_shadow_mode requires premat enabled"):\n        OwtRunConfig(\n            model_type="sheet",\n            premat="disabled",\n            premat_enable_shadow_mode=True,\n        )\n'''
          if "test_run_config_rejects_shadow_mode_without_premat" not in text:
              if text.count(marker) != 1:
                  raise RuntimeError("run-config shadow test insertion marker not found exactly once")
              text = text.replace(marker, test + marker, 1)
          p.write_text(text, encoding="utf-8")
          PY
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Run focused verification
        run: |
          python -m compileall -q sheet run_thog2_owt_core.py tests/test_premat.py
          bash -n train_OWT_core.sh
          git diff --check
          python -m pytest -q tests/test_premat.py tests/test_premat_allocator_aware_admission.py tests/test_premat_history_immutability.py tests/test_premat_instra.py tests/test_run_thog2_owt_startup_report.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet/run_config.py tests/test_premat.py
          git commit -m "Wire PREMAT shadow validation through run config"
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
