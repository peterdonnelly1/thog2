name: Temporary PREMAT shadow-mode patch

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/premat_shadow_mode_patch.yml
      - tmp_premat_shadow_mode_patch.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair helper replacement cardinality
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tmp_premat_shadow_mode_patch.py")
          text = p.read_text(encoding="utf-8")
          old = '''text = replace_once(
              text,
              "            observation.process_allocated_bytes - self._retained_bytes,\\n",
              "            observation.process_allocated_bytes - self._physical_retained_bytes(),\\n",
              "charged process physical retained",
          )'''
          new = '''needle = "            observation.process_allocated_bytes - self._retained_bytes,\\n"
          if text.count(needle) != 2:
              raise RuntimeError(f"charged process physical retained: expected exactly two matches, found {text.count(needle)}")
          text = text.replace(
              needle,
              "            observation.process_allocated_bytes - self._physical_retained_bytes(),\\n",
          )'''
          if old not in text:
              raise RuntimeError("temporary helper repair target not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply patch
        run: python tmp_premat_shadow_mode_patch.py
      - name: Update public PREMAT CLI contract test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/test_premat.py")
          text = p.read_text(encoding="utf-8")
          start_marker = "def test_public_cli_exposes_exactly_the_fourteen_premat_options() -> None:"
          start = text.find(start_marker)
          if start < 0:
              raise RuntimeError("public PREMAT option-count test not found")
          end = text.find("\n\ndef test_wrapper_reclaims_unused_allocator_cache_for_premat_by_default", start)
          if end < 0:
              raise RuntimeError("public PREMAT option-count test end not found")
          segment = text[start:end].replace("exactly_the_fourteen", "exactly_the_fifteen", 1)
          insertion = '        "--premat_enable_gpu_timing_diagnostic",\n'
          if insertion not in segment:
              raise RuntimeError("GPU timing option not found in PREMAT option contract")
          if '        "--premat_enable_shadow_mode",\n' not in segment:
              segment = segment.replace(
                  insertion,
                  insertion + '        "--premat_enable_shadow_mode",\n',
                  1,
              )
          p.write_text(text[:start] + segment + text[end:], encoding="utf-8")
          PY
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Run focused verification
        run: |
          python -m compileall -q sheet run_thog2_owt_core.py tests/test_premat.py
          bash -n train_OWT_core.sh
          git diff --check
          python -m pytest -q tests/test_premat.py tests/test_premat_allocator_aware_admission.py tests/test_premat_history_immutability.py tests/test_premat_instra.py tests/test_run_thog2_owt_startup_report.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet/premat.py sheet/model.py sheet/training_config.py sheet/run_config.py run_thog2_owt_core.py train_OWT_core.sh tests/test_premat.py
          git commit -m "Add PREMAT shadow-mode diagnostic"
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
