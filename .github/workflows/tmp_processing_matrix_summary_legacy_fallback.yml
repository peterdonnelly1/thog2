# vvv THOG temporary verification workflow for legacy Processing matrix-summary fallback
name: Temporary Processing legacy matrix summary fallback
on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - tmp_processing_matrix_summary_legacy_fallback.py
      - .github/workflows/tmp_processing_matrix_summary_legacy_fallback.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply_and_verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Apply update
        run: python tmp_processing_matrix_summary_legacy_fallback.py
      - name: Verify
        run: |
          node --check sheet/local_dashboard_assets/dashboard_processing.js
          git diff --check
          python -m pytest -q tests/test_premat_processing.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sheet/local_dashboard_assets/dashboard_processing.js tests/test_premat_processing.py THOG2_DYNAMIC_PREMATERIALISATION_LOG.md
          git commit -m 'Backfill Processing matrix summary for existing captures'
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
# ^^^ THOG
