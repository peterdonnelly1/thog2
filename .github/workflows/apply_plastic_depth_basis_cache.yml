name: Apply PLASTIC DEPTH basis cache

on:
  push:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: PLASTIC_DEPTH
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pytest psutil tensorboard tiktoken wandb matplotlib plotly
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/plastic_depth_basis_cache.patch.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/plastic_depth_basis_cache.patch.gz.b64 | gzip -d > /tmp/plastic_depth_basis_cache.patch
          git apply --check /tmp/plastic_depth_basis_cache.patch
          git apply /tmp/plastic_depth_basis_cache.patch
          git diff --check

      - name: Compile and run focused validation
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m compileall -q sheet tests/test_plastic_depth.py
          pytest -q \
            tests/test_plastic_depth.py \
            tests/test_plastic_depth_interfaces.py \
            tests/test_depth_materialisation_runtime.py \
            tests/test_sheet_stage4_checkpointing.py \
            tests/test_sheet_stage6_dense_checkpointing.py \
            tests/test_modified_fast_discard_false_distributed.py
          python tests/plastic_depth_ddp_check.py > /tmp/plastic-depth-basis-cache-ddp.json

      - name: Commit audited implementation and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply_plastic_depth_basis_cache.yml
          git add \
            sheet/depth_trajectory.py \
            sheet/model.py \
            sheet/training_model.py \
            tests/test_plastic_depth.py
          git commit -m 'Cache PLASTIC DEPTH basis per forward'
          python tests/hyperblock_source_history_check.py \
            --repository . \
            --base HEAD^ \
            --head HEAD \
            --output /tmp/plastic-depth-basis-cache-source-history.json
          git push origin HEAD:PLASTIC_DEPTH
