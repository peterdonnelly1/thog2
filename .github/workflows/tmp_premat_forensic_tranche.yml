name: Temporary PREMAT forensic tranche

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/tmp_premat_forensic_tranche.yml
      - tmp_finish_premat_forensic_tranche.py

permissions:
  contents: write

jobs:
  apply_and_verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Apply final specificity
        run: python tmp_finish_premat_forensic_tranche.py
      - name: Verify
        run: |
          python -m compileall -q sheet tests/test_premat.py
          git diff --check
          python -m pytest -q tests/test_premat.py tests/test_local_chart_dashboard.py tests/test_instra_live_loss.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sheet/premat.py sheet/local_dashboard_assets/dashboard_premat.js tests/test_premat.py
          git commit -m 'Tighten PREMAT forensic discrimination'
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
