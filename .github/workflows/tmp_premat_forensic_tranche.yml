name: Temporary PREMAT processing Nsight launch repair

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - tmp_fix_premat_processing_nsys_launch.py

permissions:
  contents: write

jobs:
  apply_and_verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Apply repair
        run: python tmp_fix_premat_processing_nsys_launch.py
      - name: Verify
        run: |
          python -m compileall -q sheet tests/test_premat_processing.py tests/test_premat.py
          node --check sheet/local_dashboard_assets/dashboard_processing.js
          git diff --check
          python -m pytest -q tests/test_premat_processing.py tests/test_premat.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sheet/premat_processing.py tests/test_premat_processing.py THOG2_DYNAMIC_PREMATERIALISATION_LOG.md
          git commit -m 'Fix Nsight processing launch environment'
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
