name: Temporary Premat certificate lifecycle

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/premat_certificate_lifecycle.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply certificate lifecycle update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sheet/premat.py')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if text.count(old) != 1:
                  raise RuntimeError(f'unexpected {label}: found {text.count(old)} copies')
              text = text.replace(old, new, 1)

          marker = '''    return reserved - active\n\n\ndef _conservative_certificate_charge_bytes(\n'''
          replacement = '''    return reserved - active\n\n\ndef _allocator_pool_reserved_bytes_from_stats(\n    stats: Mapping[str, object],\n    pool: str,\n) -> int:\n    if pool not in ("small", "large"):\n        raise ValueError(f"unknown CUDA allocator pool {pool!r}")\n    stat_pool = "small_pool" if pool == "small" else "large_pool"\n    return _memory_stat_nonnegative_int(\n        stats, f"reserved_bytes.{stat_pool}.current"\n    )\n\n\ndef _conservative_certificate_charge_bytes(\n'''
          replace_once(marker, replacement, 'pool stats insertion marker')

          old_candidate = '''    admission_reason: str = "not_checked"\n    retained_counted: bool = False\n    transient_counted: bool = False\n'''
          new_candidate = '''    admission_reason: str = "not_checked"\n    retained_counted: bool = False\n    transient_counted: bool = False\n    allocator_certificate_generation: Optional[int] = None\n    allocator_certificate_pool: Optional[str] = None\n    allocator_certificate_charge_bytes: int = 0\n'''
          replace_once(old_candidate, new_candidate, 'candidate certificate fields')

          old_release = '''@dataclass\nclass _PendingRelease:\n    end_event: torch.cuda.Event\n    retained_bytes: int\n    transient_bytes: int\n    tensor: Tensor\n'''
          new_release = '''@dataclass\nclass _PendingRelease:\n    end_event: torch.cuda.Event\n    retained_bytes: int\n    transient_bytes: int\n    tensor: Optional[Tensor]\n    allocator_certificate_generation: Optional[int] = None\n    allocator_certificate_pool: Optional[str] = None\n    allocator_certificate_charge_bytes: int = 0\n'''
          replace_once(old_release, new_release, 'pending release certificate fields')

          old_state = '''        # Cautious allocator admission snapshots only to certify contiguous\n        # Premat-stream cache.  The certificate is conservatively consumed by\n        # every Premat launch and invalidated whenever CUDA backing is freed.\n        self._allocator_certificate_bytes = {"small": 0, "large": 0}\n        self._allocator_certificate_num_device_free: Optional[int] = None\n        self._allocator_snapshot_count = 0\n'''
          new_state = '''        # Cautious allocator admission snapshots only to certify one contiguous\n        # inactive block in each Premat-stream allocator pool.  The certificate\n        # models a reusable working reserve: live Premat allocations consume it\n        # and safe final release returns the charge.  It never grows above the\n        # block actually observed by memory_snapshot().\n        self._allocator_certificate_valid = {"small": False, "large": False}\n        self._allocator_certificate_generation = {"small": 0, "large": 0}\n        self._allocator_certificate_capacity_bytes = {"small": 0, "large": 0}\n        self._allocator_certificate_live_charge_bytes = {"small": 0, "large": 0}\n        self._allocator_certificate_pool_reserved_floor_bytes: Dict[str, Optional[int]] = {\n            "small": None,\n            "large": None,\n        }\n        self._allocator_snapshot_count = 0\n'''
          replace_once(old_state, new_state, 'allocator certificate state')

          old_begin = '''        self._pass_sequence += 1\n        self._candidates.clear()\n        self._pending_releases.clear()\n        self._display_layer_pair = None\n        self._display_candidates = []\n        self._retained_bytes = 0\n        self._transient_bytes = 0\n'''
          new_begin = '''        self._pass_sequence += 1\n        # Pending releases may cross a microstep boundary.  They remain charged\n        # and strongly referenced until their Main Stream event has completed;\n        # clearing them here used to discard exact lifetime information.\n        self._resolve_pending_releases()\n        self._candidates.clear()\n        self._display_layer_pair = None\n        self._display_candidates = []\n'''
          replace_once(old_begin, new_begin, 'begin pending-release lifecycle')

          old_end = '''        for candidate in tuple(self._candidates.values()):\n            candidate.tensor = None\n            candidate.materialisation_start_event = None\n            candidate.completion_event = None\n        self._retained_bytes = 0\n        self._transient_bytes = 0\n        self._pending_releases.clear()\n        self._active = False\n'''
          new_end = '''        for candidate in tuple(self._candidates.values()):\n            # Anything not transferred to _PendingRelease has no Main Stream\n            # lifetime left at pass end.  Remove both scheduler and allocator\n            # certificate charges before dropping the final tensor reference.\n            if candidate.retained_counted or candidate.transient_counted:\n                self._rollback_candidate_charge(candidate)\n            self._release_allocator_certificate_candidate(candidate)\n            candidate.tensor = None\n            candidate.materialisation_start_event = None\n            candidate.completion_event = None\n        # Do not clear _pending_releases: unlike the old record_stream fallback,\n        # explicit strong-reference lifetime may legitimately span microsteps.\n        self._resolve_pending_releases()\n        self._active = False\n'''
          replace_once(old_end, new_end, 'end pending-release lifecycle')

          old_available = '''            candidate.final_outcome = "FULL HIT"\n            candidate.tensor.record_stream(current_stream)\n            self._transition(\n'''
          new_available = '''            candidate.final_outcome = "FULL HIT"\n            # Explicit lifetime is stronger than record_stream here: the runtime\n            # retains the tensor until a Main Stream event recorded after its\n            # consuming GEMM completes.  Avoiding record_stream means final\n            # release returns directly to the tensor's Premat allocator stream.\n            self._transition(\n'''
          replace_once(old_available, new_available, 'available record_stream removal')

          old_partial = '''            self._aggregate["waited_hits"] += 1\n            candidate.tensor.record_stream(current_stream)\n            wait_payload = self._transition(\n'''
          new_partial = '''            self._aggregate["waited_hits"] += 1\n            # candidate.tensor remains strongly referenced through consumed().\n            wait_payload = self._transition(\n'''
          replace_once(old_partial, new_partial, 'partial record_stream removal')

          old_pending = '''                _PendingRelease(\n                    end_event=release_event,\n                    retained_bytes=candidate.envelope.retained_bytes,\n                    transient_bytes=(\n                        self._candidate_transient_bytes(candidate)\n                        if candidate.transient_counted\n                        else 0\n                    ),\n                    tensor=candidate.tensor,\n                )\n            )\n        candidate.retained_counted = False\n        candidate.transient_counted = False\n'''
          new_pending = '''                _PendingRelease(\n                    end_event=release_event,\n                    retained_bytes=candidate.envelope.retained_bytes,\n                    transient_bytes=(\n                        self._candidate_transient_bytes(candidate)\n                        if candidate.transient_counted\n                        else 0\n                    ),\n                    tensor=candidate.tensor,\n                    allocator_certificate_generation=(\n                        candidate.allocator_certificate_generation\n                    ),\n                    allocator_certificate_pool=candidate.allocator_certificate_pool,\n                    allocator_certificate_charge_bytes=(\n                        candidate.allocator_certificate_charge_bytes\n                    ),\n                )\n            )\n            candidate.allocator_certificate_generation = None\n            candidate.allocator_certificate_pool = None\n            candidate.allocator_certificate_charge_bytes = 0\n        candidate.retained_counted = False\n        candidate.transient_counted = False\n'''
          replace_once(old_pending, new_pending, 'pending certificate transfer')

          method_start = text.index('    def _invalidate_allocator_certificate_if_device_freed(\n')
          method_end = text.index('\n    def _advance(self, *, trigger: str) -> None:\n', method_start)
          new_methods = '''    def _allocator_certificate_available_bytes(self, pool: str) -> int:\n        if not self._allocator_certificate_valid.get(pool, False):\n            return 0\n        return max(\n            0,\n            int(self._allocator_certificate_capacity_bytes.get(pool, 0))\n            - int(self._allocator_certificate_live_charge_bytes.get(pool, 0)),\n        )\n\n    def _debit_allocator_certificate_for_pool_shrink(\n        self,\n        *,\n        pool: str,\n        current_reserved_bytes: int,\n    ) -> int:\n        """Conservatively debit a certificate only for its allocator pool shrinking.\n\n        ``num_device_free`` is device-wide and changed frequently in the measured\n        workload even when the Premat block was unaffected.  Pool reserved bytes\n        are a tighter signal.  Growth never increases a certificate; shrinkage is\n        pessimistically charged entirely against the certified Premat reserve.\n        """\n        floor = self._allocator_certificate_pool_reserved_floor_bytes.get(pool)\n        if floor is None:\n            return 0\n        current = max(0, int(current_reserved_bytes))\n        if current >= int(floor):\n            return 0\n        shrink = int(floor) - current\n        before = int(self._allocator_certificate_capacity_bytes.get(pool, 0))\n        live = int(self._allocator_certificate_live_charge_bytes.get(pool, 0))\n        after = max(live, before - shrink)\n        self._allocator_certificate_capacity_bytes[pool] = after\n        self._allocator_certificate_pool_reserved_floor_bytes[pool] = current\n        return max(0, before - after)\n\n    def _reserve_allocator_certificate(\n        self,\n        *,\n        request_bytes: int,\n        required: bool,\n    ) -> Dict[str, object]:\n        pool = _allocator_pool_for_request(request_bytes)\n        charge = _conservative_certificate_charge_bytes(request_bytes)\n        generation = int(self._allocator_certificate_generation.get(pool, 0))\n        before_live = int(self._allocator_certificate_live_charge_bytes.get(pool, 0))\n        before_available = self._allocator_certificate_available_bytes(pool)\n        tracked = (\n            self._allocator_certificate_valid.get(pool, False)\n            and before_available >= charge\n        )\n        if required and not tracked:\n            raise RuntimeError(\n                "allocator-aware admission lost its certified Premat-stream reserve "\n                "between decision and launch"\n            )\n        if tracked:\n            self._allocator_certificate_live_charge_bytes[pool] = before_live + charge\n            after_available = self._allocator_certificate_available_bytes(pool)\n        else:\n            after_available = 0\n            # An ordinary admission does not need allocator evidence, but it may\n            # consume the same Premat-stream cache.  If it cannot be represented\n            # inside the certificate, stop using that certificate until every\n            # previously tracked charge has drained and a fresh snapshot proves\n            # the allocator state again.\n            if self._allocator_certificate_valid.get(pool, False):\n                self._allocator_certificate_valid[pool] = False\n        return {\n            "tracked": tracked,\n            "pool": pool,\n            "generation": generation if tracked else None,\n            "charge_bytes": charge if tracked else 0,\n            "before_live_charge_bytes": before_live,\n            "after_live_charge_bytes": int(\n                self._allocator_certificate_live_charge_bytes.get(pool, 0)\n            ),\n            "before_available_bytes": before_available,\n            "after_available_bytes": after_available,\n        }\n\n    def _release_allocator_certificate_charge(\n        self,\n        *,\n        generation: Optional[int],\n        pool: Optional[str],\n        charge_bytes: int,\n    ) -> bool:\n        if generation is None or pool not in ("small", "large") or charge_bytes <= 0:\n            return False\n        if int(generation) != int(self._allocator_certificate_generation.get(pool, -1)):\n            return False\n        before = int(self._allocator_certificate_live_charge_bytes.get(pool, 0))\n        self._allocator_certificate_live_charge_bytes[pool] = max(\n            0, before - int(charge_bytes)\n        )\n        return True\n\n    def _release_allocator_certificate_candidate(self, candidate: _Candidate) -> bool:\n        released = self._release_allocator_certificate_charge(\n            generation=candidate.allocator_certificate_generation,\n            pool=candidate.allocator_certificate_pool,\n            charge_bytes=candidate.allocator_certificate_charge_bytes,\n        )\n        candidate.allocator_certificate_generation = None\n        candidate.allocator_certificate_pool = None\n        candidate.allocator_certificate_charge_bytes = 0\n        return released\n\n    def _cautious_allocator_aware_rescue(\n        self,\n        *,\n        observation: PrematMemoryObservation,\n        envelope: CandidateEnvelope,\n        original_decision: AdmissionDecision,\n    ) -> Tuple[AdmissionDecision, Dict[str, object]]:\n        pool = _allocator_pool_for_request(envelope.materialisation_peak_bytes)\n        required_certificate_charge = _conservative_certificate_charge_bytes(\n            envelope.materialisation_peak_bytes\n        )\n        detail: Dict[str, object] = {\n            "mode": "cautious",\n            "attempted": True,\n            "original_admitted": original_decision.admitted,\n            "original_reason": original_decision.reason,\n            "original_predicted_physical_growth_bytes": (\n                original_decision.predicted_physical_growth_bytes\n            ),\n            "predicted_envelope_bytes": envelope.process_envelope_bytes,\n            "premat_materialisation_peak_bytes": envelope.materialisation_peak_bytes,\n            "foreground_overlap_bytes": envelope.foreground_overlap_bytes,\n            "device_index": None,\n            "premat_stream_id": None,\n            "allocator_pool": pool,\n            "certificate_required_charge_bytes": required_certificate_charge,\n            "certificate_generation": int(\n                self._allocator_certificate_generation.get(pool, 0)\n            ),\n            "certificate_valid": bool(\n                self._allocator_certificate_valid.get(pool, False)\n            ),\n            "certificate_capacity_bytes": int(\n                self._allocator_certificate_capacity_bytes.get(pool, 0)\n            ),\n            "certificate_live_charge_bytes": int(\n                self._allocator_certificate_live_charge_bytes.get(pool, 0)\n            ),\n            "certificate_available_bytes": self._allocator_certificate_available_bytes(pool),\n            "certificate_pool_reserved_floor_bytes": (\n                self._allocator_certificate_pool_reserved_floor_bytes.get(pool)\n            ),\n            "certificate_pool_reserved_shrink_debit_bytes": 0,\n            "certificate_refresh_deferred_live_charge": False,\n            "largest_eligible_inactive_block_bytes": 0,\n            "certified_premat_stream_cache_bytes": 0,\n            "certified_premat_stream_available_bytes": 0,\n            # Retained for CSV compatibility. Device-wide free events no longer\n            # invalidate a stream certificate; pool shrink is used instead.\n            "certificate_invalidated_by_device_free": False,\n            "reuse_qualified": False,\n            "inactive_allocator_bytes": 0,\n            "inactive_allocator_bytes_source": "memory_stats_reserved_minus_active",\n            "memory_stats_reserved_bytes": 0,\n            "memory_stats_active_bytes": 0,\n            "memory_stats_num_device_free": 0,\n            "memory_stats_pool_reserved_bytes": 0,\n            "required_allocator_headroom_credit_bytes": 0,\n            "allocator_headroom_credit_bytes": 0,\n            "allocator_credit_bytes": 0,\n            "effective_device_free_bytes": observation.device_free_bytes,\n            "snapshot_performed": False,\n            "allocator_snapshot_count": self._allocator_snapshot_count,\n            "revised_predicted_physical_growth_bytes": (\n                original_decision.predicted_physical_growth_bytes\n            ),\n            "final_admitted": original_decision.admitted,\n            "final_reason": original_decision.reason,\n            "snapshot_error": None,\n        }\n        if self._stream is None or self._device is None:\n            detail["snapshot_error"] = "Premat Stream or CUDA device is not initialized"\n            return original_decision, detail\n\n        device_index = self._device.index\n        if device_index is None:\n            device_index = int(torch.cuda.current_device())\n        stream_id = int(self._stream.cuda_stream)\n        detail["device_index"] = int(device_index)\n        detail["premat_stream_id"] = stream_id\n\n        try:\n            allocator_backend = torch.cuda.memory.get_allocator_backend()\n            detail["allocator_backend"] = allocator_backend\n            if allocator_backend != "native":\n                detail["snapshot_error"] = (\n                    "cautious allocator-aware admission requires the native CUDA allocator"\n                )\n                return original_decision, detail\n\n            stats = torch.cuda.memory_stats(self._device)\n            reserved_bytes = _memory_stat_nonnegative_int(\n                stats, "reserved_bytes.all.current"\n            )\n            active_bytes = _memory_stat_nonnegative_int(\n                stats, "active_bytes.all.current"\n            )\n            inactive_allocator_bytes = _inactive_allocator_bytes_from_stats(stats)\n            num_device_free = _memory_stat_nonnegative_int(stats, "num_device_free")\n            pool_reserved_bytes = _allocator_pool_reserved_bytes_from_stats(stats, pool)\n            shrink_debit = self._debit_allocator_certificate_for_pool_shrink(\n                pool=pool, current_reserved_bytes=pool_reserved_bytes\n            )\n            detail["memory_stats_reserved_bytes"] = reserved_bytes\n            detail["memory_stats_active_bytes"] = active_bytes\n            detail["memory_stats_num_device_free"] = num_device_free\n            detail["memory_stats_pool_reserved_bytes"] = pool_reserved_bytes\n            detail["inactive_allocator_bytes"] = inactive_allocator_bytes\n            detail["certificate_pool_reserved_shrink_debit_bytes"] = shrink_debit\n\n            certificate_available = self._allocator_certificate_available_bytes(pool)\n            certificate_valid = bool(self._allocator_certificate_valid.get(pool, False))\n            live_charge = int(self._allocator_certificate_live_charge_bytes.get(pool, 0))\n            if (not certificate_valid) or certificate_available < required_certificate_charge:\n                if live_charge > 0:\n                    # Never take a new snapshot while allocations charged to the\n                    # current certificate are still live: the new inactive block\n                    # could be a remainder of the same physical block, creating\n                    # overlapping certificates. Wait for safe release instead.\n                    detail["certificate_refresh_deferred_live_charge"] = True\n                else:\n                    floor = self._allocator_certificate_pool_reserved_floor_bytes.get(pool)\n                    snapshot_needed = (\n                        not certificate_valid\n                        or floor is None\n                        or int(pool_reserved_bytes) != int(floor)\n                    )\n                    if snapshot_needed:\n                        snapshot = torch.cuda.memory_snapshot()\n                        detail["snapshot_performed"] = True\n                        self._allocator_snapshot_count += 1\n                        self._aggregate["allocator_snapshot_count"] = self._allocator_snapshot_count\n                        largest = _largest_same_stream_inactive_block_bytes(\n                            snapshot,\n                            device_index=int(device_index),\n                            stream_id=stream_id,\n                            request_bytes=envelope.materialisation_peak_bytes,\n                        )\n                        self._allocator_certificate_generation[pool] = (\n                            int(self._allocator_certificate_generation.get(pool, 0)) + 1\n                        )\n                        self._allocator_certificate_capacity_bytes[pool] = largest\n                        self._allocator_certificate_live_charge_bytes[pool] = 0\n                        self._allocator_certificate_pool_reserved_floor_bytes[pool] = (\n                            pool_reserved_bytes\n                        )\n                        self._allocator_certificate_valid[pool] = True\n\n            certificate_capacity = int(\n                self._allocator_certificate_capacity_bytes.get(pool, 0)\n            )\n            certificate_available = self._allocator_certificate_available_bytes(pool)\n            detail["allocator_snapshot_count"] = self._allocator_snapshot_count\n            detail["certificate_generation"] = int(\n                self._allocator_certificate_generation.get(pool, 0)\n            )\n            detail["certificate_valid"] = bool(\n                self._allocator_certificate_valid.get(pool, False)\n            )\n            detail["certificate_capacity_bytes"] = certificate_capacity\n            detail["certificate_live_charge_bytes"] = int(\n                self._allocator_certificate_live_charge_bytes.get(pool, 0)\n            )\n            detail["certificate_available_bytes"] = certificate_available\n            detail["certificate_pool_reserved_floor_bytes"] = (\n                self._allocator_certificate_pool_reserved_floor_bytes.get(pool)\n            )\n            detail["largest_eligible_inactive_block_bytes"] = certificate_capacity\n            detail["certified_premat_stream_cache_bytes"] = certificate_capacity\n            detail["certified_premat_stream_available_bytes"] = certificate_available\n        except Exception as error:\n            detail["snapshot_error"] = f"{type(error).__name__}: {error}"\n            return original_decision, detail\n\n        reuse_qualified = (\n            bool(self._allocator_certificate_valid.get(pool, False))\n            and certificate_available >= required_certificate_charge\n        )\n        detail["reuse_qualified"] = reuse_qualified\n        if not reuse_qualified:\n            return original_decision, detail\n\n        # Current global headroom comes from cheap allocator counters.  Only\n        # reserved bytes no longer classed active are credited, which excludes\n        # active-awaiting-free blocks.  The complete existing candidate envelope\n        # remains charged, so allocator cache is not double-counted.\n        required_credit = max(\n            0,\n            self._buffer_bytes\n            + envelope.process_envelope_bytes\n            - observation.device_free_bytes,\n        )\n        headroom_credit = min(inactive_allocator_bytes, required_credit)\n        effective_device_free = min(\n            observation.device_total_bytes,\n            observation.device_free_bytes + headroom_credit,\n        )\n        detail["required_allocator_headroom_credit_bytes"] = required_credit\n        detail["allocator_headroom_credit_bytes"] = headroom_credit\n        detail["allocator_credit_bytes"] = headroom_credit\n        detail["effective_device_free_bytes"] = effective_device_free\n\n        adjusted_observation = PrematMemoryObservation(\n            process_allocated_bytes=observation.process_allocated_bytes,\n            process_reserved_bytes=observation.process_reserved_bytes,\n            process_ordinary_peak_bytes=observation.process_ordinary_peak_bytes,\n            device_free_bytes=effective_device_free,\n            device_total_bytes=observation.device_total_bytes,\n        )\n        revised_decision = decide_candidate_admission(\n            observation=adjusted_observation,\n            envelope=envelope,\n            stay_below_current_peak=self._stay_below_current_peak,\n            gpu_memory_buffer_bytes=self._buffer_bytes,\n        )\n        detail["revised_predicted_physical_growth_bytes"] = (\n            revised_decision.predicted_physical_growth_bytes\n        )\n        detail["final_admitted"] = revised_decision.admitted\n        detail["final_reason"] = revised_decision.reason\n        return revised_decision, detail\n'''
          text = text[:method_start] + new_methods + text[method_end:]

          old_consume = '''            if decision.admitted and self._allocator_aware_admission == "cautious":\n                certificate_consumption = self._consume_allocator_certificate(\n                    candidate.envelope.materialisation_peak_bytes\n                )\n                if allocator_aware_detail is not None:\n                    allocator_aware_detail["certificate_consumption"] = certificate_consumption\n                    allocator_aware_detail["certified_premat_stream_cache_bytes_after_admission"] = (\n                        certificate_consumption["after_bytes"]\n                    )\n            if allocator_aware_detail is not None:\n'''
          new_consume = '''            if decision.admitted and self._allocator_aware_admission == "cautious":\n                certificate_consumption = self._reserve_allocator_certificate(\n                    request_bytes=candidate.envelope.materialisation_peak_bytes,\n                    required=allocator_aware_detail is not None,\n                )\n                if bool(certificate_consumption["tracked"]):\n                    candidate.allocator_certificate_generation = int(\n                        certificate_consumption["generation"]\n                    )\n                    candidate.allocator_certificate_pool = str(\n                        certificate_consumption["pool"]\n                    )\n                    candidate.allocator_certificate_charge_bytes = int(\n                        certificate_consumption["charge_bytes"]\n                    )\n                if allocator_aware_detail is not None:\n                    allocator_aware_detail["certificate_consumption"] = certificate_consumption\n                    allocator_aware_detail["certified_premat_stream_cache_bytes_after_admission"] = (\n                        certificate_consumption["after_available_bytes"]\n                    )\n                else:\n                    decision_detail["allocator_certificate_consumption"] = (\n                        certificate_consumption\n                    )\n            if allocator_aware_detail is not None:\n'''
          replace_once(old_consume, new_consume, 'advance certificate reservation')

          old_failure = '''            except BaseException as error:\n                self._rollback_candidate_charge(candidate)\n                candidate.owner = "none"\n                candidate.tensor = None\n'''
          new_failure = '''            except BaseException as error:\n                self._rollback_candidate_charge(candidate)\n                self._release_allocator_certificate_candidate(candidate)\n                candidate.owner = "none"\n                candidate.tensor = None\n'''
          replace_once(old_failure, new_failure, 'materialisation failure certificate rollback')

          old_resolve = '''    def _resolve_pending_releases(self) -> None:\n        remaining: List[_PendingRelease] = []\n        for release in self._pending_releases:\n            try:\n                complete = bool(release.end_event.query())\n            except RuntimeError:\n                complete = False\n            if not complete:\n                remaining.append(release)\n                continue\n            self._retained_bytes = max(\n                0,\n                self._retained_bytes - release.retained_bytes,\n            )\n            self._transient_bytes = max(\n                0,\n                self._transient_bytes - release.transient_bytes,\n            )\n        self._pending_releases = remaining\n'''
          new_resolve = '''    def _resolve_pending_releases(self) -> None:\n        remaining: List[_PendingRelease] = []\n        for release in self._pending_releases:\n            try:\n                complete = release.end_event.query()\n            except RuntimeError:\n                complete = False\n            if not complete:\n                remaining.append(release)\n                continue\n            # The tensor was deliberately kept alive until this Main Stream\n            # event.  PREMAT hits no longer call record_stream(current_stream),\n            # so dropping the last reference now returns the allocation directly\n            # to its original Premat-stream allocator pool.\n            release.tensor = None\n            self._retained_bytes = max(\n                0,\n                self._retained_bytes - release.retained_bytes,\n            )\n            self._transient_bytes = max(\n                0,\n                self._transient_bytes - release.transient_bytes,\n            )\n            self._release_allocator_certificate_charge(\n                generation=release.allocator_certificate_generation,\n                pool=release.allocator_certificate_pool,\n                charge_bytes=release.allocator_certificate_charge_bytes,\n            )\n        self._pending_releases = remaining\n'''
          replace_once(old_resolve, new_resolve, 'pending release resolver')

          path.write_text(text)

          test_path = Path('tests/test_premat_allocator_aware_admission.py')
          test_path.write_text('''from __future__ import annotations\n\nimport pytest\nimport torch\n\nfrom sheet.premat import (\n    CandidateEnvelope,\n    PrematMemoryObservation,\n    PrematRuntime,\n    _allocator_pool_reserved_bytes_from_stats,\n    _conservative_certificate_charge_bytes,\n    _inactive_allocator_bytes_from_stats,\n    _largest_same_stream_inactive_block_bytes,\n    decide_candidate_admission,\n    validate_premat_configuration,\n)\n\nMIB = 1024 ** 2\n\n\ndef _validation_kwargs(mode: str) -> dict[str, object]:\n    return {\n        "premat": "enabled",\n        "attention_mode": "fused",\n        "stay_below_current_peak": False,\n        "stay_within_global_buffer": True,\n        "gpu_memory_buffer_gb": 0.25,\n        "allocator_aware_admission": mode,\n        "target_layer": 1,\n        "weight_matrix_target_order": "r_to_l",\n        "cuda_stream_priority": "normal",\n        "diagnostic_layer_delay_ms": 0.0,\n        "logging": "disabled",\n        "instra": "disabled",\n    }\n\n\ndef _blocked_case() -> tuple[PrematMemoryObservation, CandidateEnvelope]:\n    return (\n        PrematMemoryObservation(\n            process_allocated_bytes=500 * MIB,\n            process_reserved_bytes=800 * MIB,\n            process_ordinary_peak_bytes=1000 * MIB,\n            device_free_bytes=100 * MIB,\n            device_total_bytes=1000 * MIB,\n        ),\n        CandidateEnvelope(\n            retained_bytes=8 * MIB,\n            materialisation_peak_bytes=8 * MIB,\n            foreground_overlap_bytes=128 * MIB,\n        ),\n    )\n\n\ndef _runtime() -> PrematRuntime:\n    runtime = PrematRuntime(\n        materialize=lambda _family, _layer: torch.empty(1),\n        n_embd=8,\n        n_head=1,\n        attention_mode="fused",\n        stay_below_current_peak=False,\n        gpu_memory_buffer_gb=200 * MIB / (1024 ** 3),\n        allocator_aware_admission="cautious",\n        target_layer=1,\n        weight_matrix_target_order="r_to_l",\n        cuda_stream_priority="normal",\n        diagnostic_layer_delay_ms=0.0,\n        logging_enabled=False,\n    )\n    class FakeStream:\n        cuda_stream = 11\n    runtime._stream = FakeStream()\n    runtime._device = torch.device("cuda:0")\n    return runtime\n\n\ndef _stats(*, reserved=500, active=100, pool_reserved=480, num_device_free=7):\n    return {\n        "reserved_bytes.all.current": reserved * MIB,\n        "active_bytes.all.current": active * MIB,\n        "reserved_bytes.large_pool.current": pool_reserved * MIB,\n        "reserved_bytes.small_pool.current": (reserved - pool_reserved) * MIB,\n        "num_device_free": num_device_free,\n    }\n\n\ndef _snapshot(block_mib=368):\n    return [\n        {\n            "device": 0,\n            "stream": 11,\n            "segment_type": "large",\n            "blocks": [{"state": "inactive", "size": block_mib * MIB}],\n        }\n    ]\n\n\ndef _original_decision(observation, envelope):\n    return decide_candidate_admission(\n        observation=observation, envelope=envelope,\n        stay_below_current_peak=False, gpu_memory_buffer_bytes=200 * MIB,\n    )\n\n\ndef test_memory_stats_helpers() -> None:\n    stats = _stats(reserved=500, active=180, pool_reserved=470)\n    assert _inactive_allocator_bytes_from_stats(stats) == 320 * MIB\n    assert _allocator_pool_reserved_bytes_from_stats(stats, "large") == 470 * MIB\n    assert _allocator_pool_reserved_bytes_from_stats(stats, "small") == 30 * MIB\n    with pytest.raises(ValueError):\n        _inactive_allocator_bytes_from_stats(_stats(reserved=100, active=101, pool_reserved=90))\n\n\ndef test_largest_block_filters_device_pool_stream_and_state() -> None:\n    snapshot = [\n        {"device": 0, "stream": 11, "segment_type": "large", "blocks": [\n            {"state": "inactive", "size": 64 * MIB},\n            {"state": "active_awaiting_free", "size": 700 * MIB},\n        ]},\n        {"device": 0, "stream": 12, "segment_type": "large", "blocks": [{"state": "inactive", "size": 800 * MIB}]},\n        {"device": 1, "stream": 11, "segment_type": "large", "blocks": [{"state": "inactive", "size": 900 * MIB}]},\n    ]\n    assert _largest_same_stream_inactive_block_bytes(\n        snapshot, device_index=0, stream_id=11, request_bytes=8 * MIB\n    ) == 64 * MIB\n\n\ndef test_certificate_charge_is_conservative_power_of_two_bound() -> None:\n    assert _conservative_certificate_charge_bytes(0) == 0\n    assert _conservative_certificate_charge_bytes(8 * MIB) == 8 * MIB\n    assert _conservative_certificate_charge_bytes(12 * MIB) == 16 * MIB\n    assert _conservative_certificate_charge_bytes(513) == 1024\n\n\ndef test_cautious_certificate_is_live_reserve_not_historical_spend(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = _original_decision(observation, envelope)\n    assert not original.admitted\n    runtime = _runtime()\n    calls = {"snapshot": 0}\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n    monkeypatch.setattr(torch.cuda, "memory_stats", lambda _device=None: _stats())\n    def snapshot():\n        calls["snapshot"] += 1\n        return _snapshot()\n    monkeypatch.setattr(torch.cuda, "memory_snapshot", snapshot)\n\n    revised1, detail1 = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert revised1.admitted\n    assert detail1["snapshot_performed"] is True\n    reserve = runtime._reserve_allocator_certificate(\n        request_bytes=envelope.materialisation_peak_bytes, required=True\n    )\n    assert reserve["tracked"] is True\n    assert reserve["after_available_bytes"] == 360 * MIB\n\n    revised2, detail2 = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert revised2.admitted\n    assert detail2["snapshot_performed"] is False\n    assert calls["snapshot"] == 1\n\n    runtime._release_allocator_certificate_charge(\n        generation=reserve["generation"], pool=reserve["pool"],\n        charge_bytes=reserve["charge_bytes"],\n    )\n    assert runtime._allocator_certificate_available_bytes("large") == 368 * MIB\n    revised3, detail3 = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert revised3.admitted\n    assert detail3["snapshot_performed"] is False\n    assert calls["snapshot"] == 1\n\n\ndef test_device_free_counter_change_does_not_invalidate_stream_certificate(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = _original_decision(observation, envelope)\n    runtime = _runtime()\n    state = {"free": 7, "snapshot": 0}\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n    monkeypatch.setattr(\n        torch.cuda, "memory_stats",\n        lambda _device=None: _stats(num_device_free=state["free"]),\n    )\n    def snapshot():\n        state["snapshot"] += 1\n        return _snapshot()\n    monkeypatch.setattr(torch.cuda, "memory_snapshot", snapshot)\n    runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    state["free"] = 999\n    _, detail = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert detail["certificate_invalidated_by_device_free"] is False\n    assert detail["snapshot_performed"] is False\n    assert state["snapshot"] == 1\n\n\ndef test_pool_reserved_shrink_debits_certificate_without_false_growth(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = _original_decision(observation, envelope)\n    runtime = _runtime()\n    state = {"pool_reserved": 480}\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n    monkeypatch.setattr(\n        torch.cuda, "memory_stats",\n        lambda _device=None: _stats(pool_reserved=state["pool_reserved"]),\n    )\n    monkeypatch.setattr(torch.cuda, "memory_snapshot", lambda: _snapshot())\n    runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert runtime._allocator_certificate_available_bytes("large") == 368 * MIB\n    state["pool_reserved"] = 380\n    _, detail = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert detail["certificate_pool_reserved_shrink_debit_bytes"] == 100 * MIB\n    assert runtime._allocator_certificate_available_bytes("large") == 268 * MIB\n    state["pool_reserved"] = 480\n    runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    # Later pool growth must never inflate the old certificate.\n    assert runtime._allocator_certificate_available_bytes("large") == 268 * MIB\n\n\ndef test_no_overlapping_snapshot_while_certificate_charge_live(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = _original_decision(observation, envelope)\n    runtime = _runtime()\n    calls = {"snapshot": 0}\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n    monkeypatch.setattr(torch.cuda, "memory_stats", lambda _device=None: _stats())\n    def snapshot():\n        calls["snapshot"] += 1\n        return _snapshot(block_mib=8)\n    monkeypatch.setattr(torch.cuda, "memory_snapshot", snapshot)\n    revised, _ = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert revised.admitted\n    reserve = runtime._reserve_allocator_certificate(\n        request_bytes=envelope.materialisation_peak_bytes, required=True\n    )\n    blocked, detail = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert blocked == original\n    assert detail["certificate_refresh_deferred_live_charge"] is True\n    assert detail["snapshot_performed"] is False\n    assert calls["snapshot"] == 1\n    runtime._release_allocator_certificate_charge(\n        generation=reserve["generation"], pool=reserve["pool"],\n        charge_bytes=reserve["charge_bytes"],\n    )\n    admitted, detail2 = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert admitted.admitted\n    assert detail2["snapshot_performed"] is False\n    assert calls["snapshot"] == 1\n\n\ndef test_insufficient_current_inactive_headroom_still_rejects(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = _original_decision(observation, envelope)\n    runtime = _runtime()\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n    monkeypatch.setattr(\n        torch.cuda, "memory_stats",\n        lambda _device=None: _stats(reserved=180, active=100, pool_reserved=160),\n    )\n    monkeypatch.setattr(torch.cuda, "memory_snapshot", lambda: _snapshot())\n    revised, detail = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert detail["reuse_qualified"] is True\n    assert detail["inactive_allocator_bytes"] == 80 * MIB\n    assert revised.admitted is False\n    assert revised.reason == "global_device_buffer"\n\n\ndef test_snapshot_failure_fails_closed_when_certificate_missing(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = _original_decision(observation, envelope)\n    runtime = _runtime()\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n    monkeypatch.setattr(torch.cuda, "memory_stats", lambda _device=None: _stats())\n    monkeypatch.setattr(\n        torch.cuda, "memory_snapshot",\n        lambda: (_ for _ in ()).throw(RuntimeError("snapshot failed")),\n    )\n    revised, detail = runtime._cautious_allocator_aware_rescue(\n        observation=observation, envelope=envelope, original_decision=original\n    )\n    assert revised == original\n    assert "snapshot failed" in str(detail["snapshot_error"])\n\n\ndef test_allocator_aware_mode_validation() -> None:\n    validate_premat_configuration(**_validation_kwargs("disabled"))\n    validate_premat_configuration(**_validation_kwargs("cautious"))\n    for mode in ("normal", "aggressive"):\n        with pytest.raises(ValueError, match="not implemented yet"):\n            validate_premat_configuration(**_validation_kwargs(mode))\n''')
          PY
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib
      - name: Run checks
        run: |
          python -m compileall -q sheet run_thog2_owt_core.py tests/test_premat_allocator_aware_admission.py
          git diff --check
          python -m pytest -q tests/test_premat_allocator_aware_admission.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet/premat.py tests/test_premat_allocator_aware_admission.py
          git commit -m "Reuse Premat allocator certificate by live lifetime"
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
