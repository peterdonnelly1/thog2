# vvv THOG temporary source inspection for Processing tok/s convenience chart
name: Temporary locate tok/s source
on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/tmp_find_toks_source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
      - name: Locate throughput and metric group implementation
        run: |
          echo '=== TOK/S / THROUGHPUT ==='
          grep -RniE 'tok/s|tokens.?per.?sec|tokens_per|throughput|tok_per|toks_per' --exclude-dir=.git . || true
          echo '=== LOCAL METRIC GROUPS ==='
          grep -RniE 'local.metric|metric.group|wandb.groups|system' sheet/local_dashboard_assets run_thog2_local_dashboard.py | head -n 300 || true
          echo '=== INDEX SCRIPTS ==='
          grep -n '<script' sheet/local_dashboard_assets/index.html || true
# ^^^ THOG
