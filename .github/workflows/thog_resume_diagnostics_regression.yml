name: THOG resume diagnostics regression check

on:
  push:
    branches:
      - master
    paths:
      - sheet/stage6_diagnostics.py
      - sheet/checkpoints.py
      - tests/test_resume_and_diagnostics_regressions.py
      - .github/workflows/thog_resume_diagnostics_regression.yml

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile touched modules
        run: |
          python -m py_compile sheet/stage6_diagnostics.py sheet/checkpoints.py tests/test_resume_and_diagnostics_regressions.py

      - name: Run focused regression tests
        run: |
          python -m unittest tests.test_resume_and_diagnostics_regressions

      - name: Record successful regression check
        run: |
          git config user.name thog-actions
          git config user.email thog-actions@users.noreply.github.com
          printf '%s\n' 'THOG resume diagnostics regression checks passed' > .github/thog_resume_diagnostics_regression_ok.txt
          git add .github/thog_resume_diagnostics_regression_ok.txt
          git commit -m 'Record THOG resume diagnostics regression checks'
          git push origin HEAD:master
