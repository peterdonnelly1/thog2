name: Apply PLASTIC COARSE FINE M6 full radius

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_m6.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: write

jobs:
  apply_full_radius:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply full-radius FINE policy when absent
        run: |
          if ! grep -q 'Every valid integer count in the inclusive configured radius' sheet/plastic_depth_lookahead_patch.py; then
            python tools/apply_plastic_coarse_fine_m6.py
          fi

      - name: Verify transformed source
        run: |
          grep -q 'decision_counts = tuple(range(lower, upper + 1))' sheet/plastic_depth_lookahead_patch.py
          grep -q 'standardized = -median / sigma' sheet/plastic_depth_lookahead_patch.py
          grep -q 'updated_histories = {}' sheet/plastic_depth_lookahead_patch.py

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Compile full-radius module
        run: python -m py_compile sheet/plastic_depth_lookahead_patch.py

      - name: Run full-radius and affected controller tests
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_full_radius.py \
            tests/test_plastic_depth_transition_control_plane.py \
            tests/test_plastic_depth_controller_stability.py \
            tests/test_plastic_depth_probe_delta_console.py \
            tests/test_plastic_depth_startup_lookahead_ui.py

      - name: Commit full-radius FINE policy
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sheet/plastic_depth_lookahead_patch.py
          git commit -m 'Implement full-radius PLASTIC FINE probing'
          git fetch origin PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git rebase origin/PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
