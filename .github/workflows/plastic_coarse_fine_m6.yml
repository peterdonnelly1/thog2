name: Validate PLASTIC COARSE FINE M6 full radius

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_m6.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: read

jobs:
  validate_full_radius:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify final overlay order
        run: |
          grep -q 'plastic_depth_coarse_fine_patch' sheet/__init__.py
          grep -q 'candidates = tuple(range(lower, upper + 1))' sheet/plastic_depth_coarse_fine_patch.py
          grep -q 'standardized = -median / sigma' sheet/plastic_depth_coarse_fine_patch.py
          grep -q 'updated_histories = {}' sheet/plastic_depth_coarse_fine_patch.py

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Compile full-radius modules
        run: |
          python -m py_compile \
            sheet/plastic_depth_coarse_fine_patch.py \
            sheet/plastic_depth_lookahead_patch.py \
            sheet/__init__.py

      - name: Run full-radius and affected controller tests
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_full_radius.py \
            tests/test_plastic_depth_transition_control_plane.py \
            tests/test_plastic_depth_controller_stability.py \
            tests/test_plastic_depth_probe_delta_console.py \
            tests/test_plastic_depth_startup_lookahead_ui.py
