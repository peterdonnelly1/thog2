name: Apply PLASTIC v0.52 broad regression migration v2

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - tools/apply_plastic_v052_broad_regression_test_migration.py
      - tools/apply_plastic_v052_broad_regression_test_migration_v2.py
      - .github/workflows/apply_plastic_v052_broad_regression_test_migration_v2.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate_and_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply stale regression migration
        run: |
          python tools/apply_plastic_v052_broad_regression_test_migration_v2.py
          python tools/apply_plastic_v052_broad_regression_test_migration_v2.py

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy tiktoken tensorboard wandb psutil

      - name: Validate migrated contracts
        run: |
          python -m py_compile \
            tools/apply_plastic_v052_broad_regression_test_migration.py \
            tools/apply_plastic_v052_broad_regression_test_migration_v2.py
          python -m pytest -q \
            tests/test_console_progress_pretty_rows.py::test_positive_delta_is_red_and_signed \
            tests/test_console_progress_pretty_rows.py::test_training_and_validation_loss_numerals_use_the_same_numeric_field_width \
            tests/test_picton_wrapper_defaults_and_nonfinite_policy.py::test_core_nonfinite_recovery_defaults_to_bounded_skip_across_public_config_layers \
            tests/test_plastic_depth_controller.py::test_full_window_gate_collects_required_observations_before_transition \
            tests/test_plastic_depth_controller.py::test_zero_mad_uses_positive_scale_floor \
            tests/test_plastic_depth_controller.py::test_update_brake_blocks_transition_but_preserves_new_evidence \
            tests/test_plastic_depth_controller.py::test_equal_improvements_are_directionally_ambiguous_and_hold \
            tests/test_plastic_depth_controller.py::test_infeasible_direction_does_not_create_history \
            tests/test_plastic_depth_controller.py::test_invalid_controller_inputs_are_rejected \
            tests/test_plastic_depth_interfaces.py::test_plastic_fixed_cli_resolves_and_preserves_public_identity \
            tests/test_plastic_depth_interfaces.py::test_plastic_learned_count_cli_resolves_maximum_and_initial_count \
            tests/test_plastic_depth_interfaces.py::test_plastic_capability_guards_are_explicit \
            tests/test_plastic_depth_interfaces.py::test_public_wrapper_dry_run_propagates_plastic_controls \
            tests/test_plastic_depth_interfaces.py::test_wrapper_help_and_shell_syntax_cover_plastic_depth \
            tests/test_plastic_depth_interfaces.py::test_memory_budget_rejects_cpu_execution \
            tests/test_plastic_depth_interfaces.py::test_cuda_allocator_reserve_cli_propagates_without_changing_artifact_identity \
            tests/test_plastic_depth_interfaces.py::test_cuda_allocator_reserve_rejects_negative_cli_value \
            tests/test_plastic_depth_interfaces.py::test_persisted_plastic_identity_uses_only_canonical_public_control_names \
            tests/test_plastic_depth_interfaces.py::test_retired_short_identity_aliases_remain_checkpoint_compatible \
            tests/test_resume_and_fork_cli_compatibility.py::ResumeAndForkCliCompatibilityTests::test_lifecycle_parser_accepts_all_preserved_master_long_controls \
            tests/test_plastic_depth_directional_coherence_v052.py \
            tests/test_plastic_depth_console_minor_patch.py

      - name: Run complete CPU regression
        id: branch_suite
        continue-on-error: true
        run: |
          rm -rf .pytest_cache
          set -o pipefail
          python -m pytest -q tests 2>&1 | tee broad_regression_after_v052_migration.log

      - name: Require zero branch-only failures
        env:
          BRANCH_SUITE_OUTCOME: ${{ steps.branch_suite.outcome }}
        run: |
          # vvv THOG classify the complete migrated suite against the untouched PLASTIC_DEPTH inherited-failure inventory
          if [ "$BRANCH_SUITE_OUTCOME" = "success" ]; then
            : > branch_only_failures_after_v052_migration.txt
            echo 'Regression classification: complete CPU suite passed; 0 branch-only failures.'
          else
            python - <<'PY'
          import json
          from pathlib import Path

          cache_path = Path('.pytest_cache/v/cache/lastfailed')
          branch_failed = set(
              json.loads(cache_path.read_text(encoding='utf-8'))
              if cache_path.exists()
              else {}
          )
          inherited = {
              line.strip()
              for line in Path(
                  'docs/THOG2_COARSE_FINE_INHERITED_FAILURES.txt'
              ).read_text(encoding='utf-8').splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          }
          branch_only = sorted(branch_failed - inherited)
          inherited_observed = sorted(branch_failed & inherited)
          print(
              'Regression classification: '
              f'{len(branch_failed)} total; '
              f'{len(inherited_observed)} inherited; '
              f'{len(branch_only)} branch-only.'
          )
          for node_id in branch_only:
              print(f'BRANCH_ONLY {node_id}')
          Path('branch_only_failures_after_v052_migration.txt').write_text(
              '\n'.join(branch_only) + ('\n' if branch_only else ''),
              encoding='utf-8',
          )
          if branch_only:
              raise SystemExit('branch-only CPU regression failures remain')
          PY
          fi
          # ^^^ THOG

      - name: Retain migration regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plastic-v052-broad-regression-migration-v2-log
          path: |
            broad_regression_after_v052_migration.log
            branch_only_failures_after_v052_migration.txt
          if-no-files-found: warn

      - name: Commit validated migrated tests
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git restore -- .github/workflows
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          git commit -m 'Migrate stale regression tests to PLASTIC v0.52'
          for attempt in 1 2 3; do
            git fetch origin PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
            if git rebase origin/PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION && git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1

# vvv THOG repaired validated migration of stale pre-v0.52 regression assertions with complete CPU-suite classification before writeback
# ^^^ THOG
