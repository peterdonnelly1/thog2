name: Apply PLASTIC COARSE FINE production lifecycle

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_production_lifecycle.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: write

jobs:
  apply_production_lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply production lifecycle integration
        run: |
          if ! grep -q 'run_plastic_coarse_fine_lifecycle' run_thog2_lifecycle.py; then
            python tools/apply_plastic_coarse_fine_production_lifecycle.py
          fi
          if ! grep -q '_plastic_coarse_trial_checkpoint_from_payload' run_thog2_lifecycle.py; then
            python tools/apply_plastic_coarse_trial_resume_routing.py
          fi

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Compile production lifecycle
        run: |
          python -m py_compile \
            run_thog2_lifecycle.py \
            sheet/plastic_depth_coarse_checkpoint.py \
            sheet/plastic_depth_coarse_runner.py \
            sheet/plastic_depth_lifecycle.py \
            sheet/plastic_depth_resume.py

      - name: Verify production routing
        run: |
          grep -q 'training_config.plastic__coarse_phase == "enabled"' run_thog2_lifecycle.py
          grep -q 'checkpoint_plastic_coarse_fine' run_thog2_lifecycle.py
          grep -q '_plastic_coarse_trial_checkpoint_from_payload' run_thog2_lifecycle.py
          grep -q 'resume_checkpoint_state=plastic_coarse_resume.structured()' run_thog2_lifecycle.py
          grep -q 'resume_plastic_coarse_fine_boundary' run_thog2_lifecycle.py
          grep -q 'result\["plastic_coarse_fine"\]' run_thog2_lifecycle.py

      - name: Verify inline THOG marker columns in production launcher
        run: |
          python - <<'PY'
          from pathlib import Path

          violations = []
          for line_number, line in enumerate(
              Path('run_thog2_lifecycle.py').read_text(encoding='utf-8').splitlines(),
              start=1,
          ):
              if '# <<< THOG' in line and line.index('# <<< THOG') + 1 != 156:
                  violations.append((line_number, line.index('# <<< THOG') + 1))
          if violations:
              raise SystemExit(f'inline THOG markers not at column 156: {violations}')
          PY

      - name: Run real CPU lifecycle and affected tests
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_coarse_checkpoint.py \
            tests/test_plastic_depth_coarse_resume_lifecycle.py \
            tests/test_plastic_depth_coarse_runner_resume.py \
            tests/test_plastic_depth_coarse_real_lifecycle.py \
            tests/test_plastic_depth_lifecycle.py \
            tests/test_plastic_depth_resume.py \
            tests/test_plastic_depth_lifecycle_checkpoint.py \
            tests/test_plastic_depth_wrapper_options.py

      - name: Commit production lifecycle integration
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add run_thog2_lifecycle.py
          git commit -m 'Route PLASTIC mid-trial checkpoints through COARSE resume'
          git fetch origin PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git rebase origin/PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
