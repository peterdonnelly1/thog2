name: Temporary Instra live-time verification

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/instra_live_time_tail_verify.yml
      - sheet/local_dashboard_live_loss.py
      - tests/test_instra_live_loss.py
      - tests/test_local_dashboard_wandb_time_axes.py
      - tests/test_local_chart_dashboard.py

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Verify Instra live time axes
        run: |
          python -m compileall -q sheet/local_dashboard_live_loss.py
          git diff --check
          python -m pytest -q tests/test_instra_live_loss.py tests/test_local_dashboard_wandb_time_axes.py tests/test_local_chart_dashboard.py
