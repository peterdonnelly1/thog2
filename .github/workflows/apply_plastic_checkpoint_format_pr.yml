# vvv THOG temporary PR-triggered applier for the final PLASTIC checkpoint-format phase
name: Apply final PLASTIC checkpoint format from PR

on:
  pull_request:
    branches:
      - PLASTIC_DEPTH
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: plastic-checkpoint-format-final
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.head_ref == 'PLASTIC_DEPTH_CHECKPOINT_FORMAT_FINAL'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact takeover branch
        uses: actions/checkout@v4
        with:
          ref: PLASTIC_DEPTH_CHECKPOINT_FORMAT_FINAL
          fetch-depth: 0
          clean: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU test dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pytest psutil tensorboard tiktoken wandb matplotlib plotly
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Restore validation workflow and apply verified patches
        run: |
          set -euo pipefail
          git checkout 8a3de27a2ac5d6aae7dc27526099782075ab622e -- .github/workflows/plastic_depth_ci.yml
          base64 --decode docs/plastic_checkpoint_format.patch.gz.b64 | gzip --decompress > /tmp/plastic_checkpoint_format.patch
          echo 'b9782323a384af50b76525a35623b5486dcc6a61cb2a663468c0eb41f262da49  /tmp/plastic_checkpoint_format.patch' | sha256sum --check --strict
          git apply --check /tmp/plastic_checkpoint_format.patch
          git apply /tmp/plastic_checkpoint_format.patch
          base64 --decode docs/plastic_checkpoint_guard_followup.patch.gz.b64 | gzip --decompress > /tmp/plastic_checkpoint_guard_followup.patch
          echo 'bce34b3dc7ac0ccbcc06f94ba334493d14e4d386081ffe52b596d3d9eabc5aba  /tmp/plastic_checkpoint_guard_followup.patch' | sha256sum --check --strict
          git apply --check /tmp/plastic_checkpoint_guard_followup.patch
          git apply /tmp/plastic_checkpoint_guard_followup.patch
          git diff --check

      - name: Compile and validate shell syntax
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python -m compileall -q run_thog2_owt.py run_thog2_owt_core.py sheet tests
          bash -n train_OWT.sh train_OWT_core.sh resume_and_fork_OWT.sh plastic_depth_gpu_smokes.sh

      - name: Run focused checkpoint and PLASTIC tests
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_plastic_depth.py \
            tests/test_plastic_depth_gauge.py \
            tests/test_plastic_depth_optimizer.py \
            tests/test_plastic_depth_inline_probe.py \
            tests/test_plastic_depth_controller.py \
            tests/test_plastic_depth_cuda.py \
            tests/test_plastic_depth_basis_cache.py \
            tests/test_plastic_depth_interfaces.py \
            tests/test_plastic_depth_checkpoint_format.py \
            tests/test_sheet_stage6_trainer.py \
            tests/test_sheet_stage6_wandb.py \
            tests/test_sheet_stage6_run_config.py \
            tests/test_sheet_stage6_restart.py \
            tests/test_sheet_stage4_checkpointing.py \
            tests/test_sheet_stage4_restore.py \
            tests/test_sheet_stage4_state.py \
            tests/test_resume_identity_and_throughput.py \
            tests/test_resume_and_diagnostics_regressions.py \
            tests/test_resume_and_fork_cpu_integration.py

      - name: Run affected DEPTH regressions
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_stage2_basis_kernel.py \
            tests/test_stage7_dct_basis_kernel.py \
            tests/test_haar_basis_kernel.py \
            tests/test_lapped_cosine_basis_kernel.py \
            tests/test_depth_materialisation_runtime.py \
            tests/test_depth_layer_norm_bias_modes.py \
            tests/test_stage4_depth_materialization.py \
            tests/test_stage3_semantic_materialization.py \
            tests/test_stage3b_model_semantic_attention.py \
            tests/test_sheet_stage2.py \
            tests/test_picton_attention_boundary.py \
            tests/test_sheet_stage3_resume.py \
            tests/test_stage4b_training_factory_cleanup.py \
            tests/test_sheet_stage5_batch_sharding.py \
            tests/test_sheet_stage5_failures.py \
            tests/test_sheet_stage5_target_geometry.py \
            tests/test_stage5_mlp_block_materialization.py \
            tests/test_stage5b_full_block_materialization.py \
            tests/test_modified_fast_discard_false_distributed.py \
            tests/test_sheet_stage6_controls.py \
            tests/test_sheet_stage6_dense_checkpointing.py \
            tests/test_torch_compile_runtime.py \
            tests/test_hyperblock_looping.py \
            tests/test_hyperblock_run_config.py \
            tests/test_hyperblock_wrapper.py

      - name: Run two-rank CPU DDP check
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python tests/plastic_depth_ddp_check.py

      - name: Commit tested source and remove transport files
        run: |
          set -euo pipefail
          rm docs/plastic_checkpoint_format.patch.gz.b64
          rm docs/plastic_checkpoint_guard_followup.patch.gz.b64
          rm docs/plastic_checkpoint_format.trigger
          rm docs/plastic_checkpoint_format_final.trigger
          rm .github/workflows/apply_plastic_checkpoint_format.yml
          rm .github/workflows/apply_plastic_checkpoint_format_final.yml
          rm .github/workflows/apply_plastic_checkpoint_format_pr.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Version PLASTIC checkpoint geometry format'
          git push origin HEAD:PLASTIC_DEPTH_CHECKPOINT_FORMAT_FINAL
# ^^^ THOG
