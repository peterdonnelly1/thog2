# vvv THOG temporary application/verification workflow for Processing tok/s convenience chart
name: Temporary Processing tok/s chart
on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - tmp_add_processing_throughput_chart.py
      - .github/workflows/tmp_processing_throughput_chart.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply_and_verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Apply update
        run: python tmp_add_processing_throughput_chart.py
      - name: Verify
        run: |
          python -m compileall -q sheet/stage6_source.py sheet/local_chart_store.py sheet/wandb_telemetry.py run_thog2_owt_core.py run_thog2_local_dashboard.py tests/test_premat_processing.py
          node --check sheet/local_dashboard_assets/dashboard_processing.js
          git diff --check
          python -m pytest -q tests/test_premat_processing.py tests/test_resume_identity_and_throughput.py tests/test_premat.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sheet/stage6_source.py run_thog2_owt_core.py sheet/local_chart_store.py sheet/wandb_telemetry.py run_thog2_local_dashboard.py sheet/local_dashboard_assets/index.html sheet/local_dashboard_assets/dashboard_processing.css sheet/local_dashboard_assets/dashboard_processing.js tests/test_premat_processing.py THOG2_DYNAMIC_PREMATERIALISATION_LOG.md
          git commit -m 'Add Processing throughput chart'
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
# ^^^ THOG
