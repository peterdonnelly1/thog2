name: Apply THOG Mods V2

on:
  push:
    paths:
      - .github/workflows/apply-thog-mods-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply THOG patch series
        shell: bash
        run: |
          set -euo pipefail
          start_sha="$(git rev-parse HEAD)"
          git config user.name "thog-actions"
          git config user.email "thog-actions@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def commit(message: str, *paths: str) -> None:
              subprocess.run(["git", "add", *paths], check=True)
              if subprocess.run(["git", "diff", "--cached", "--quiet"], check=False).returncode == 0:
                  raise SystemExit(f"no staged changes for commit: {message}")
              subprocess.run(["git", "commit", "-m", message], check=True)

          # 1. Clean Ctrl-C telemetry finish.
          replace_once(
              "sheet/wandb_telemetry.py",
              '''    def finish(self) -> None:
        if self.run is not None:
            self.run.finish()
            self.run = None
        if self.writer is not None:
            self.writer.flush()
            self.writer.close()
            self.writer = None
''',
              '''    # vvv THOG allow the runner to tell W&B that an intentional Ctrl-C finished cleanly
    def finish(self, *, exit_code: Optional[int] = None) -> None:
        if self.run is not None:
            if exit_code is None:
                self.run.finish()
            else:
                try:
                    self.run.finish(exit_code=exit_code)
                except TypeError:
                    self.run.finish()
            self.run = None
        if self.writer is not None:
            self.writer.flush()
            self.writer.close()
            self.writer = None
    # ^^^ THOG
''',
          )
          replace_once(
              "run_thog2_owt.py",
              '''    telemetry = WandbTelemetry(enabled=(config.wandb_enabled and trainer.distributed.is_primary), project=config.wandb_project, entity=config.wandb_entity, mode=config.wandb_mode, root=Path(config.wandb_root), name=config.artifact_name, group=config.experiment_prefix, job_type="dense2" if config.model_type == "dense" else "sheet", config={**canonical, "source_commit": source["commit"], "source_branch": source["branch"], "dataset_record": dataset, "parameter_report": trainer.parameter_report})
    try:
''',
              '''    telemetry = WandbTelemetry(enabled=(config.wandb_enabled and trainer.distributed.is_primary), project=config.wandb_project, entity=config.wandb_entity, mode=config.wandb_mode, root=Path(config.wandb_root), name=config.artifact_name, group=config.experiment_prefix, job_type="dense2" if config.model_type == "dense" else "sheet", config={**canonical, "source_commit": source["commit"], "source_branch": source["branch"], "dataset_record": dataset, "parameter_report": trainer.parameter_report})
    # vvv THOG preserve shell interrupt status while allowing W&B to record a clean intentional stop
    telemetry_exit_code: Optional[int] = None
    # ^^^ THOG
    try:
''',
          )
          replace_once(
              "run_thog2_owt.py",
              '''        return 0
    finally:
        if rank == 0:
            telemetry.finish()
        trainer.close()
''',
              '''        return 0
    # vvv THOG convert Ctrl-C into a clean telemetry finish while retaining conventional process status 130
    except KeyboardInterrupt:
        telemetry_exit_code = 0
        if trainer.distributed.is_primary:
            print("interrupted by Ctrl-C; finishing telemetry cleanly", flush=True)
        return 130
    finally:
        if rank == 0:
            telemetry.finish(exit_code=telemetry_exit_code)
        trainer.close()
    # ^^^ THOG
''',
          )
          commit("Finish telemetry cleanly on interrupt", "sheet/wandb_telemetry.py", "run_thog2_owt.py")

          # 2. Disable depth curve plots by default.
          replace_once(
              "train_OWT.sh",
              '''DEPTH_CURVE_PLOTS="${THOG2_DEPTH_CURVE_PLOTS:-eval}"''',
              '''# vvv THOG depth-curve plotting is opt-in because it is diagnostic overhead
DEPTH_CURVE_PLOTS="${THOG2_DEPTH_CURVE_PLOTS:-none}"
# ^^^ THOG''',
          )
          commit("Default depth curve plots to none", "train_OWT.sh")

          # 3. Clarify geometry registry columns and definitions.
          replace_once(
              "sheet/geometry_registry.py",
              '''        f"{'selector':40} {'type':10} {'depth ok':8} {'generic mat':12} {'legacy':7} axes / uncompressed axes",
    ]
    for entry in GEOMETRY_REGISTRY.values():
        implemented = "yes" if entry.implemented else "no"
        legacy = "yes" if entry.legacy_only else "no"
        axes = " × ".join(entry.compressed_axes)
        uncompressed = " × ".join(entry.independent_indices) if entry.independent_indices else "none"
        lines.append(f"{entry.selector:40} {entry.implied_type:10} {str(entry.permits_depth_companion):8} {implemented:12} {legacy:7} {axes}; uncompressed={uncompressed}")
''',
              '''        "depth-compatible: selector may accompany DEPTH without implying a 3-D BLOCK/BLOCK_SET field",
        "materializer:     generic systematic materializer exists for this exact selector",
        "legacy-only:      compatibility-oriented entry rather than the systematic geometry path",
        "",
        f"{'selector':40} {'type':10} {'depth-compatible':16} {'materializer':12} {'legacy-only':11} {'compressed axes':36} uncompressed axes",
    ]
    # vvv THOG expose compressed and uncompressed axes independently and make status columns self-explanatory
    for entry in GEOMETRY_REGISTRY.values():
        depth_compatible = "yes" if entry.permits_depth_companion else "no"
        materializer = "yes" if entry.implemented else "no"
        legacy_only = "yes" if entry.legacy_only else "no"
        compressed_axes = " × ".join(entry.compressed_axes)
        uncompressed_axes = " × ".join(entry.independent_indices) if entry.independent_indices else "none"
        lines.append(f"{entry.selector:40} {entry.implied_type:10} {depth_compatible:16} {materializer:12} {legacy_only:11} {compressed_axes:36} {uncompressed_axes}")
    # ^^^ THOG
''',
          )
          commit("Clarify geometry registry table columns", "sheet/geometry_registry.py")

          # 4. Widen wrapper option-summary value column.
          replace_once(
              "train_OWT.sh",
              '''  semantic adapter bypass:   $BYPASS_SEMANTIC_QKV_ADAPTER
  direct factorised MLP:    $DIRECT_FACTORISED_MLP
  vectorise per-head materialisation: $VECTORISE_PER_HEAD_MATERIALISATION
''',
              '''  semantic adapter bypass:                $BYPASS_SEMANTIC_QKV_ADAPTER
  direct factorised MLP:                  $DIRECT_FACTORISED_MLP
  vectorise per-head materialisation:     $VECTORISE_PER_HEAD_MATERIALISATION
''',
          )
          commit("Widen wrapper option summary alignment", "train_OWT.sh")

          # 5. Give the model/options block a common value column.
          replace_once(
              "run_thog2_owt.py",
              '''# vvv THOG print resolved model parameters and execution options immediately before training
def print_model_parameters_and_options(config: OwtRunConfig, trainer: OwtTrainer) -> None:
    report = trainer.parameter_report
    persistent = int(report["persistent_parameters"])
    dense_equivalent = int(report["dense_equivalent_total_parameters"])
    sheet_coefficients = int(report["sheet_coefficients"])
    compression = (dense_equivalent / persistent) if persistent else 0.0
    print("model parameters and options", flush=True)
    print(f"  parameters: persistent={persistent:,}  sheet coefficients={sheet_coefficients:,}  dense equivalent={dense_equivalent:,}  dense/persistent={compression:.2f}x", flush=True)
    print(f"  optimiser:  lr={config.learning_rate:.3e}  min_lr={config.min_lr:.3e}  warmup={config.warmup_iters}  weight_decay={config.weight_decay:g}  grad_clip={config.grad_clip:g}", flush=True)
    print(f"  wall stop:  max_wall_minutes={config.max_wall_minutes}", flush=True)                                                                           # <<< THOG show soft wall-clock budget for equal-time grids
    print(f"  non-finite: policy={config.nonfinite_update_policy}  max_skips={config.max_nonfinite_update_skips}", flush=True)                                # <<< THOG show bounded recovery policy before the run
    print(f"  batches:    micro={config.batch_size}  accumulation={config.gradient_accumulation_steps}  tokens/update={config.tokens_per_iter():,}", flush=True)
    # vvv THOG make stochastic execution depth visible without dumping selected layer indices
    print(f"  layer dropout: strata={config.layer_dropout_n_strata}  stratum_size={config.layer_dropout_stratum_size}  active/stratum={config.layer_dropout_active_per_stratum}  active_layers={config.n_active_layers}/{config.n_layer}  resample_steps={config.layer_dropout_resample_steps}", flush=True)
    # ^^^ THOG
    if config.model_type == "sheet":
        model_config = trainer.raw_model.config
        print(f"  execution:  semantic_qkv_bypass={model_config.bypass_semantic_qkv_adapter}  vectorise_per_head={model_config.vectorise_per_head_materialisation}  direct_factorised_mlp={model_config.direct_factorised_mlp}  activation_checkpointing={config.activation_checkpointing}  depth_compress_layer_norm_and_bias={model_config.depth_compress_layer_norm_and_bias}", flush=True)  # <<< THOG show DEPTH vector mode
    print(flush=True)
# ^^^ THOG
''',
              '''# vvv THOG print resolved model parameters and execution options immediately before training
def _print_model_option(label: str, value: str) -> None:
    print(f"  {label:<24} {value}", flush=True)


def print_model_parameters_and_options(config: OwtRunConfig, trainer: OwtTrainer) -> None:
    report = trainer.parameter_report
    persistent = int(report["persistent_parameters"])
    dense_equivalent = int(report["dense_equivalent_total_parameters"])
    sheet_coefficients = int(report["sheet_coefficients"])
    compression = (dense_equivalent / persistent) if persistent else 0.0
    print("model parameters and options", flush=True)
    _print_model_option("parameters:", f"persistent={persistent:,}  sheet coefficients={sheet_coefficients:,}  dense equivalent={dense_equivalent:,}  dense/persistent={compression:.2f}x")
    _print_model_option("optimiser:", f"lr={config.learning_rate:.3e}  min_lr={config.min_lr:.3e}  warmup={config.warmup_iters}  weight_decay={config.weight_decay:g}  grad_clip={config.grad_clip:g}")
    _print_model_option("wall stop:", f"max_wall_minutes={config.max_wall_minutes}")
    _print_model_option("non-finite:", f"policy={config.nonfinite_update_policy}  max_skips={config.max_nonfinite_update_skips}")
    _print_model_option("batches:", f"micro={config.batch_size}  accumulation={config.gradient_accumulation_steps}  tokens/update={config.tokens_per_iter():,}")
    _print_model_option("layer dropout:", f"strata={config.layer_dropout_n_strata}  stratum_size={config.layer_dropout_stratum_size}  active/stratum={config.layer_dropout_active_per_stratum}  active_layers={config.n_active_layers}/{config.n_layer}  resample_steps={config.layer_dropout_resample_steps}")
    if config.model_type == "sheet":
        model_config = trainer.raw_model.config
        _print_model_option("execution:", f"semantic_qkv_bypass={model_config.bypass_semantic_qkv_adapter}  vectorise_per_head={model_config.vectorise_per_head_materialisation}  direct_factorised_mlp={model_config.direct_factorised_mlp}  activation_checkpointing={config.activation_checkpointing}  depth_compress_layer_norm_and_bias={model_config.depth_compress_layer_norm_and_bias}")
    print(flush=True)
# ^^^ THOG
''',
          )
          commit("Widen model option summary alignment", "run_thog2_owt.py")

          # 6. Permit simultaneous TensorBoard and online W&B.
          replace_once(
              "sheet/wandb_telemetry.py",
              '''INSTRUMENTATION_BACKENDS = ("tensorboard", "wandb", "none")''',
              '''# vvv THOG simultaneous TensorBoard and W&B is a first-class instrumentation mode
INSTRUMENTATION_BACKENDS = ("tensorboard", "wandb", "both", "none")
# ^^^ THOG''',
          )
          replace_once(
              "sheet/wandb_telemetry.py",
              '''        "THOG2_INSTRUMENTATION must be tensorboard, wandb, or none; "''',
              '''        "THOG2_INSTRUMENTATION must be tensorboard, wandb, both, or none; "''',
          )
          replace_once(
              "sheet/wandb_telemetry.py",
              '''    def start(self) -> None:
        if not self.enabled or self.backend == "none":
            return
        if self.backend == "wandb":
            self._start_wandb()
            return
        self._start_tensorboard()
''',
              '''    # vvv THOG start both telemetry sinks when requested while preserving existing single-sink behaviour
    def start(self) -> None:
        if not self.enabled or self.backend == "none":
            return
        if self.backend == "both":
            self._start_tensorboard()
            if self.run is None:
                self._start_wandb()
            return
        if self.backend == "wandb":
            self._start_wandb()
            return
        self._start_tensorboard()
    # ^^^ THOG
''',
          )
          replace_once(
              "train_OWT.sh",
              '''  -I INSTRUMENTATION=${INSTRUMENTATION}             tensorboard | wandb | wandb_offline | none''',
              '''  -I INSTRUMENTATION=${INSTRUMENTATION}             tensorboard | wandb | both | wandb_offline | none''',
          )
          replace_once(
              "train_OWT.sh",
              '''case "$INSTRUMENTATION" in
  tensorboard) INSTRUMENTATION_BACKEND="tensorboard"; WANDB_FLAG="--no-wandb"; WANDB_MODE="disabled" ;;
  wandb) INSTRUMENTATION_BACKEND="wandb"; WANDB_FLAG="--wandb"; WANDB_MODE="online" ;;
  wandb_offline) INSTRUMENTATION_BACKEND="wandb"; WANDB_FLAG="--wandb"; WANDB_MODE="offline" ;;
  none) INSTRUMENTATION_BACKEND="none"; WANDB_FLAG="--no-wandb"; WANDB_MODE="disabled" ;;
  *) echo "INSTRUMENTATION must be tensorboard, wandb, wandb_offline, or none." >&2; exit 2 ;;
esac''',
              '''case "$INSTRUMENTATION" in
  tensorboard) INSTRUMENTATION_BACKEND="tensorboard"; WANDB_FLAG="--no-wandb"; WANDB_MODE="disabled" ;;
  wandb) INSTRUMENTATION_BACKEND="wandb"; WANDB_FLAG="--wandb"; WANDB_MODE="online" ;;
  both) INSTRUMENTATION_BACKEND="both"; WANDB_FLAG="--wandb"; WANDB_MODE="online" ;;
  wandb_offline) INSTRUMENTATION_BACKEND="wandb"; WANDB_FLAG="--wandb"; WANDB_MODE="offline" ;;
  none) INSTRUMENTATION_BACKEND="none"; WANDB_FLAG="--no-wandb"; WANDB_MODE="disabled" ;;
  *) echo "INSTRUMENTATION must be tensorboard, wandb, both, wandb_offline, or none." >&2; exit 2 ;;
esac''',
          )
          commit("Support dual wandb and tensorboard instrumentation", "sheet/wandb_telemetry.py", "train_OWT.sh")
          PY

          bash -n train_OWT.sh \
            dreedle_gpu_common.sh \
            dreedle_simple_runstring_gpu_0.sh \
            dreedle_simple_runstring_gpu_1.sh \
            scruffy_simple_runstring.sh \
            scruffy_dropout_runstring.sh

          python3 -m py_compile \
            run_thog2_owt.py \
            sheet/wandb_telemetry.py \
            sheet/geometry_registry.py

          bash train_OWT.sh -h | grep -F 'tensorboard | wandb | both | wandb_offline | none'
          grep -F 'DEPTH_CURVE_PLOTS="${THOG2_DEPTH_CURVE_PLOTS:-none}"' train_OWT.sh
          grep -F 'depth-compatible' sheet/geometry_registry.py
          grep -F 'INSTRUMENTATION_BACKENDS = ("tensorboard", "wandb", "both", "none")' sheet/wandb_telemetry.py
          git diff --check "$start_sha..HEAD"

          git rm -f \
            .github/workflows/apply-thog-mods-v2.yml \
            .github/workflows/thog_probe.yml \
            .github/workflows/thog_probe2.yml \
            .github/thog_actions_probe_ok.txt
          git commit -m "Remove temporary GitHub Actions helpers"

          git push origin HEAD:master
