name: Temporary Premat allocator-aware wiring

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/premat_allocator_aware_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - name: Apply guarded source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one match, found {count}: {old!r}")
              file_path.write_text(text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"{path}: expected {expected} matches, found {count}: {old!r}")
              file_path.write_text(text.replace(old, new))

          # Low-level API defaults preserve existing direct call sites and tests.
          replace_count(
              "sheet/premat.py",
              "    allocator_aware_admission: str,\n",
              "    allocator_aware_admission: str = \"disabled\",\n",
              2,
          )
          replace_once(
              "sheet/premat.py",
              "            allocator_backend = torch.cuda.get_allocator_backend()\n",
              "            allocator_backend = torch.cuda.memory.get_allocator_backend()\n",
          )

          # Model configuration and runtime construction.
          replace_once(
              "sheet/model.py",
              "    premat_gpu_memory_buffer_gb: float = 1.0\n    premat_cuda_stream_priority: str = \"normal\"\n",
              "    premat_gpu_memory_buffer_gb: float = 1.0\n    premat_allocator_aware_admission: str = \"disabled\"\n    premat_cuda_stream_priority: str = \"normal\"\n",
          )
          replace_once(
              "sheet/model.py",
              "            gpu_memory_buffer_gb=self.premat_gpu_memory_buffer_gb,\n            cuda_stream_priority=self.premat_cuda_stream_priority,\n",
              "            gpu_memory_buffer_gb=self.premat_gpu_memory_buffer_gb,\n            allocator_aware_admission=self.premat_allocator_aware_admission,\n            cuda_stream_priority=self.premat_cuda_stream_priority,\n",
          )
          replace_once(
              "sheet/model.py",
              "                gpu_memory_buffer_gb=config.premat_gpu_memory_buffer_gb,\n                cuda_stream_priority=config.premat_cuda_stream_priority,\n",
              "                gpu_memory_buffer_gb=config.premat_gpu_memory_buffer_gb,\n                allocator_aware_admission=config.premat_allocator_aware_admission,\n                cuda_stream_priority=config.premat_cuda_stream_priority,\n",
          )

          # Public run configuration, naming and trainer handoff.
          replace_once(
              "sheet/run_config.py",
              "    premat_gpu_memory_buffer_gb: float = 1.0\n    premat_cuda_stream_priority: str = \"normal\"\n",
              "    premat_gpu_memory_buffer_gb: float = 1.0\n    premat_allocator_aware_admission: str = \"disabled\"\n    premat_cuda_stream_priority: str = \"normal\"\n",
          )
          replace_once(
              "sheet/run_config.py",
              "            gpu_memory_buffer_gb=self.premat_gpu_memory_buffer_gb,\n            cuda_stream_priority=self.premat_cuda_stream_priority,\n",
              "            gpu_memory_buffer_gb=self.premat_gpu_memory_buffer_gb,\n            allocator_aware_admission=self.premat_allocator_aware_admission,\n            cuda_stream_priority=self.premat_cuda_stream_priority,\n",
          )
          replace_once(
              "sheet/run_config.py",
              "            or float(self.premat_gpu_memory_buffer_gb) != 1.0\n            or self.premat_cuda_stream_priority != \"normal\"\n",
              "            or float(self.premat_gpu_memory_buffer_gb) != 1.0\n            or self.premat_allocator_aware_admission != \"disabled\"\n            or self.premat_cuda_stream_priority != \"normal\"\n",
          )
          replace_once(
              "sheet/run_config.py",
              "            delay_fragment = (\n",
              "            allocator_fragment = (\n                f\"AA{self.premat_allocator_aware_admission[0].upper()}_\"\n                if self.premat_allocator_aware_admission != \"disabled\"\n                else \"\"\n            )\n            delay_fragment = (\n",
          )
          replace_once(
              "sheet/run_config.py",
              "                f\"B{self._artifact_float(self.premat_gpu_memory_buffer_gb)}_\"\n                f\"S{self.premat_cuda_stream_priority[0].upper()}_\"\n",
              "                f\"B{self._artifact_float(self.premat_gpu_memory_buffer_gb)}_\"\n                f\"{allocator_fragment}\"\n                f\"S{self.premat_cuda_stream_priority[0].upper()}_\"\n",
          )
          replace_once(
              "sheet/run_config.py",
              "            premat_gpu_memory_buffer_gb=float(self.premat_gpu_memory_buffer_gb),\n            premat_cuda_stream_priority=self.premat_cuda_stream_priority,\n",
              "            premat_gpu_memory_buffer_gb=float(self.premat_gpu_memory_buffer_gb),\n            premat_allocator_aware_admission=self.premat_allocator_aware_admission,\n            premat_cuda_stream_priority=self.premat_cuda_stream_priority,\n",
          )

          # Persistent trainer/model identity.
          replace_once(
              "sheet/training_config.py",
              "    \"premat_gpu_memory_buffer_gb\",\n    \"premat_cuda_stream_priority\",\n",
              "    \"premat_gpu_memory_buffer_gb\",\n    \"premat_allocator_aware_admission\",\n    \"premat_cuda_stream_priority\",\n",
          )
          replace_once(
              "sheet/training_config.py",
              "    premat_gpu_memory_buffer_gb: float = 1.0\n    premat_cuda_stream_priority: str = \"normal\"\n",
              "    premat_gpu_memory_buffer_gb: float = 1.0\n    premat_allocator_aware_admission: str = \"disabled\"\n    premat_cuda_stream_priority: str = \"normal\"\n",
          )
          replace_once(
              "sheet/training_config.py",
              "            gpu_memory_buffer_gb=self.premat_gpu_memory_buffer_gb,\n            cuda_stream_priority=self.premat_cuda_stream_priority,\n",
              "            gpu_memory_buffer_gb=self.premat_gpu_memory_buffer_gb,\n            allocator_aware_admission=self.premat_allocator_aware_admission,\n            cuda_stream_priority=self.premat_cuda_stream_priority,\n",
          )
          replace_once(
              "sheet/training_config.py",
              "                    \"premat_gpu_memory_buffer_gb\": float(self.premat_gpu_memory_buffer_gb),\n                    \"premat_cuda_stream_priority\": self.premat_cuda_stream_priority,\n",
              "                    \"premat_gpu_memory_buffer_gb\": float(self.premat_gpu_memory_buffer_gb),\n                    \"premat_allocator_aware_admission\": self.premat_allocator_aware_admission,\n                    \"premat_cuda_stream_priority\": self.premat_cuda_stream_priority,\n",
          )
          replace_once(
              "sheet/training_config.py",
              "                \"gpu_memory_buffer_gb\": float(self.premat_gpu_memory_buffer_gb),\n                \"cuda_stream_priority\": self.premat_cuda_stream_priority,\n",
              "                \"gpu_memory_buffer_gb\": float(self.premat_gpu_memory_buffer_gb),\n                \"allocator_aware_admission\": self.premat_allocator_aware_admission,\n                \"cuda_stream_priority\": self.premat_cuda_stream_priority,\n",
          )

          # CLI and run-config construction. No getattr-based argument fallback.
          replace_once(
              "run_thog2_owt_core.py",
              "    parser.add_argument(\"--premat_gpu_memory_buffer_gb\", type=float, default=1.0)\n    parser.add_argument(\"--premat_cuda_stream_priority\", choices=(\"normal\", \"high\"), default=\"normal\")\n",
              "    parser.add_argument(\"--premat_gpu_memory_buffer_gb\", type=float, default=1.0)\n    parser.add_argument(\"--premat_allocator_aware_admission\", choices=(\"disabled\", \"cautious\", \"normal\", \"aggressive\"), default=\"disabled\")\n    parser.add_argument(\"--premat_cuda_stream_priority\", choices=(\"normal\", \"high\"), default=\"normal\")\n",
          )
          replace_once(
              "run_thog2_owt_core.py",
              "        premat_gpu_memory_buffer_gb=arguments.premat_gpu_memory_buffer_gb,\n        premat_cuda_stream_priority=arguments.premat_cuda_stream_priority,\n",
              "        premat_gpu_memory_buffer_gb=arguments.premat_gpu_memory_buffer_gb,\n        premat_allocator_aware_admission=arguments.premat_allocator_aware_admission,\n        premat_cuda_stream_priority=arguments.premat_cuda_stream_priority,\n",
          )

          test_path = Path("tests/test_premat_allocator_aware_admission.py")
          if test_path.exists():
              raise RuntimeError(f"refusing to overwrite existing {test_path}")
          test_path.write_text('''from __future__ import annotations\n\nimport pytest\nimport torch\n\nfrom sheet.premat import (\n    CandidateEnvelope,\n    PrematMemoryObservation,\n    PrematRuntime,\n    _decide_candidate_admission_with_physical_growth,\n    _largest_same_stream_inactive_block_bytes,\n    decide_candidate_admission,\n    validate_premat_configuration,\n)\n\n\ndef _validation_kwargs(mode: str) -> dict[str, object]:\n    return {\n        "premat": "enabled",\n        "attention_mode": "fused",\n        "stay_below_current_peak": False,\n        "stay_within_global_buffer": True,\n        "gpu_memory_buffer_gb": 0.25,\n        "allocator_aware_admission": mode,\n        "target_layer": 1,\n        "weight_matrix_target_order": "r_to_l",\n        "cuda_stream_priority": "normal",\n        "diagnostic_layer_delay_ms": 0.0,\n        "logging": "disabled",\n        "instra": "disabled",\n    }\n\n\ndef _blocked_case() -> tuple[PrematMemoryObservation, CandidateEnvelope]:\n    observation = PrematMemoryObservation(\n        process_allocated_bytes=500,\n        process_reserved_bytes=800,\n        process_ordinary_peak_bytes=1000,\n        device_free_bytes=130,\n        device_total_bytes=1000,\n    )\n    envelope = CandidateEnvelope(\n        retained_bytes=8,\n        materialisation_peak_bytes=8,\n        foreground_overlap_bytes=128,\n    )\n    return observation, envelope\n\n\ndef test_largest_same_stream_inactive_block_ignores_other_states_and_streams() -> None:\n    snapshot = [\n        {\n            "stream": 11,\n            "blocks": [\n                {"state": "inactive", "size": 8},\n                {"state": "inactive", "size": 16},\n                {"state": "active_allocated", "size": 100},\n                {"state": "active_awaiting_free", "size": 200},\n            ],\n        },\n        {"stream": 12, "blocks": [{"state": "inactive", "size": 300}]},\n    ]\n    assert _largest_same_stream_inactive_block_bytes(snapshot, stream_id=11) == 16\n\n\ndef test_allocator_credit_changes_only_physical_growth_not_process_envelope() -> None:\n    observation, envelope = _blocked_case()\n    original = decide_candidate_admission(\n        observation=observation,\n        envelope=envelope,\n        stay_below_current_peak=False,\n        gpu_memory_buffer_bytes=0,\n    )\n    revised = _decide_candidate_admission_with_physical_growth(\n        observation=observation,\n        envelope=envelope,\n        stay_below_current_peak=False,\n        gpu_memory_buffer_bytes=0,\n        physical_growth_bytes=envelope.foreground_overlap_bytes,\n    )\n    assert original.admitted is False\n    assert original.reason == "global_device_buffer"\n    assert original.predicted_physical_growth_bytes == 136\n    assert revised.admitted is True\n    assert revised.predicted_physical_growth_bytes == 128\n    assert revised.predicted_process_bytes == original.predicted_process_bytes == 636\n\n\ndef test_allocator_aware_mode_validation() -> None:\n    validate_premat_configuration(**_validation_kwargs("disabled"))\n    validate_premat_configuration(**_validation_kwargs("cautious"))\n    for mode in ("normal", "aggressive"):\n        with pytest.raises(ValueError, match="not implemented yet"):\n            validate_premat_configuration(**_validation_kwargs(mode))\n\n\ndef test_cautious_rescue_uses_one_same_stream_inactive_block(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = decide_candidate_admission(\n        observation=observation,\n        envelope=envelope,\n        stay_below_current_peak=False,\n        gpu_memory_buffer_bytes=0,\n    )\n    runtime = PrematRuntime(\n        materialize=lambda _family, _layer: torch.empty(1),\n        n_embd=8,\n        n_head=1,\n        attention_mode="fused",\n        stay_below_current_peak=False,\n        gpu_memory_buffer_gb=0.0,\n        allocator_aware_admission="cautious",\n        target_layer=1,\n        weight_matrix_target_order="r_to_l",\n        cuda_stream_priority="normal",\n        diagnostic_layer_delay_ms=0.0,\n        logging_enabled=False,\n    )\n\n    class FakeStream:\n        cuda_stream = 11\n\n    runtime._stream = FakeStream()\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n    monkeypatch.setattr(\n        torch.cuda,\n        "memory_snapshot",\n        lambda: [\n            {"stream": 11, "blocks": [{"state": "inactive", "size": 8}]},\n            {"stream": 12, "blocks": [{"state": "inactive", "size": 1000}]},\n        ],\n    )\n    revised, detail = runtime._cautious_allocator_aware_rescue(\n        observation=observation,\n        envelope=envelope,\n        original_decision=original,\n    )\n    assert revised.admitted is True\n    assert detail["reuse_qualified"] is True\n    assert detail["largest_eligible_inactive_block_bytes"] == 8\n    assert detail["allocator_credit_bytes"] == 8\n    assert detail["revised_predicted_physical_growth_bytes"] == 128\n\n\ndef test_cautious_rescue_fails_closed_on_snapshot_error(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = decide_candidate_admission(\n        observation=observation,\n        envelope=envelope,\n        stay_below_current_peak=False,\n        gpu_memory_buffer_bytes=0,\n    )\n    runtime = PrematRuntime(\n        materialize=lambda _family, _layer: torch.empty(1),\n        n_embd=8,\n        n_head=1,\n        attention_mode="fused",\n        stay_below_current_peak=False,\n        gpu_memory_buffer_gb=0.0,\n        allocator_aware_admission="cautious",\n        target_layer=1,\n        weight_matrix_target_order="r_to_l",\n        cuda_stream_priority="normal",\n        diagnostic_layer_delay_ms=0.0,\n        logging_enabled=False,\n    )\n\n    class FakeStream:\n        cuda_stream = 11\n\n    runtime._stream = FakeStream()\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n\n    def fail_snapshot():\n        raise RuntimeError("snapshot failed")\n\n    monkeypatch.setattr(torch.cuda, "memory_snapshot", fail_snapshot)\n    revised, detail = runtime._cautious_allocator_aware_rescue(\n        observation=observation,\n        envelope=envelope,\n        original_decision=original,\n    )\n    assert revised == original\n    assert detail["reuse_qualified"] is False\n    assert "RuntimeError: snapshot failed" in str(detail["snapshot_error"])\n''')
          PY
      - name: Syntax and whitespace checks
        shell: bash
        run: |
          python -m compileall -q sheet run_thog2_owt_core.py tests/test_premat_allocator_aware_admission.py
          git diff --check
      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/premat_allocator_aware_patch.yml
          git add sheet/premat.py sheet/model.py sheet/run_config.py sheet/training_config.py run_thog2_owt_core.py tests/test_premat_allocator_aware_admission.py
          git commit -m "Wire cautious allocator-aware Premat admission"
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
