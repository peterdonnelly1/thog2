name: Apply PLASTIC CLI console refinements

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - tools/apply_registered_runner_help.py
      - tools/apply_plastic_core_canonicalisation_final.py
      - tools/apply_plastic_final_cleanup.py
      - .github/workflows/apply_plastic_cli_console_refinements.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply_refinements:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply final refinements
        run: |
          python tools/apply_registered_runner_help.py
          python tools/apply_plastic_core_canonicalisation_final.py
          python tools/apply_plastic_final_cleanup.py

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Validate syntax and THOG markers
        run: |
          bash -n train_OWT.sh
          bash -n train_OWT_core.sh
          bash -n plastic_depth_lookahead_wrapper_options.sh
          python -m py_compile \
            run_thog2_owt_core.py \
            sheet/argparse_underscore_alias_patch.py \
            sheet/plastic_depth.py \
            sheet/plastic_depth_coarse.py \
            sheet/plastic_depth_coarse_runner.py \
            sheet/plastic_depth_lifecycle.py \
            sheet/plastic_depth_console_minor_patch.py \
            sheet/plastic_depth_coarse_runtime_recovery_patch.py \
            sheet/run_config.py \
            sheet/training_config.py \
            tools/apply_registered_runner_help.py \
            tools/apply_plastic_core_canonicalisation_final.py \
            tools/apply_plastic_final_cleanup.py \
            tests/test_plastic_cli_console_refinements.py
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('sheet/__init__.py'),
              Path('run_thog2_owt_core.py'),
              Path('sheet/run_config.py'),
              Path('sheet/training_config.py'),
              Path('sheet/plastic_depth_coarse.py'),
              Path('sheet/plastic_depth_coarse_runner.py'),
              Path('sheet/plastic_depth_lifecycle.py'),
              Path('sheet/plastic_depth_console_minor_patch.py'),
              Path('sheet/plastic_depth_coarse_runtime_recovery_patch.py'),
          ]
          bad = []
          for path in paths:
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if '# <<< THOG' in line and line.index('# <<< THOG') + 1 != 156:
                      bad.append((str(path), number, line.index('# <<< THOG') + 1))
          if bad:
              raise SystemExit(f'inline THOG markers not at column 156: {bad}')
          PY

      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_plastic_cli_console_refinements.py \
            tests/test_plastic_depth_wrapper_options.py \
            tests/test_plastic_depth_coarse_config.py \
            tests/test_plastic_depth_coarse_trials.py \
            tests/test_plastic_depth_coarse_scoring.py \
            tests/test_plastic_depth_lifecycle.py \
            tests/test_plastic_depth_pause.py \
            tests/test_plastic_depth_console_minor_patch.py \
            tests/test_plastic_depth_coarse_runtime_recovery.py \
            tests/test_plastic_depth_coarse_real_lifecycle.py \
            tests/test_plastic_depth_startup_lookahead_ui.py \
            --deselect=tests/test_plastic_depth_console_minor_patch.py::PlasticDepthConsoleMinorPatchTests::test_final_alignment_runs_after_late_formatter_tabs

      - name: Verify canonical PLASTIC help
        run: |
          help_text="$(bash ./train_OWT.sh -h)"
          grep -q -- '--plastic__enabled' <<<"$help_text"
          grep -q -- '--plastic__phase_1_n_steps' <<<"$help_text"
          grep -q -- '--plastic__layer_count_probe_radius' <<<"$help_text"
          grep -q -- '--plastic__log_interval_coarse' <<<"$help_text"
          grep -q -- '--plastic__coarse_phase_roll_through' <<<"$help_text"
          grep -q -- '--max-nonfinite-update-skips' <<<"$help_text"
          if grep -q -- '--plastic-enabled' <<<"$help_text"; then
            echo 'legacy hyphenated PLASTIC option leaked into help' >&2
            exit 1
          fi

      - name: Commit refinements
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            train_OWT.sh \
            train_OWT_core.sh \
            plastic_depth_lookahead_wrapper_options.sh \
            run_thog2_owt_core.py \
            sheet/__init__.py \
            sheet/run_config.py \
            sheet/training_config.py \
            sheet/plastic_depth_coarse.py \
            sheet/plastic_depth_coarse_runner.py \
            sheet/plastic_depth_lifecycle.py \
            sheet/plastic_depth_console_minor_patch.py \
            sheet/plastic_depth_coarse_runtime_recovery_patch.py \
            tests/test_plastic_cli_console_refinements.py \
            tests/test_plastic_depth_lifecycle.py
          git commit -m 'Finish PLASTIC CLI console source audit'
          for attempt in 1 2 3; do
            git fetch origin PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
            if git rebase origin/PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION && git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1

# vvv THOG workflow source change intentionally triggers validated writeback
# ^^^ THOG
