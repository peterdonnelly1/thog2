name: Temporary Processing group overlap summary verification
on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
jobs:
  apply_and_verify:
    if: github.event.head_commit.message == 'Add temporary Processing group overlap verification'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Apply update
        run: python tmp_processing_group_overlap_summary_fix.py
      - name: Verify
        run: |
          python -m compileall -q tests/test_premat_processing.py
          node --check sheet/local_dashboard_assets/dashboard_processing.js
          node --check sheet/local_dashboard_assets/dashboard_premat.js
          git diff --check
          python -m pytest -q tests/test_premat_processing.py tests/test_premat.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sheet/local_dashboard_assets/index.html sheet/local_dashboard_assets/dashboard_processing.js sheet/local_dashboard_assets/dashboard_processing.css sheet/local_dashboard_assets/dashboard_premat.js tests/test_premat_processing.py THOG2_DYNAMIC_PREMATERIALISATION_LOG.md
          git commit -m 'Refine Processing group and overlap presentation'
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
