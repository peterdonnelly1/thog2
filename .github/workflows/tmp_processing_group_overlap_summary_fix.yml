name: Temporary Processing group overlap summary verification
on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
jobs:
  apply_and_verify:
    if: github.event.head_commit.message == 'Retry Processing group overlap verification'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Apply update
        run: |
          python tmp_processing_group_overlap_summary_fix.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_premat_processing.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_premat_matrix_selector_renders_non_targets_neutrally() -> None:\n    js = Path("sheet/local_dashboard_assets/dashboard_premat.js").read_text(encoding="utf-8")\n    css = Path("sheet/local_dashboard_assets/dashboard_premat.css").read_text(encoding="utf-8")\n    assert "function premat_target_family" in js\n    assert 'record.outcome = "NOT TARGETED"' in js\n    assert "if (record.targeted === false) continue;" in js\n    assert 'premat-not-targeted' in js\n    assert '.premat-stage.premat-not-targeted' in css\n'''
          new = '''def test_premat_matrix_selector_renders_non_targets_as_main_without_counting_misses() -> None:\n    js = Path("sheet/local_dashboard_assets/dashboard_premat.js").read_text(encoding="utf-8")\n    css = Path("sheet/local_dashboard_assets/dashboard_premat.css").read_text(encoding="utf-8")\n    assert "function premat_target_family" in js\n    assert 'record.outcome = targeted ? "COMPLETE MISS" : "NOT TARGETED"' in js\n    assert 'record.path = targeted ? "main" : "not-targeted-main"' in js\n    assert "if (record.targeted === false) continue;" not in js\n    assert 'premat-not-targeted' in js\n    assert '.premat-stage.premat-not-targeted' in css\n'''
          if text.count(old) != 1:
              raise RuntimeError(f'expected one stale selector test block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify
        run: |
          python -m compileall -q tests/test_premat_processing.py
          node --check sheet/local_dashboard_assets/dashboard_processing.js
          node --check sheet/local_dashboard_assets/dashboard_premat.js
          git diff --check
          python -m pytest -q tests/test_premat_processing.py tests/test_premat.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sheet/local_dashboard_assets/index.html sheet/local_dashboard_assets/dashboard_processing.js sheet/local_dashboard_assets/dashboard_processing.css sheet/local_dashboard_assets/dashboard_premat.js tests/test_premat_processing.py THOG2_DYNAMIC_PREMATERIALISATION_LOG.md
          git commit -m 'Refine Processing group and overlap presentation'
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
