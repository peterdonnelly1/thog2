name: Apply v0.541 wall-time wrapper fix

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/apply_v0541_wall_time_wrapper_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact wrapper plumbing fix
        run: python tools/apply_v0541_wall_time_wrapper_plumbing.py

      - name: Validate shell syntax
        run: |
          bash -n train_OWT_core.sh
          bash -n train_OWT.sh

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Run focused wrapper tests
        run: python -m pytest -q tests/test_plastic_v0541_wall_time_wrapper_cli.py

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add train_OWT_core.sh tests/test_plastic_v0541_wall_time_wrapper_cli.py
          git diff --cached --check
          git commit -m "Fix v0.541 wall-time wrapper plumbing"
          git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

