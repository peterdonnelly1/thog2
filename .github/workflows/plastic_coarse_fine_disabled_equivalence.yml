name: Validate PLASTIC disabled equivalence

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_disabled_equivalence.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: read

jobs:
  disabled_equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          path: current

      - uses: actions/checkout@v4
        with:
          ref: 311decd512829b94116df19815e463e544cdf23a
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy

      - name: Verify valid shared fingerprint fixture
        run: |
          grep -q 'depth_order=2' current/tools/plastic_disabled_fingerprint.py
          grep -q 'n_embd=32' current/tools/plastic_disabled_fingerprint.py
          grep -q 'redirect_stdout' current/tools/plastic_disabled_fingerprint.py

      - name: Apply pending disabled-compatibility source locally
        working-directory: current
        run: |
          python tools/apply_plastic_audit_overlay.py
          if grep -q 'self.state.plastic_depth_count_audit.append' sheet/plastic_depth_audit_patch.py; then
            python tools/apply_plastic_disabled_checkpoint_compat.py
          fi

      - name: Capture base fingerprint
        working-directory: base
        run: |
          PYTHONPATH=. python ../current/tools/plastic_disabled_fingerprint.py \
            > ../base_fingerprint.json

      - name: Capture current fingerprint
        working-directory: current
        run: |
          PYTHONPATH=. python tools/plastic_disabled_fingerprint.py \
            > ../current_fingerprint.json

      - name: Require exact equivalence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path("base_fingerprint.json").read_text())
          current = json.loads(Path("current_fingerprint.json").read_text())
          if base != current:
              base_keys = set(base)
              current_keys = set(current)
              print("top-level key delta", sorted(base_keys ^ current_keys))
              for key in sorted(base_keys & current_keys):
                  if base[key] != current[key]:
                      print("first differing section:", key)
                      print("base:", json.dumps(base[key], indent=2, sort_keys=True)[:8000])
                      print("current:", json.dumps(current[key], indent=2, sort_keys=True)[:8000])
                      break
              raise SystemExit("PLASTIC-disabled execution drifted from base 311decd")
          forbidden = {
              "plastic_coarse_fine_state",
              "plastic_depth_count_audit",
          }
          assert forbidden.isdisjoint(current["checkpoint_keys"])
          print("PLASTIC-disabled fingerprint is exactly unchanged")
          PY
