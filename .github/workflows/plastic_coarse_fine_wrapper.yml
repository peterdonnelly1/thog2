name: Apply PLASTIC COARSE FINE wrapper

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_wrapper.yml

permissions:
  contents: write

jobs:
  apply_wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply wrapper integration when absent
        run: |
          if ! grep -q 'thog2_normalize_long_option' train_OWT.sh; then
            python tools/apply_plastic_coarse_fine_wrapper.py
          fi

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Validate shell syntax
        run: |
          bash -n train_OWT.sh
          bash -n plastic_depth_lookahead_wrapper_options.sh

      - name: Run wrapper and startup tests
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_wrapper_options.py \
            tests/test_train_owt_public_wrapper.py \
            tests/test_run_thog2_owt_startup_report.py

      - name: Commit wrapper integration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add train_OWT.sh
          git commit -m 'Expose canonical PLASTIC COARSE FINE wrapper controls'
          git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
