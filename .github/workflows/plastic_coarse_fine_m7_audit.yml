name: Apply PLASTIC COARSE FINE M7 audit

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_m7_audit.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: write

jobs:
  apply_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install final audit overlay
        run: python tools/apply_plastic_audit_overlay.py

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Compile audit modules
        run: |
          python -m py_compile \
            sheet/plastic_depth_audit_patch.py \
            sheet/trainer_state.py \
            sheet/__init__.py

      - name: Run audit, full-radius and checkpoint tests
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_audit.py \
            tests/test_plastic_depth_full_radius.py \
            tests/test_plastic_depth_transition_control_plane.py \
            tests/test_plastic_depth_lifecycle_checkpoint.py

      - name: Commit audit overlay integration
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sheet/__init__.py
          git commit -m 'Integrate replayable PLASTIC FINE decision audit'
          git fetch origin PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git rebase origin/PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
