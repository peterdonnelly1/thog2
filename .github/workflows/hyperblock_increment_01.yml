name: Apply HYPERBLOCK checkpoint 01

on:
  push:
    branches:
      - COUPLED_FIELD_MACHINE_HYPERBLOCk

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: COUPLED_FIELD_MACHINE_HYPERBLOCk

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          base64 -d .github/hyperblock_increment_01.txt | gzip -d > /tmp/hyperblock_increment_01.patch
          echo 'c1152dd43b4798187d9d93bd3d63bee0113c559d2fdda3bc545a64164ab8de09  /tmp/hyperblock_increment_01.patch' | sha256sum --check

      - name: Apply and remove transport
        shell: bash
        run: |
          git apply --index /tmp/hyperblock_increment_01.patch
          git rm .github/hyperblock_increment_01.txt
          git rm .github/workflows/hyperblock_increment_01.yml

      - name: Commit checkpoint
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Advance coupled field machine HYPERBLOCK'
          git push origin HEAD:COUPLED_FIELD_MACHINE_HYPERBLOCk
