name: Temporary PREMAT logging-disabled wait fix

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/premat_logging_disabled_wait_fix.yml
      - tmp_premat_logging_disabled_wait_fix.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python tmp_premat_logging_disabled_wait_fix.py
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib plotly
      - name: Run focused verification
        run: |
          python -m compileall -q sheet tests/test_premat.py
          git diff --check
          python -m pytest -q tests/test_premat.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet/premat.py tests/test_premat.py
          git commit -m "Allow PREMAT timing with logging disabled"
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
