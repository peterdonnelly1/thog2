name: Apply PLASTIC COARSE FINE M8 checkpoint

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_m8_checkpoint.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: write

jobs:
  apply_checkpoint_resume:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply distributed pause integration
        run: |
          if grep -q 'def _distributed_pause' sheet/plastic_depth_lifecycle.py; then
            python tools/apply_plastic_distributed_pause.py
          fi

      - name: Apply checkpoint restore integration
        run: |
          if ! grep -q 'trainer.plastic_coarse_fine_state = payload.get' sheet/trainer_checkpoint_resume.py; then
            python tools/apply_plastic_coarse_fine_checkpoint_resume.py
          fi

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Compile lifecycle checkpoint modules
        run: |
          python -m py_compile \
            sheet/plastic_depth_pause.py \
            sheet/plastic_depth_lifecycle.py \
            sheet/plastic_depth_resume.py \
            sheet/trainer_checkpoint_save.py \
            sheet/trainer_checkpoint_resume.py

      - name: Run lifecycle checkpoint and pause tests
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_pause.py \
            tests/test_plastic_depth_distributed_pause.py \
            tests/test_plastic_depth_lifecycle.py \
            tests/test_plastic_depth_resume.py \
            tests/test_plastic_depth_lifecycle_checkpoint.py

      - name: Commit checkpoint resume integration
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sheet/plastic_depth_lifecycle.py \
            sheet/trainer_checkpoint_resume.py
          git commit -m 'Integrate PLASTIC lifecycle checkpoint resume'
          git fetch origin PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git rebase origin/PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
