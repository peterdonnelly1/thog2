name: Validate PLASTIC COARSE FINE M3 components

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_m3_components.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: read

jobs:
  validate_coarse_components:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Compile COARSE components
        run: |
          python -m py_compile \
            sheet/plastic_depth_coarse.py \
            sheet/plastic_depth_coarse_runner.py \
            sheet/plastic_depth_fresh_state.py

      - name: Run COARSE component tests
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_coarse_config.py \
            tests/test_plastic_depth_coarse_scoring.py \
            tests/test_plastic_depth_coarse_trials.py \
            tests/test_plastic_depth_fresh_state.py
