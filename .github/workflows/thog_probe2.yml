name: THOG Actions Probe 2
on:
  push:
    paths:
      - .github/workflows/thog_probe2.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write marker
        run: |
          git config user.name "thog-actions-probe"
          git config user.email "thog-actions-probe@users.noreply.github.com"
          printf 'probe ok\n' > .github/thog_actions_probe_ok.txt
          git add .github/thog_actions_probe_ok.txt
          git commit -m "Record THOG Actions probe"
          git push origin HEAD:master
