name: CPU materialisation regression
on:
  pull_request:
    paths:
      - 'sheet/**'
      - 'tests/**'
      - '*.py'
      - '*.sh'
      - 'instra_runner_catalogue.json'
      - '.github/workflows/cpu_materialisation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest pytest-subtests pytest-timeout psutil tiktoken tensorboard plotly
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax
        run: python -m compileall -q sheet tests run_thog2_owt_core.py
      - name: CPU arithmetic, checkpoint and lifecycle regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_cpu_materialisation*.py
