name: Validate PLASTIC COARSE FINE M1

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_m1.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: write

jobs:
  validate_m1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply canonical wrapper integration when absent
        run: |
          if ! grep -q 'thog2_normalize_long_option' train_OWT.sh; then
            python tools/apply_plastic_coarse_fine_wrapper.py
          fi

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Compile M1 Python
        run: |
          python -m py_compile \
            sheet/plastic_depth.py \
            sheet/plastic_depth_coarse.py \
            sheet/training_config.py \
            sheet/run_config.py \
            run_thog2_owt_core.py \
            run_thog2_owt.py \
            run_thog2_lifecycle.py

      - name: Validate shell syntax
        run: |
          bash -n train_OWT.sh
          bash -n plastic_depth_lookahead_wrapper_options.sh

      - name: Run M1 and affected PLASTIC tests
        shell: bash
        run: |
          shopt -s nullglob
          test_files=(tests/test_plastic_depth*.py)
          (( ${#test_files[@]} > 0 )) || { echo 'No PLASTIC test files found' >&2; exit 2; }
          python -m pytest -q \
            --deselect=tests/test_plastic_depth_console_minor_patch.py::PlasticDepthConsoleMinorPatchTests::test_final_alignment_runs_after_late_formatter_tabs \
            "${test_files[@]}"
          python -m pytest -q \
            tests/test_train_owt_public_wrapper.py \
            tests/test_run_thog2_owt_startup_report.py

      - name: Commit canonical wrapper integration
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add train_OWT.sh
          git commit -m 'Expose canonical PLASTIC COARSE FINE wrapper controls'
          git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
