name: Validate PLASTIC COARSE FINE M1

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_m1.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: write

jobs:
  validate_m1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply canonical wrapper integration when absent
        run: |
          if ! grep -q 'reject non-canonical PLASTIC aliases before any wrapper parses them' train_OWT.sh; then
            python tools/apply_plastic_coarse_fine_wrapper.py
          fi

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Compile M1 Python
        run: |
          python -m py_compile \
            sheet/plastic_depth.py \
            sheet/plastic_depth_coarse.py \
            sheet/training_config.py \
            sheet/run_config.py \
            run_thog2_owt_core.py \
            run_thog2_owt.py \
            run_thog2_lifecycle.py

      - name: Validate shell syntax
        run: |
          bash -n train_OWT.sh
          bash -n train_OWT_core.sh
          bash -n plastic_depth_lookahead_wrapper_options.sh

      - name: Run M1 configuration, startup and wrapper tests
        run: |
          python -m pytest -q \
            tests/test_plastic_depth.py \
            tests/test_plastic_depth_coarse_config.py \
            tests/test_plastic_depth_coarse_scoring.py \
            tests/test_plastic_depth_console_minor_patch.py \
            tests/test_plastic_depth_controller_stability.py \
            tests/test_plastic_depth_probe_delta_console.py \
            tests/test_plastic_depth_startup_lookahead_ui.py \
            tests/test_plastic_depth_transition_control_plane.py \
            tests/test_plastic_depth_wrapper_options.py \
            tests/test_plastic_cli_console_refinements.py \
            --deselect=tests/test_plastic_depth_console_minor_patch.py::PlasticDepthConsoleMinorPatchTests::test_final_alignment_runs_after_late_formatter_tabs

      - name: Commit canonical wrapper integration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add train_OWT.sh
          git commit -m 'Expose canonical PLASTIC COARSE FINE wrapper controls'
          git fetch origin PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git rebase origin/PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
          git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
