name: Apply PLASTIC COARSE FINE M1

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_m1.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: write

jobs:
  apply_m1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair M1 transformation anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_plastic_coarse_fine_m1.py')
          text = path.read_text(encoding='utf-8')
          old = """    replace_once(
                  path,
                  '    \"plastic__layer_count_update_brake\",\\n',
                  '    \"plastic__layer_count_update_brake\",\\n'
                  '    \"plastic__layer_count_probe_interval\",\\n'
                  '    \"plastic__layer_count_probe_radius\",\\n'
                  '    \"plastic__layer_count_max_step\",\\n',
              )
          """
          new = """    replace_once(
                  path,
                  '    \"plastic__layer_count_update_brake\",\\n'
                  '    \"plastic__layer_count_probe_noise_window\",\\n',
                  '    \"plastic__layer_count_update_brake\",\\n'
                  '    \"plastic__layer_count_probe_interval\",\\n'
                  '    \"plastic__layer_count_probe_radius\",\\n'
                  '    \"plastic__layer_count_max_step\",\\n'
                  '    \"plastic__layer_count_probe_noise_window\",\\n',
              )
          """
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif '"plastic__layer_count_probe_interval"' not in text:
              raise SystemExit('M1 anchor repair target not found')
          PY

      - name: Apply M1 source integration when absent
        run: |
          if ! grep -q 'plastic__coarse_phase: str = "disabled"' sheet/training_config.py; then
            python tools/apply_plastic_coarse_fine_m1.py
          fi

      - name: Apply compatibility repairs
        run: python tools/apply_plastic_coarse_fine_m1_repairs.py

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Compile changed Python
        run: |
          python -m py_compile \
            sheet/plastic_depth.py \
            sheet/plastic_depth_coarse.py \
            sheet/training_config.py \
            sheet/run_config.py \
            run_thog2_owt_core.py \
            run_thog2_owt.py \
            run_thog2_lifecycle.py

      - name: Run M1 and affected PLASTIC tests
        shell: bash
        run: |
          shopt -s nullglob
          test_files=(tests/test_plastic_depth*.py)
          (( ${#test_files[@]} > 0 )) || { echo 'No PLASTIC test files found' >&2; exit 2; }
          python -m pytest -q \
            --deselect=tests/test_plastic_depth_console_minor_patch.py::PlasticDepthConsoleMinorPatchTests::test_final_alignment_runs_after_late_formatter_tabs \
            "${test_files[@]}"

      - name: Commit M1 when source changed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/apply_plastic_coarse_fine_m1.py \
            tools/apply_plastic_coarse_fine_m1_repairs.py \
            tests/test_plastic_depth_coarse_config.py \
            sheet/plastic_depth.py \
            sheet/plastic_depth_coarse.py \
            sheet/training_config.py \
            sheet/run_config.py \
            run_thog2_owt_core.py \
            run_thog2_owt.py \
            run_thog2_lifecycle.py
          git commit -m 'Implement PLASTIC COARSE FINE configuration surfaces'
          git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
