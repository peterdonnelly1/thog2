name: Apply PLASTIC COARSE FINE M2

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_m2.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: write

jobs:
  apply_m2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply M2 integration when absent
        run: |
          if ! grep -q 'plastic__runtime_phase: str = "fine"' sheet/training_config.py; then
            python tools/apply_plastic_coarse_fine_m2.py
          fi

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Compile M2 Python
        run: |
          python -m py_compile \
            sheet/plastic_depth_fresh_state.py \
            sheet/training_config.py \
            run_thog2_lifecycle.py

      - name: Run deterministic factory and affected tests
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_fresh_state.py \
            tests/test_plastic_depth_coarse_config.py \
            tests/test_plastic_depth.py \
            tests/test_run_thog2_owt_startup_report.py

      - name: Commit M2 integration
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sheet/training_config.py run_thog2_lifecycle.py
          git commit -m 'Integrate deterministic PLASTIC fresh-state factory'
          git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
