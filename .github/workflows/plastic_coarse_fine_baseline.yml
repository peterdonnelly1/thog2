name: PLASTIC COARSE FINE baseline evidence

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_baseline.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: read

jobs:
  base_regression_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 311decd512829b94116df19815e463e544cdf23a

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy tiktoken tensorboard wandb psutil

      - name: Run untouched PLASTIC_DEPTH CPU suite
        id: base_suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests \
            --deselect=tests/test_plastic_depth_console_minor_patch.py::PlasticDepthConsoleMinorPatchTests::test_final_alignment_runs_after_late_formatter_tabs \
            2>&1 | tee base_regression.log

      - name: Print baseline failure nodes
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cache_path = Path('.pytest_cache/v/cache/lastfailed')
          failed = (
              json.loads(cache_path.read_text(encoding='utf-8'))
              if cache_path.exists()
              else {}
          )
          print('BASE_PYTEST_LASTFAILED_BEGIN')
          for node_id in sorted(failed):
              print(node_id)
          print('BASE_PYTEST_LASTFAILED_END')
          PY
          tail -n 250 base_regression.log || true

      - name: Retain complete baseline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plastic-depth-base-regression-log
          path: base_regression.log
          if-no-files-found: error

      - name: Record expected non-green base without hiding the evidence
        env:
          BASE_OUTCOME: ${{ steps.base_suite.outcome }}
        run: |
          echo "Untouched PLASTIC_DEPTH base outcome: $BASE_OUTCOME"
