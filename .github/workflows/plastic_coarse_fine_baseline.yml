name: PLASTIC COARSE FINE baseline evidence

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_baseline.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: read

jobs:
  base_console_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 311decd512829b94116df19815e463e544cdf23a

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Run exact base console-alignment test
        id: base_console
        continue-on-error: true
        run: |
          python -m pytest -q \
            tests/test_plastic_depth_console_minor_patch.py::PlasticDepthConsoleMinorPatchTests::test_final_alignment_runs_after_late_formatter_tabs

      - name: Classify base result
        shell: bash
        env:
          BASE_CONSOLE_OUTCOME: ${{ steps.base_console.outcome }}
        run: |
          echo "PLASTIC_DEPTH base 311decd console alignment outcome: $BASE_CONSOLE_OUTCOME"
          test "$BASE_CONSOLE_OUTCOME" = failure
