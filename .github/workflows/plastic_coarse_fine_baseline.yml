name: PLASTIC COARSE FINE baseline

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_baseline.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy

      - name: Run focused and affected baseline tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .coarse_fine_ci
          python -m pytest -q \
            tests/test_plastic_depth_console_minor_patch.py \
            tests/test_plastic_depth_controller_stability.py \
            tests/test_plastic_depth_probe_delta_console.py \
            tests/test_plastic_depth_startup_lookahead_ui.py \
            tests/test_plastic_depth_transition_control_plane.py \
            tests/test_plastic_depth_wrapper_options.py \
            tests/test_training_config.py \
            tests/test_checkpoints.py \
            tests/test_stage6_trainer.py \
            tests/test_run_thog2_owt.py \
            2>&1 | tee .coarse_fine_ci/baseline.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Record baseline evidence
        shell: bash
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        run: |
          mkdir -p docs
          {
            echo '# THOG2 PLASTIC COARSE/FINE Baseline Evidence'
            echo
            echo "- Commit tested: $(git rev-parse HEAD)"
            echo "- Branch: $(git branch --show-current)"
            echo "- Test exit code: ${TEST_EXIT_CODE:-missing}"
            echo "- Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '## Test output'
            echo
            echo '```text'
            cat .coarse_fine_ci/baseline.log
            echo '```'
          } > docs/THOG2_COARSE_FINE_BASELINE_STATUS.md

      - name: Commit baseline evidence
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/THOG2_COARSE_FINE_BASELINE_STATUS.md
          git commit -m 'Record COARSE/FINE baseline test evidence'
          git push origin HEAD:PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION

      - name: Enforce baseline result on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        run: exit "${TEST_EXIT_CODE:-1}"
