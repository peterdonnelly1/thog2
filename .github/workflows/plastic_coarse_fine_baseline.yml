name: PLASTIC COARSE FINE baseline evidence

on:
  push:
    branches:
      - PLASTIC_DEPTH_COARSE_FINE_IMPLEMENTATION
    paths:
      - .github/workflows/plastic_coarse_fine_baseline.yml
  pull_request:
    branches:
      - PLASTIC_DEPTH

permissions:
  contents: read

jobs:
  base_failure_delta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 311decd512829b94116df19815e463e544cdf23a

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy tiktoken tensorboard wandb psutil

      - name: Materialize current failure-node list
        run: |
          cat > current_failure_nodes.txt <<'EOF'
          tests/test_console_model_summary.py::test_model_summary_aligns_optimizer_and_reports_cosine_decay
          tests/test_console_progress_layout.py::ConsoleProgressLayoutTests::test_current_layer_count_is_appended_only_when_plastic_is_enabled
          tests/test_console_progress_layout.py::ConsoleProgressLayoutTests::test_sampled_values_are_emitted_once_after_a_plastic_transition
          tests/test_console_progress_layout.py::ConsoleProgressLayoutTests::test_semantic_qkv_bypass_is_suppressed_only_for_depth_reporting
          tests/test_console_progress_layout.py::ConsoleProgressLayoutTests::test_validation_reuses_latest_step_mean_and_uses_two_level_yellow_emphasis
          tests/test_console_progress_pretty_rows.py::test_training_console_row_uses_hh_mm_ss_after_step_one_and_colors_negative_delta_bright_green
          tests/test_console_progress_pretty_rows.py::test_step_one_console_row_keeps_elapsed_seconds
          tests/test_console_progress_pretty_rows.py::test_validation_console_row_uses_bold_explicit_rgb_yellow_for_validation_loss
          tests/test_direct_thog_mlp_application.py::test_training_wrappers_expose_default_on_direct_factorised_mlp_without_getopts_letter
          tests/test_geometry_registry_phase1.py::GeometryRegistryPhase1Tests::test_registry_console_report_is_complete_and_explicit
          tests/test_jpeg_like_v1_wrappers.py::JpegLikeV1WrapperTests::test_registry_comment_and_help_expose_new_contract
          tests/test_jpeg_like_v1_wrappers.py::JpegLikeV1WrapperTests::test_scruffy_dry_run_propagates_geometry_compressor_group_and_y
          tests/test_karitane_restart_launcher.py::KaritaneRestartLauncherTests::test_launcher_has_valid_shell_syntax_and_calls_dedicated_resume_module
          tests/test_modified_fast_discard_false.py::test_stage4_update_is_equivalent_and_releases_materializations
          tests/test_optimizer_wrapper.py::OptimizerWrapperTests::test_existing_run_scruffy_scripts_remain_present
          tests/test_optimizer_wrapper.py::OptimizerWrapperTests::test_full_wrappers_retain_body_and_native_optimizer_help
          tests/test_optimizer_wrapper.py::OptimizerWrapperTests::test_help_contains_old_and_new_controls
          tests/test_optimizer_wrapper.py::OptimizerWrapperTests::test_long_optimizer_controls_and_explicit_lr_override
          tests/test_optimizer_wrapper.py::OptimizerWrapperTests::test_short_optimizer_control_uses_optimizer_defaults
          tests/test_picton_cli_wrapper_contract.py::test_picton_canonical_host_wrappers_share_the_same_getopts_letters_and_long_options
          tests/test_picton_cli_wrapper_contract.py::test_picton_all_known_shell_wrappers_are_syntactically_valid
          tests/test_picton_wrapper_defaults_and_nonfinite_policy.py::test_current_training_wrappers_default_to_fast_discard_eval_100_and_checkpoint_1000
          tests/test_plastic_depth_cuda.py::test_successful_reserve_is_released_by_update_cleanup
          tests/test_run_thog2_owt_startup_report.py::test_startup_report_restores_full_rows_and_plastic_section
          tests/test_sheet_stage3_compatibility.py::Stage3CompatibilityTests::test_s3_09_incompatible_checkpoint_rejection
          tests/test_sheet_stage6_runner_scripts.py::RunnerScriptTests::test_s6_33_dense_runner_resolves_canonical_identity_and_shared_defaults
          tests/test_sheet_stage6_runner_scripts.py::RunnerScriptTests::test_s6_34_depth_runner_ignores_non_depth_orders_by_default
          tests/test_stage6_plastic_depth_progress.py::test_plastic_probe_losses_score_z_sample_layer_and_samples_are_ordered
          tests/test_stage6_plastic_depth_progress.py::test_huge_score_z_uses_fixed_width_scientific_not_row_blowout
          tests/test_stage6_plastic_depth_progress.py::test_optimizer_progress_omits_depth_samples_when_absent
          tests/test_stage6_plastic_depth_progress.py::test_optimizer_progress_omits_probe_losses_when_absent
          tests/test_stage6_plastic_depth_progress.py::test_optimizer_progress_omits_score_z_when_absent
          tests/test_stage6_plastic_depth_progress.py::test_missing_edge_probe_loss_and_score_z_use_dash_placeholders_and_green_only
          tests/test_stage8_mlp_channel_order_and_wrapper_loops.py::test_stage8_training_wrappers_use_final_preset_as_single_architecture_selector
          tests/test_stage8_mlp_channel_order_and_wrapper_loops.py::test_stage8_training_wrappers_share_the_six_order_letters
          tests/test_stage8_mlp_channel_order_and_wrapper_loops.py::test_stage8_training_wrappers_loop_dense_once_and_compact_presets_across_depth_orders
          tests/test_stage8_training_instrumentation_selector.py::test_stage8_training_wrappers_expose_one_unambiguous_instrumentation_selector
          tests/test_stage8_training_instrumentation_selector.py::test_stage8_training_wrappers_derive_consistent_wandb_flags_and_modes_from_instrumentation
          tests/test_stage8_wrapper_shell_syntax.py::test_stage8_training_wrappers_make_logging_backend_and_schedule_controls_explicit
          tests/test_stage8_wrapper_shell_syntax.py::test_stage8_training_wrappers_expose_all_six_semantic_order_controls
          tests/test_stage8_wrapper_shell_syntax.py::test_stage8_training_wrappers_auto_correct_dense_residual_source
          tests/test_stage8_wrappers_and_run_config.py::test_stage8_run_config_records_dct_full_block_identity_in_manifest_and_artifact_name
          tests/test_stage8_wrappers_and_run_config.py::test_stage8_semantic_order_defaults_are_recorded_in_manifest_identity_and_training_config
          tests/test_stage8_wrappers_and_run_config.py::test_stage8_semantic_order_overrides_are_recorded_in_manifest_artifact_identity_and_training_config
          tests/test_train_owt_public_wrapper.py::PublicTrainOwtWrapperTests::test_fresh_dry_run_preserves_master_cli_and_aligns_startup_values
          tests/test_vectorise_per_head_materialisation.py::test_training_wrappers_expose_default_on_vectorise_per_head_materialisation_without_getopts_letter
          tests/test_wrapper_learning_rate_and_batch_grids.py::test_run_config_artifact_contains_two_digit_learning_rate_code
          tests/test_wrapper_learning_rate_and_batch_grids.py::test_run_config_default_learning_rate_uses_lr_60_artifact_code
          tests/test_wrapper_learning_rate_and_batch_grids.py::test_wrappers_expose_lr_and_min_lr_codes_and_nest_lr_and_batch_grid_axes
          EOF
          sed -i 's/^          //' current_failure_nodes.txt

      - name: Run current failure nodes on untouched PLASTIC_DEPTH
        id: base_delta
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mapfile -t failure_nodes < current_failure_nodes.txt
          python -m pytest -q "${failure_nodes[@]}" 2>&1 | tee base_failure_delta.log

      - name: Print exact base failure set
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cache_path = Path('.pytest_cache/v/cache/lastfailed')
          failed = (
              json.loads(cache_path.read_text(encoding='utf-8'))
              if cache_path.exists()
              else {}
          )
          print('BASE_FAILURE_DELTA_BEGIN')
          for node_id in sorted(failed):
              print(node_id)
          print('BASE_FAILURE_DELTA_END')
          PY
          tail -n 250 base_failure_delta.log || true

      - name: Retain baseline delta log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plastic-depth-base-failure-delta-log
          path: base_failure_delta.log
          if-no-files-found: error

      - name: Record comparison outcome
        env:
          BASE_DELTA_OUTCOME: ${{ steps.base_delta.outcome }}
        run: |
          echo "Current failure nodes on untouched PLASTIC_DEPTH: $BASE_DELTA_OUTCOME"
