# vvv THOG
name: DEPTH weight curves and observational probes CI

on:
  push:
    branches:
      - depth_weight_curves_and_observational_probes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pytest psutil tensorboard tiktoken wandb matplotlib plotly
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile Python surface
        run: |
          set -euo pipefail
          python -m compileall -q sheet run_thog2_owt.py run_thog2_owt_core.py run_thog2_lifecycle.py tests

      - name: Run focused feature and affected regressions
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_depth_weight_curves_and_observational_probes.py \
            tests/test_plastic_depth_wandb_probe_curves.py \
            tests/test_plastic_depth_probe_sampling_v0521.py \
            tests/test_stage3_semantic_materialization.py \
            tests/test_stage4_depth_materialization.py \
            tests/test_depth_layer_norm_bias_modes.py \
            tests/test_console_progress_layout.py \
            tests/test_train_owt_public_wrapper.py

  broad-cpu:
    needs: focused-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pytest psutil tensorboard tiktoken wandb matplotlib plotly
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run repository-wide CPU regression
        env:
          PYTHONPATH: .
        run: pytest -q --ignore=tests/test_resume_and_fork_cpu_integration.py
