# vvv THOG
name: DEPTH weight curves and observational probes CI

on:
  push:
    branches:
      - depth_weight_curves_and_observational_probes
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  focused-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pytest psutil tensorboard tiktoken wandb matplotlib plotly
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile Python surface
        run: |
          set -euo pipefail
          python -m compileall -q sheet run_thog2_dashboard.py run_thog2_local_dashboard.py run_thog2_owt.py run_thog2_owt_core.py run_thog2_lifecycle.py tests
          for file in sheet/local_dashboard_assets/*.js; do node --check "$file"; done
          node tests/dashboard_v058_smoke.js
          node tests/instra_weight_coupling_regression.js
          node tests/instra_workspace_weight_overlay_regression.js
          node tests/instra_dashboard_performance_regression.js
          node tests/instra_weight_step_filter_regression.js
          node tests/instra_heatmap_performance_regression.js
          node tests/instra_weight_persistence_log_regression.js

      - name: Run focused feature and affected regressions
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_dense_weight_curves.py \
            tests/test_depth_weight_curves_and_observational_probes.py \
            tests/test_depth_weight_curves_v2.py \
            tests/test_depth_observational_probe_runtime.py \
            tests/test_depth_observational_probe_console.py \
            tests/test_delta_loss_v_layer_heatmap.py \
            tests/test_console_and_descriptor_help.py \
            tests/test_local_chart_dashboard.py \
            tests/test_instra_heatmap_window.py \
            tests/test_instra_weight_step_range.py \
            tests/test_plastic_depth_decision_algorithms_v057.py \
            tests/test_plastic_depth_v056_help.py \
            tests/test_plastic_depth_wrapper_options.py \
            tests/test_plastic_depth_wandb_probe_curves.py \
            tests/test_plastic_depth_probe_sampling_v0521.py \
            tests/test_stage3_semantic_materialization.py \
            tests/test_stage4_depth_materialization.py \
            tests/test_depth_layer_norm_bias_modes.py

      - name: Publish focused regression status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          description="Focused INSTRA/DEPTH regressions passed"
          if [ "$JOB_STATUS" != "success" ]; then
            state=failure
            description="Focused INSTRA/DEPTH regressions failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="thog2/depth-weight-focused" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  broad-cpu:
    needs: focused-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 0

      - name: Check out exact implementation base
        uses: actions/checkout@v4
        with:
          ref: chaos_bump_sampling
          path: base
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pytest psutil tensorboard tiktoken wandb matplotlib plotly
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compare repository CPU regressions against chaos_bump_sampling
        run: |
          set -euo pipefail
          python head/tests/hyperblock_regression_compare.py \
            --head head \
            --base base \
            --output depth-weight-regression-comparison.json \
            --timeout-seconds 240

      - name: Upload regression comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depth-weight-regression-${{ github.sha }}
          path: depth-weight-regression-comparison.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish broad regression status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          description="Broad CPU regression comparison passed"
          if [ "$JOB_STATUS" != "success" ]; then
            state=failure
            description="Broad CPU regression comparison failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="thog2/depth-weight-broad" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
