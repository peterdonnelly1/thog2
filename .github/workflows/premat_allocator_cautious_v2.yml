name: Temporary Premat cautious allocator-headroom v2

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/premat_allocator_cautious_v2.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply cautious allocator-headroom update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("sheet/premat.py")
          text = path.read_text()

          old_signature = '''def _largest_same_stream_inactive_block_bytes(\n    snapshot: Sequence[Mapping[str, object]],\n    *,\n    stream_id: int,\n    request_bytes: int,\n) -> int:\n'''
          new_signature = '''def _largest_same_stream_inactive_block_bytes(\n    snapshot: Sequence[Mapping[str, object]],\n    *,\n    device_index: int,\n    stream_id: int,\n    request_bytes: int,\n) -> int:\n'''
          if text.count(old_signature) != 1:
              raise RuntimeError("unexpected largest-block helper signature")
          text = text.replace(old_signature, new_signature, 1)

          old_segment_filter = '''        if not isinstance(segment, Mapping):\n            raise ValueError("CUDA allocator snapshot contains a non-mapping segment")\n        if int(segment.get("stream", -1)) != int(stream_id):\n            continue\n'''
          new_segment_filter = '''        if not isinstance(segment, Mapping):\n            raise ValueError("CUDA allocator snapshot contains a non-mapping segment")\n        segment_device = segment.get("device")\n        if isinstance(segment_device, bool) or not isinstance(segment_device, int):\n            raise ValueError("CUDA allocator snapshot contains an invalid device index")\n        if int(segment_device) != int(device_index):\n            continue\n        if int(segment.get("stream", -1)) != int(stream_id):\n            continue\n'''
          if text.count(old_segment_filter) != 1:
              raise RuntimeError("unexpected largest-block segment filter")
          text = text.replace(old_segment_filter, new_segment_filter, 1)

          marker = '''    return largest\n\n\n@dataclass\nclass _Candidate:\n'''
          helper = '''    return largest\n\n\ndef _total_inactive_allocator_bytes(\n    snapshot: Sequence[Mapping[str, object]],\n    *,\n    device_index: int,\n) -> int:\n    """Return allocator bytes that the native allocator explicitly marks inactive.\n\n    This is intentionally stronger evidence than ``reserved - allocated``:\n    active and active-awaiting-free blocks receive no cautious-mode credit, and\n    blocks belonging to another CUDA device are ignored.\n    """\n    total = 0\n    for segment in snapshot:\n        if not isinstance(segment, Mapping):\n            raise ValueError("CUDA allocator snapshot contains a non-mapping segment")\n        segment_device = segment.get("device")\n        if isinstance(segment_device, bool) or not isinstance(segment_device, int):\n            raise ValueError("CUDA allocator snapshot contains an invalid device index")\n        if int(segment_device) != int(device_index):\n            continue\n        blocks = segment.get("blocks")\n        if not isinstance(blocks, Sequence):\n            raise ValueError("CUDA allocator snapshot segment has no block sequence")\n        for block in blocks:\n            if not isinstance(block, Mapping):\n                raise ValueError("CUDA allocator snapshot contains a non-mapping block")\n            if block.get("state") != "inactive":\n                continue\n            size = block.get("size")\n            if isinstance(size, bool) or not isinstance(size, int) or size < 0:\n                raise ValueError("CUDA allocator snapshot contains an invalid block size")\n            total += int(size)\n    return total\n\n\n@dataclass\nclass _Candidate:\n'''
          if text.count(marker) != 1:
              raise RuntimeError("unexpected candidate marker")
          text = text.replace(marker, helper, 1)

          start_marker = "    def _cautious_allocator_aware_rescue(\n"
          end_marker = "\n    def _advance(self, *, trigger: str) -> None:\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise RuntimeError("unexpected cautious rescue method markers")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          new_method = '''    def _cautious_allocator_aware_rescue(\n        self,\n        *,\n        observation: PrematMemoryObservation,\n        envelope: CandidateEnvelope,\n        original_decision: AdmissionDecision,\n    ) -> Tuple[AdmissionDecision, Dict[str, object]]:\n        detail: Dict[str, object] = {\n            "mode": "cautious",\n            "attempted": True,\n            "original_admitted": original_decision.admitted,\n            "original_reason": original_decision.reason,\n            "original_predicted_physical_growth_bytes": (\n                original_decision.predicted_physical_growth_bytes\n            ),\n            "predicted_envelope_bytes": envelope.process_envelope_bytes,\n            "premat_materialisation_peak_bytes": envelope.materialisation_peak_bytes,\n            "foreground_overlap_bytes": envelope.foreground_overlap_bytes,\n            "device_index": None,\n            "premat_stream_id": None,\n            "largest_eligible_inactive_block_bytes": 0,\n            "reuse_qualified": False,\n            "inactive_allocator_bytes": 0,\n            "required_allocator_headroom_credit_bytes": 0,\n            "allocator_headroom_credit_bytes": 0,\n            "allocator_credit_bytes": 0,\n            "effective_device_free_bytes": observation.device_free_bytes,\n            "revised_predicted_physical_growth_bytes": (\n                original_decision.predicted_physical_growth_bytes\n            ),\n            "final_admitted": original_decision.admitted,\n            "final_reason": original_decision.reason,\n            "snapshot_error": None,\n        }\n        if self._stream is None or self._device is None:\n            detail["snapshot_error"] = "Premat Stream or CUDA device is not initialized"\n            return original_decision, detail\n\n        device_index = self._device.index\n        if device_index is None:\n            device_index = int(torch.cuda.current_device())\n        stream_id = int(self._stream.cuda_stream)\n        detail["device_index"] = int(device_index)\n        detail["premat_stream_id"] = stream_id\n        try:\n            allocator_backend = torch.cuda.memory.get_allocator_backend()\n            detail["allocator_backend"] = allocator_backend\n            if allocator_backend != "native":\n                detail["snapshot_error"] = (\n                    "cautious allocator-aware admission requires the native CUDA allocator"\n                )\n                return original_decision, detail\n            snapshot = torch.cuda.memory_snapshot()\n            largest_inactive_block = _largest_same_stream_inactive_block_bytes(\n                snapshot,\n                device_index=int(device_index),\n                stream_id=stream_id,\n                request_bytes=envelope.materialisation_peak_bytes,\n            )\n            inactive_allocator_bytes = _total_inactive_allocator_bytes(\n                snapshot,\n                device_index=int(device_index),\n            )\n        except Exception as error:\n            detail["snapshot_error"] = f"{type(error).__name__}: {error}"\n            return original_decision, detail\n\n        detail["largest_eligible_inactive_block_bytes"] = largest_inactive_block\n        detail["inactive_allocator_bytes"] = inactive_allocator_bytes\n        reuse_qualified = largest_inactive_block >= envelope.materialisation_peak_bytes\n        detail["reuse_qualified"] = reuse_qualified\n        if not reuse_qualified:\n            return original_decision, detail\n\n        # Cautious v2 treats allocator blocks explicitly marked inactive as\n        # effective free headroom.  The complete existing candidate envelope is\n        # still charged, so cached bytes are not counted twice: consuming cache\n        # reduces this effective reserve exactly as consuming driver-free memory\n        # would.  Credit only the amount required to satisfy the unchanged\n        # global buffer; never expose the full cache merely because it exists.\n        required_credit = max(\n            0,\n            self._buffer_bytes\n            + envelope.process_envelope_bytes\n            - observation.device_free_bytes,\n        )\n        headroom_credit = min(inactive_allocator_bytes, required_credit)\n        effective_device_free = min(\n            observation.device_total_bytes,\n            observation.device_free_bytes + headroom_credit,\n        )\n        detail["required_allocator_headroom_credit_bytes"] = required_credit\n        detail["allocator_headroom_credit_bytes"] = headroom_credit\n        # Retain the old telemetry key as an alias while the experimental mode\n        # evolves; its meaning is now allocator headroom credit, not a reduction\n        # of the candidate envelope.\n        detail["allocator_credit_bytes"] = headroom_credit\n        detail["effective_device_free_bytes"] = effective_device_free\n\n        adjusted_observation = PrematMemoryObservation(\n            process_allocated_bytes=observation.process_allocated_bytes,\n            process_reserved_bytes=observation.process_reserved_bytes,\n            process_ordinary_peak_bytes=observation.process_ordinary_peak_bytes,\n            device_free_bytes=effective_device_free,\n            device_total_bytes=observation.device_total_bytes,\n        )\n        revised_decision = decide_candidate_admission(\n            observation=adjusted_observation,\n            envelope=envelope,\n            stay_below_current_peak=self._stay_below_current_peak,\n            gpu_memory_buffer_bytes=self._buffer_bytes,\n        )\n        detail["revised_predicted_physical_growth_bytes"] = (\n            revised_decision.predicted_physical_growth_bytes\n        )\n        detail["final_admitted"] = revised_decision.admitted\n        detail["final_reason"] = revised_decision.reason\n        return revised_decision, detail\n'''
          text = text[:start] + new_method + text[end:]

          old_comment = '''    # A CUDA allocator's reserved-but-unused total is not a promise that a\n    # suitably sized block is reusable, especially across streams.  The\n    # ordinary path therefore charges the complete envelope to physical device\n    # use.  Optional allocator-aware admission may later rescue only a rejected\n    # device-headroom decision using stronger evidence about one reusable block.\n'''
          new_comment = '''    # A CUDA allocator's reserved-but-unused total is not a promise that its\n    # storage is actually reusable.  The ordinary path therefore charges the\n    # complete envelope against driver-visible free memory.  Optional cautious\n    # admission may rescue a rejected device-headroom decision only from native\n    # allocator blocks explicitly reported inactive by a live snapshot.\n'''
          if text.count(old_comment) != 1:
              raise RuntimeError("unexpected ordinary admission comment")
          text = text.replace(old_comment, new_comment, 1)
          path.write_text(text)

          test_path = Path("tests/test_premat_allocator_aware_admission.py")
          test_path.write_text('''from __future__ import annotations\n\nimport pytest\nimport torch\n\nfrom sheet.premat import (\n    CandidateEnvelope,\n    PrematMemoryObservation,\n    PrematRuntime,\n    _largest_same_stream_inactive_block_bytes,\n    _total_inactive_allocator_bytes,\n    decide_candidate_admission,\n    validate_premat_configuration,\n)\n\n\ndef _validation_kwargs(mode: str) -> dict[str, object]:\n    return {\n        "premat": "enabled",\n        "attention_mode": "fused",\n        "stay_below_current_peak": False,\n        "stay_within_global_buffer": True,\n        "gpu_memory_buffer_gb": 0.25,\n        "allocator_aware_admission": mode,\n        "target_layer": 1,\n        "weight_matrix_target_order": "r_to_l",\n        "cuda_stream_priority": "normal",\n        "diagnostic_layer_delay_ms": 0.0,\n        "logging": "disabled",\n        "instra": "disabled",\n    }\n\n\ndef _blocked_case() -> tuple[PrematMemoryObservation, CandidateEnvelope]:\n    observation = PrematMemoryObservation(\n        process_allocated_bytes=500,\n        process_reserved_bytes=800,\n        process_ordinary_peak_bytes=1000,\n        device_free_bytes=100,\n        device_total_bytes=1000,\n    )\n    envelope = CandidateEnvelope(\n        retained_bytes=8,\n        materialisation_peak_bytes=8,\n        foreground_overlap_bytes=128,\n    )\n    return observation, envelope\n\n\ndef _runtime() -> PrematRuntime:\n    runtime = PrematRuntime(\n        materialize=lambda _family, _layer: torch.empty(1),\n        n_embd=8,\n        n_head=1,\n        attention_mode="fused",\n        stay_below_current_peak=False,\n        gpu_memory_buffer_gb=200 / (1024 ** 3),\n        allocator_aware_admission="cautious",\n        target_layer=1,\n        weight_matrix_target_order="r_to_l",\n        cuda_stream_priority="normal",\n        diagnostic_layer_delay_ms=0.0,\n        logging_enabled=False,\n    )\n\n    class FakeStream:\n        cuda_stream = 11\n\n    runtime._stream = FakeStream()\n    runtime._device = torch.device("cuda:0")\n    return runtime\n\n\ndef test_largest_same_stream_inactive_block_filters_device_pool_stream_and_state() -> None:\n    snapshot = [\n        {\n            "device": 0,\n            "stream": 11,\n            "segment_type": "small",\n            "blocks": [\n                {"state": "inactive", "size": 8},\n                {"state": "inactive", "size": 16},\n                {"state": "active_allocated", "size": 100},\n                {"state": "active_awaiting_free", "size": 200},\n            ],\n        },\n        {"device": 0, "stream": 11, "segment_type": "large", "blocks": [{"state": "inactive", "size": 1000}]},\n        {"device": 0, "stream": 12, "segment_type": "small", "blocks": [{"state": "inactive", "size": 300}]},\n        {"device": 1, "stream": 11, "segment_type": "small", "blocks": [{"state": "inactive", "size": 400}]},\n    ]\n    assert _largest_same_stream_inactive_block_bytes(\n        snapshot, device_index=0, stream_id=11, request_bytes=8\n    ) == 16\n\n\ndef test_total_inactive_allocator_bytes_counts_only_inactive_current_device() -> None:\n    snapshot = [\n        {\n            "device": 0,\n            "stream": 11,\n            "segment_type": "small",\n            "blocks": [\n                {"state": "inactive", "size": 200},\n                {"state": "active_allocated", "size": 700},\n                {"state": "active_awaiting_free", "size": 800},\n            ],\n        },\n        {"device": 0, "stream": 12, "segment_type": "large", "blocks": [{"state": "inactive", "size": 100}]},\n        {"device": 1, "stream": 11, "segment_type": "small", "blocks": [{"state": "inactive", "size": 900}]},\n    ]\n    assert _total_inactive_allocator_bytes(snapshot, device_index=0) == 300\n\n\ndef test_cautious_rescue_uses_inactive_cache_as_effective_headroom(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = decide_candidate_admission(\n        observation=observation,\n        envelope=envelope,\n        stay_below_current_peak=False,\n        gpu_memory_buffer_bytes=200,\n    )\n    assert original.admitted is False\n    assert original.reason == "global_device_buffer"\n    runtime = _runtime()\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n    monkeypatch.setattr(\n        torch.cuda,\n        "memory_snapshot",\n        lambda: [\n            {"device": 0, "stream": 11, "segment_type": "small", "blocks": [{"state": "inactive", "size": 250}]},\n            {"device": 0, "stream": 12, "segment_type": "large", "blocks": [{"state": "inactive", "size": 50}]},\n        ],\n    )\n    revised, detail = runtime._cautious_allocator_aware_rescue(\n        observation=observation,\n        envelope=envelope,\n        original_decision=original,\n    )\n    assert detail["reuse_qualified"] is True\n    assert detail["inactive_allocator_bytes"] == 300\n    assert detail["required_allocator_headroom_credit_bytes"] == 236\n    assert detail["allocator_headroom_credit_bytes"] == 236\n    assert detail["effective_device_free_bytes"] == 336\n    assert revised.admitted is True\n    assert revised.reason == "admitted"\n    # The full 136-byte envelope is still charged; allocator cache increases\n    # effective headroom rather than being double-counted as zero growth.\n    assert revised.predicted_physical_growth_bytes == 136\n    assert revised.predicted_device_used_bytes == 800\n\n\ndef test_cautious_rescue_remains_rejected_when_inactive_headroom_is_insufficient(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = decide_candidate_admission(\n        observation=observation,\n        envelope=envelope,\n        stay_below_current_peak=False,\n        gpu_memory_buffer_bytes=200,\n    )\n    runtime = _runtime()\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n    monkeypatch.setattr(\n        torch.cuda,\n        "memory_snapshot",\n        lambda: [\n            {"device": 0, "stream": 11, "segment_type": "small", "blocks": [{"state": "inactive", "size": 150}]},\n            {"device": 0, "stream": 12, "segment_type": "large", "blocks": [{"state": "inactive", "size": 50}]},\n        ],\n    )\n    revised, detail = runtime._cautious_allocator_aware_rescue(\n        observation=observation,\n        envelope=envelope,\n        original_decision=original,\n    )\n    assert detail["inactive_allocator_bytes"] == 200\n    assert detail["allocator_headroom_credit_bytes"] == 200\n    assert revised.admitted is False\n    assert revised.reason == "global_device_buffer"\n\n\ndef test_allocator_aware_mode_validation() -> None:\n    validate_premat_configuration(**_validation_kwargs("disabled"))\n    validate_premat_configuration(**_validation_kwargs("cautious"))\n    for mode in ("normal", "aggressive"):\n        with pytest.raises(ValueError, match="not implemented yet"):\n            validate_premat_configuration(**_validation_kwargs(mode))\n\n\ndef test_cautious_rescue_fails_closed_on_snapshot_error(monkeypatch) -> None:\n    observation, envelope = _blocked_case()\n    original = decide_candidate_admission(\n        observation=observation,\n        envelope=envelope,\n        stay_below_current_peak=False,\n        gpu_memory_buffer_bytes=200,\n    )\n    runtime = _runtime()\n    monkeypatch.setattr(torch.cuda.memory, "get_allocator_backend", lambda: "native")\n\n    def fail_snapshot():\n        raise RuntimeError("snapshot failed")\n\n    monkeypatch.setattr(torch.cuda, "memory_snapshot", fail_snapshot)\n    revised, detail = runtime._cautious_allocator_aware_rescue(\n        observation=observation,\n        envelope=envelope,\n        original_decision=original,\n    )\n    assert revised == original\n    assert detail["reuse_qualified"] is False\n    assert "RuntimeError: snapshot failed" in str(detail["snapshot_error"])\n''')
          PY
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib
      - name: Run checks
        shell: bash
        run: |
          python -m compileall -q sheet run_thog2_owt_core.py tests/test_premat_allocator_aware_admission.py
          git diff --check
          python -m pytest -q tests/test_premat_allocator_aware_admission.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet/premat.py tests/test_premat_allocator_aware_admission.py
          git commit -m "Use inactive allocator cache as cautious headroom"
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
