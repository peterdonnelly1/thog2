name: Apply THOG Mods V3

on:
  push:
    paths:
      - .github/workflows/apply-thog-mods-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch series
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "thog-actions"
          git config user.email "thog-actions@users.noreply.github.com"
          python3 .github/scripts/apply_thog_mods_v3.py

      - name: Syntax and contract checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n train_OWT.sh \
            dreedle_gpu_common.sh \
            dreedle_simple_runstring_gpu_0.sh \
            dreedle_simple_runstring_gpu_1.sh \
            scruffy_simple_runstring.sh \
            scruffy_dropout_runstring.sh
          python3 -m py_compile \
            run_thog2_owt.py \
            sheet/wandb_telemetry.py \
            sheet/geometry_registry.py
          bash train_OWT.sh -h | grep -F 'tensorboard | wandb | both | wandb_offline | none'
          grep -F 'DEPTH_CURVE_PLOTS="${THOG2_DEPTH_CURVE_PLOTS:-none}"' train_OWT.sh
          grep -F 'depth-compatible' sheet/geometry_registry.py
          grep -F 'INSTRUMENTATION_BACKENDS = ("tensorboard", "wandb", "both", "none")' sheet/wandb_telemetry.py
          git diff --check HEAD~6..HEAD

      - name: Record success
        shell: bash
        run: |
          set -euo pipefail
          printf 'THOG mods v3 checks passed\n' > .github/thog_mods_v3_ok.txt
          git add .github/thog_mods_v3_ok.txt
          git commit -m "Record THOG mods checks"

      - name: Push code commits
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:master
