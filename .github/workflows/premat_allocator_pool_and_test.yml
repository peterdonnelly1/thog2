name: Temporary Premat allocator-aware pool/test

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement
    paths:
      - .github/workflows/premat_allocator_pool_and_test.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tighten cautious pool qualification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              "sheet/premat.py",
              '''def _largest_same_stream_inactive_block_bytes(\n    snapshot: Sequence[Mapping[str, object]],\n    *,\n    stream_id: int,\n) -> int:\n    """Return the largest single inactive allocator block for one CUDA stream.\n\n    Cautious admission deliberately does not sum fragmented blocks.  A block\n    must individually cover the complete premat materialisation peak before we\n    claim that candidate-owned allocation need not grow physical device usage.\n    """\n    largest = 0\n    for segment in snapshot:\n        if not isinstance(segment, Mapping):\n            raise ValueError("CUDA allocator snapshot contains a non-mapping segment")\n        if int(segment.get("stream", -1)) != int(stream_id):\n            continue\n        blocks = segment.get("blocks")\n''',
              '''def _allocator_pool_for_request(size_bytes: int) -> str:\n    # PyTorch's native CUDA allocator defines the largest small allocation as\n    # 1 MiB (kSmallSize).  Derive the pool from the actual candidate size so\n    # model width/dtype changes cannot invalidate cautious admission.\n    return "small" if int(size_bytes) <= 1024 ** 2 else "large"\n\n\ndef _largest_same_stream_inactive_block_bytes(\n    snapshot: Sequence[Mapping[str, object]],\n    *,\n    stream_id: int,\n    request_bytes: int,\n) -> int:\n    """Return the largest compatible inactive block for one CUDA stream.\n\n    Cautious admission deliberately does not sum fragmented blocks.  A block\n    must be in the allocator pool used by the request and individually cover\n    the complete premat materialisation peak before we claim that\n    candidate-owned allocation need not grow physical device usage.\n    """\n    largest = 0\n    required_pool = _allocator_pool_for_request(request_bytes)\n    for segment in snapshot:\n        if not isinstance(segment, Mapping):\n            raise ValueError("CUDA allocator snapshot contains a non-mapping segment")\n        if int(segment.get("stream", -1)) != int(stream_id):\n            continue\n        if segment.get("segment_type") != required_pool:\n            continue\n        blocks = segment.get("blocks")\n''',
          )
          replace_once(
              "sheet/premat.py",
              '''            largest_inactive_block = _largest_same_stream_inactive_block_bytes(\n                snapshot,\n                stream_id=stream_id,\n            )\n''',
              '''            largest_inactive_block = _largest_same_stream_inactive_block_bytes(\n                snapshot,\n                stream_id=stream_id,\n                request_bytes=envelope.materialisation_peak_bytes,\n            )\n''',
          )

          test_path = Path("tests/test_premat_allocator_aware_admission.py")
          text = test_path.read_text()
          text = text.replace(
              '''            "stream": 11,\n            "blocks": [\n''',
              '''            "stream": 11,\n            "segment_type": "small",\n            "blocks": [\n''',
              1,
          )
          text = text.replace(
              '''        {"stream": 12, "blocks": [{"state": "inactive", "size": 300}]},\n    ]\n    assert _largest_same_stream_inactive_block_bytes(snapshot, stream_id=11) == 16\n''',
              '''        {"stream": 11, "segment_type": "large", "blocks": [{"state": "inactive", "size": 1000}]},\n        {"stream": 12, "segment_type": "small", "blocks": [{"state": "inactive", "size": 300}]},\n    ]\n    assert _largest_same_stream_inactive_block_bytes(\n        snapshot, stream_id=11, request_bytes=8\n    ) == 16\n''',
              1,
          )
          text = text.replace(
              '''            {"stream": 11, "blocks": [{"state": "inactive", "size": 8}]},\n            {"stream": 12, "blocks": [{"state": "inactive", "size": 1000}]},\n''',
              '''            {"stream": 11, "segment_type": "small", "blocks": [{"state": "inactive", "size": 8}]},\n            {"stream": 11, "segment_type": "large", "blocks": [{"state": "inactive", "size": 1000}]},\n            {"stream": 12, "segment_type": "small", "blocks": [{"state": "inactive", "size": 1000}]},\n''',
              1,
          )
          test_path.write_text(text)
          PY
      - name: Install test dependencies
        run: python -m pip install -q pytest torch matplotlib
      - name: Run checks
        shell: bash
        run: |
          python -m compileall -q sheet run_thog2_owt_core.py tests/test_premat_allocator_aware_admission.py
          git diff --check
          python -m pytest -q tests/test_premat_allocator_aware_admission.py tests/test_premat_headroom_policy.py tests/test_stage1_core_smoke.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet/premat.py tests/test_premat_allocator_aware_admission.py
          git commit -m "Tighten cautious allocator pool matching"
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
