name: temporary Processing group order repair

on:
  push:
    branches:
      - THOG2_Dynamic_Prematerialisation_Enhancement

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Trigger Processing group order repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: THOG2_Dynamic_Prematerialisation_Enhancement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply repair
        run: python tools/_tmp_processing_group_order.py
      - name: JavaScript syntax
        run: |
          node --check sheet/local_dashboard_assets/dashboard_processing.js
          node --check sheet/local_dashboard_assets/dashboard_wandb_groups_patch.js
      - name: Diff hygiene
        run: git diff --check
      - name: Targeted Processing tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy torch plotly
          pytest -q tests/test_premat_processing.py
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No implementation changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sheet/local_dashboard_assets/dashboard_processing.js sheet/local_dashboard_assets/dashboard_wandb_groups_patch.js tests/test_premat_processing.py
          git commit -m 'Place Processing after Val in chart stack'
          git push origin HEAD:THOG2_Dynamic_Prematerialisation_Enhancement
