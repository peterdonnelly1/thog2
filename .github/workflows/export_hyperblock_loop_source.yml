name: Export HYPERBLOCK loop source

on:
  push:
    branches:
      - HYPERBLOCK_LOOP_ENHANCEMENTS

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: |
          tar --exclude=.git -czf /tmp/thog2-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: thog2-source-${{ github.sha }}
          path: /tmp/thog2-source.tar.gz
          retention-days: 1
